name: Draft release

# Keeps exactly one rolling draft release on master, tagged with the version
# the next release will publish (<esphome>.<next sub>, same computation the
# Release workflow uses). Publishing the draft creates the tag, which runs the
# Release workflow and ships the firmware — a human only presses the button.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    name: Refresh the release draft
    # Master only: a dispatch from another branch must not delete the master
    # draft and replace it with that branch's content.
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, ubuntu-latest]
    # Concurrency lives on the job, not the workflow: a workflow-level group
    # is claimed before the `if` above runs, so an off-master dispatch would
    # enter the group, replace a pending master refresh, and then skip —
    # leaving the draft stale. A skipped job never joins the group.
    # The group is deliberately NOT shared with the Release workflow: GitHub
    # keeps a single pending run per group and a newly queued run replaces it,
    # so sharing would let a routine master push evict a queued release
    # publisher. The version race that sharing would have prevented is closed
    # by the tag-freedom check right before the draft is created instead.
    # Not cancellable: a run killed mid-refresh could leave the draft deleted.
    concurrency:
      group: draft-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Existing tags decide the next version; a shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail
          git fetch --quiet --force origin 'refs/tags/*:refs/tags/*'
          VERSION=$(git tag --list | python scripts/release-version.py)
          echo "Next release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # One rolling draft: stale drafts (any other tag) are deleted, and
          # the draft for this version is recreated so the generated notes
          # cover the latest master. Manual edits to the draft are overwritten
          # by design — the draft is workflow-owned. Each release is re-checked
          # as a draft right before deletion: one published in the race window
          # between the listing and this loop must not be deleted.
          while read -r tag; do
            IS_DRAFT=$(gh release view "$tag" --repo "$REPO" \
              --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Deleting stale release draft $tag"
              gh release delete "$tag" --repo "$REPO" --yes
            fi
          done < <(gh api --paginate "repos/$REPO/releases" \
            --jq '.[] | select(.draft) | .tag_name')

          # The version was computed from the tag listing at the top; a
          # release publishing concurrently may have claimed it since. gh
          # would silently reuse the existing tag and pin the draft to the
          # wrong commit — refuse instead. The next master push computes the
          # then-next number and rebuilds the draft.
          # --exit-code semantics: 0 = the ref was found, 2 = none matched;
          # anything else is a transport failure and must not read as free.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::tag $VERSION was claimed while this draft was being prepared — a release published concurrently; the next master push rebuilds the draft"
            exit 1
          fi
          if [ "$rc" -ne 2 ]; then
            echo "::error::git ls-remote failed (exit $rc) — cannot verify the tag is unclaimed"
            exit 1
          fi

          gh release create "$VERSION" --repo "$REPO" --draft \
            --target "$SHA" --title "$VERSION" --generate-notes \
            --notes "Auto-draft for \`$VERSION\`. Publishing runs the Release workflow: every firmware is built, the binaries land here as assets, and the \`upload: true\` ones ship to fw.jethome.com."
          echo "Draft $VERSION refreshed" >> "$GITHUB_STEP_SUMMARY"
