name: Build

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The homeassistant time source takes no timezone of its own, so ESPHome bakes
  # the build machine's in as its initial one. Pin the runner to keep builds
  # identical.
  TZ: Etc/UTC

jobs:
  discover:
    name: Discover configs
    runs-on: [self-hosted, ubuntu-latest]
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v7

      # Same key as the lint job: whoever runs first primes the cache for
      # both.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the manifest tooling
        run: pip install -r requirements-dev.txt

      # firmwares.yaml is the single source of truth for what gets built.
      - name: List device configs
        id: list
        run: |
          # pipefail: a firmware-matrix.py failure must not read as an empty
          # list — that would surface later as a cryptic fromJson error.
          set -o pipefail
          configs=$(python scripts/firmware-matrix.py build |
            jq -c '[.include[].config]')
          echo "Found: $configs"
          if [ "$configs" = "[]" ]; then
            echo "No device configs in firmwares.yaml" >&2
            exit 1
          fi
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.config }}
    needs: discover
    runs-on: [self-hosted, ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # The fast schema gate: pure validation, no PlatformIO toolchain, so a
      # broken config fails in ~a minute instead of after the toolchain
      # restore in the build job.
      - name: Validate
        run: esphome config "${{ matrix.config }}"

  build:
    name: ${{ matrix.config }}
    needs: [discover, validate]
    runs-on: [self-hosted, ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # The ESP-IDF toolchain is ~2 GB and identical across configs, so key the
      # cache on the ESPHome pin rather than on the config being built.
      # Only dev writes: a cache saved off the default branch is visible to
      # every run, while saves from PRs and from other branches are
      # branch-scoped — invisible elsewhere while burning the shared 10 GB
      # quota, and on an esphome bump every matrix job would upload its own
      # multi-GB archive for nothing.
      - name: Restore toolchain cache
        if: github.ref != 'refs/heads/dev'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: toolchains-${{ hashFiles('requirements.txt') }}
          restore-keys: toolchains-

      - name: Cache toolchains
        if: github.ref == 'refs/heads/dev'
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: toolchains-${{ hashFiles('requirements.txt') }}
          restore-keys: toolchains-

      - name: Compile
        run: esphome compile "${{ matrix.config }}"

  dist:
    name: Check dist/ is current
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # dist/ is generated and committed; a stale copy would be served to the
      # ESPHome Builder long after the source configs moved on.
      - name: Verify generated configs
        run: python scripts/build-dist.py --check

  lint:
    name: Lint
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pre-commit
        run: pip install -r requirements-dev.txt

      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # build-dist is the dist job's business, and the one hook that would drag
      # a full esphome install in here.
      - name: Run hooks
        env:
          SKIP: build-dist
        run: pre-commit run --all-files --show-diff-on-failure

  # The single stable check name for branch protection: the matrix jobs above
  # are named after firmware paths, and required checks match exact names —
  # one aggregate keeps the rules working when the firmware list changes.
  # Every need must have succeeded: a skipped job (an upstream failure) is as
  # disqualifying as a failed one, or a discover failure would let this pass
  # with zero firmware validated or compiled.
  ci-ok:
    name: ci-ok
    needs: [discover, validate, build, dist, lint]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - name: Require all checks green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          if ! jq -e 'all(. == "success")' <<< "$RESULTS" >/dev/null; then
            echo "::error::not every required check succeeded: $RESULTS"
            exit 1
          fi
          echo "All required checks passed"
