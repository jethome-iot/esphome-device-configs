name: Build

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The homeassistant time source takes no timezone of its own, so ESPHome bakes
  # the build machine's in as its initial one. Pin the runner to keep builds
  # identical.
  TZ: Etc/UTC

jobs:
  discover:
    name: Discover configs
    runs-on: [self-hosted, ubuntu-latest]
    outputs:
      configs: ${{ steps.list.outputs.configs }}
    steps:
      - uses: actions/checkout@v7

      # Same key as the lint job: whoever runs first primes the cache for
      # both.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the manifest tooling
        run: pip install -r requirements-dev.txt

      # firmwares.yaml is the single source of truth for what gets built.
      - name: List device configs
        id: list
        run: |
          # pipefail: a firmware-matrix.py failure must not read as an empty
          # list — that would surface later as a cryptic fromJson error.
          set -o pipefail
          configs=$(python scripts/firmware-matrix.py build |
            jq -c '[.include[].config]')
          echo "Found: $configs"
          if [ "$configs" = "[]" ]; then
            echo "No device configs in firmwares.yaml" >&2
            exit 1
          fi
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate ${{ matrix.config }}
    needs: discover
    runs-on: [self-hosted, ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # The fast schema gate: pure validation, no PlatformIO toolchain, so a
      # broken config fails in ~a minute instead of after the toolchain
      # restore in the build job.
      - name: Validate
        run: esphome config "${{ matrix.config }}"

  build:
    name: ${{ matrix.config }}
    needs: [discover, validate]
    runs-on: [self-hosted, ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover.outputs.configs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # The ESP-IDF toolchain is ~2 GB and identical across configs, so key the
      # cache on the ESPHome pin rather than on the config being built.
      # Only dev writes: a cache saved off the default branch is visible to
      # every run, while saves from PRs and from other branches are
      # branch-scoped — invisible elsewhere while burning the shared 10 GB
      # quota, and on an esphome bump every matrix job would upload its own
      # multi-GB archive for nothing.
      - name: Restore toolchain cache
        if: github.ref != 'refs/heads/dev'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: toolchains-${{ hashFiles('requirements.txt') }}
          restore-keys: toolchains-

      - name: Cache toolchains
        if: github.ref == 'refs/heads/dev'
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: toolchains-${{ hashFiles('requirements.txt') }}
          restore-keys: toolchains-

      # esphome turns ccache on by itself when the binary is on PATH — this
      # job only installs it, points it at a directory of its own, rolls its
      # storage and reports the stats. esphome's own defaults put the cache
      # inside ~/.cache/esphome (different subdir per framework) — a preset
      # CCACHE_DIR is respected by every esphome code path and keeps the
      # compile cache out of the toolchain cache entirely.
      # The cache rolls because actions/cache keys are immutable: restore the
      # freshest entry for this firmware by prefix, save under a per-run key.
      # Saved even on failure — a retry starts warm; the quota's LRU keeps
      # the prefix bounded.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.config }}--${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.config }}--

      - name: Ensure ccache
        # Workflows rely only on the stock GitHub-hosted runner baseline;
        # the image may add tools but never subtract. Probe first — the
        # image's own version, when present, always wins over the distro's.
        run: |
          if command -v ccache >/dev/null 2>&1; then
            echo "ccache already on PATH: $(ccache --version | head -1)"
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends ccache \
            || { sudo apt-get update \
                 && sudo apt-get install -y --no-install-recommends ccache; }

      - name: Compile
        run: |
          # The stats commands and esphome's builds must share one cache dir,
          # and the compiler is verified by content — the toolchain arrives
          # from the cache at a stable path, and the default mtime check
          # would misfire restored entries as misses.
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_COMPILERCHECK=content
          ccache --zero-stats > /dev/null
          esphome compile "${{ matrix.config }}"
          ccache --show-stats

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.config }}--${{ github.run_id }}-${{ github.run_attempt }}

  dist:
    name: Check dist/ is current
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      # dist/ is generated and committed; a stale copy would be served to the
      # ESPHome Builder long after the source configs moved on.
      - name: Verify generated configs
        run: python scripts/build-dist.py --check

  lint:
    name: Lint
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pre-commit
        run: pip install -r requirements-dev.txt

      - name: Cache hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # build-dist is the dist job's business, and the one hook that would drag
      # a full esphome install in here.
      - name: Run hooks
        env:
          SKIP: build-dist
        run: pre-commit run --all-files --show-diff-on-failure

  # The single stable check name for branch protection: the matrix jobs above
  # are named after firmware paths, and required checks match exact names —
  # one aggregate keeps the rules working when the firmware list changes.
  # Every need must have succeeded: a skipped job (an upstream failure) is as
  # disqualifying as a failed one, or a discover failure would let this pass
  # with zero firmware validated or compiled.
  ci-ok:
    name: ci-ok
    needs: [discover, validate, build, dist, lint]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - name: Require all checks green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          set -euo pipefail
          if ! jq -e 'all(. == "success")' <<< "$RESULTS" >/dev/null; then
            echo "::error::not every required check succeeded: $RESULTS"
            exit 1
          fi
          echo "All required checks passed"
