# Serial settings menu items for graphical_display_menu
# Include this file in packages to add UART configuration to the Settings menu
# This extends the existing menu items defined in jxd-r6-e1eth-display.yaml

graphical_display_menu:
  items:
    - id: !extend menu_settings_id
      items:
        - type: menu
          text: "Serial"
          items:
            - type: label
              text: "Baudrate"

            - type: select
              text: "Modbus"
              select: uart2_baudrate_select

            - type: select
              text: "Aux"
              select: uart1_baudrate_select

            - type: label
              text: "Modbus: RS-485"
