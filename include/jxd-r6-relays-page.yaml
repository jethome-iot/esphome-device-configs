globals:
   - id: active_relay_num
     type: int
     restore_value: no
     initial_value: '1'

display:
  - platform: ssd1306_i2c
    id: !extend ${display_settings_id}
    pages:
      - id: relays_page
        lambda: |-
          auto black = Color(0, 0, 0);
          //it.filled_rectangle(0, 0, 128, 13);
          it.print(1, 0, id(f6x12), "RELAYS");

          // Dynamically render relays based on group size
          size_t relay_count = id(relays_group_id).items().size();
          int rect_width = 17;
          int spacing = 5;
          int x = 0;
          for (size_t i = 0; i < relay_count; i++) {
            int relay_num = i + 1;
            
            // Get relay entity and cast to Switch
            auto *relay = static_cast<esphome::switch_::Switch *>(id(relays_group_id).items()[i]);
            
            // Draw rectangle
            it.rectangle(x, 16, 17, 35);
            
            // Draw number with selection highlight
            if (id(active_relay_num) == relay_num) {
              it.filled_rectangle(x, 52, 17, 12);
              it.printf(x + 4, 52, id(f6x12), black, "%d", relay_num);
            } else {
              it.printf(x + 4, 52, id(f6x12), "%d", relay_num);
            }
            
            // Draw relay state indicator
            if (relay->state) {
              it.filled_rectangle(x + 2, 18, 13, 15);
              it.circle(x + 8, 25, 3, black);
            } else {
              it.filled_rectangle(x + 2, 34, 13, 15);
              it.filled_circle(x + 8, 41, 3, black);
            }
            
            x += rect_width + spacing;
          }
