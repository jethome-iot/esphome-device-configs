# UART baudrate settings
# This file defines configurable baudrate settings for UART interfaces
# Settings are stored in flash and persist across reboots
# Changes take effect immediately without requiring a reboot

# UART1 baudrate select
select:
  - platform: template
    id: uart1_baudrate_select
    name: "UART1 Baudrate"
    optimistic: true
    options:
      - "1200"
      - "2400"
      - "4800"
      - "9600"
      - "19200"
      - "38400"
      - "57600"
      - "115200"
    initial_option: "9600"
    restore_value: true
    entity_category: config
    icon: mdi:swap-horizontal
    on_value:
      - script.execute:
          id: apply_uart1_baudrate
          baud: !lambda 'return stoi(x);'

  # UART2 baudrate select
  - platform: template
    id: uart2_baudrate_select
    name: "UART2 Baudrate"
    optimistic: true
    options:
      - "1200"
      - "2400"
      - "4800"
      - "9600"
      - "19200"
      - "38400"
      - "57600"
      - "115200"
    initial_option: "9600"
    restore_value: true
    entity_category: config
    icon: mdi:swap-horizontal
    on_value:
      - script.execute:
          id: apply_uart2_baudrate
          baud: !lambda 'return stoi(x);'

script:
  # Every menu keypress commits the select, so debounce: reconfigure the port once,
  # after the user stops scrolling.
  - id: apply_uart1_baudrate
    mode: restart
    parameters:
      baud: int
    then:
      - delay: 1s
      - lambda: |-
          if (baud <= 0 || id(jxm_uart1).get_baud_rate() == (uint32_t) baud)
            return;
          ESP_LOGI("uart_settings", "UART1: %u -> %u baud",
                   (unsigned) id(jxm_uart1).get_baud_rate(), (unsigned) baud);
          id(jxm_uart1).flush();
          id(jxm_uart1).set_baud_rate((uint32_t) baud);
          id(jxm_uart1).load_settings();

  - id: apply_uart2_baudrate
    mode: restart
    parameters:
      baud: int
    then:
      - delay: 1s
      - lambda: |-
          if (baud <= 0 || id(jxm_uart2).get_baud_rate() == (uint32_t) baud)
            return;
          ESP_LOGI("uart_settings", "UART2: %u -> %u baud",
                   (unsigned) id(jxm_uart2).get_baud_rate(), (unsigned) baud);
          id(jxm_uart2).flush();
          id(jxm_uart2).set_baud_rate((uint32_t) baud);
          id(jxm_uart2).load_settings();
          // Modbus caches its frame delays from the baud rate in setup() only.
          id(modbus_jxd).setup();
