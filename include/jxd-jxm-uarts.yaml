# UART configuration for JXD JXM devices
# This file defines the UART interfaces used for RS485 communication
#
# Usage:
#   Add to your device configuration:
#   packages:
#     jxd_jxm_uarts: !include include/jxd-jxm-uarts.yaml
#     uart_settings: !include include/uart-settings.yaml
#
# Hardware:
#   UART1 (GPIO33/34) - CPU module peripheral UART; no consumer in this firmware
#   UART2 (GPIO32/39) - RS-485 connector JXM2; carries the Modbus RTU server
#
# Note: baudrate is configurable at runtime via uart-settings.yaml; the values
#       below are the power-on defaults used until the stored one is restored.

uart:
  # UART1 - peripheral UART, unused here
  - id: jxm_uart1
    tx_pin: GPIO33
    rx_pin: GPIO34
    baud_rate: 9600
    stop_bits: 1
    # data_bits: 8  # Default
    # parity: NONE  # Default

  # UART2 - RS-485 (JXM2), Modbus RTU server
  - id: jxm_uart2
    tx_pin: GPIO32
    rx_pin: GPIO39
    baud_rate: 9600
    stop_bits: 1
    # data_bits: 8  # Default
    # parity: NONE  # Default
