display:
  - platform: ssd1306_i2c
    id: display1
    model: "SSD1306_128X64"
    address: 0x3C
    update_interval: 200ms
    pages:
      - id: main_page
        lambda: |-
          const auto width = it.get_width();
          const auto height = it.get_height();
          uint8_t mac[6];
          get_mac_address_raw(mac);
          
          it.printf(width / 2, height / 2, id(f6x12), TextAlign::CENTER, "${friendly_name}");

      - id: blank_page
        lambda: return;

graphical_display_menu:
  id: display_menu
  font: f7x14_mod2
  display: display1
  active: false
  fill_row: true
  shrink_label: true
  restore_page: false
  right_for_menu_enter: false
  on_redraw:
    then:
      component.update: display1
