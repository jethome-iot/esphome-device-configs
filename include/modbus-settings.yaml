# Modbus settings
# This file defines configurable Modbus settings
# Settings are stored in flash and persist across reboots

# Modbus server address
number:
  - platform: template
    id: modbus_address_number
    name: "Modbus Address"
    optimistic: true
    min_value: 1
    max_value: 247
    step: 1
    initial_value: 1
    restore_value: true
    entity_category: config
    icon: mdi:identifier
    mode: box
    on_value:
      - script.execute:
          id: apply_modbus_address
          address: !lambda 'return (int) x;'

script:
  # Every menu keypress commits the number, so debounce: without it the server would
  # briefly answer on every address scrolled past.
  - id: apply_modbus_address
    mode: restart
    parameters:
      address: int
    then:
      - delay: 1s
      - lambda: |-
          if (address < 1 || address > 247 || (int) id(modbus_server_group_config).get_address() == address)
            return;
          ESP_LOGI("modbus_settings", "Modbus server address -> %d (0x%02X)", address, address);
          id(modbus_server_group_config).set_address((uint8_t) address);
