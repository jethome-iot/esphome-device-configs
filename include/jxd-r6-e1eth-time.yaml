time:
# RTC PCF8563
  - platform: pcf8563
    id: pcf8563_time
    address: 0x51
    timezone: ${timezone}
    update_interval: 15min
# Getting time from ntp
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
# Time synchronization
    on_time_sync:
      then:
        pcf8563.write_time:
