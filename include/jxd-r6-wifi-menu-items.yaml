# WiFi-specific menu items for graphical_display_menu
# Include this file in packages when using WiFi instead of Ethernet
# This extends the existing menu items defined in jxd-r6-e1eth-display.yaml

graphical_display_menu:
  items:
    - id: !extend info_submenu
      items:
        - type: label
          text: "IP(WiFi):"
        
        - type: label
          text: !lambda |-
            std::string res;
            if (id(captive_portal_id).is_active()) {
              // IPAddress::str() removed in 2026.8; str_to() takes a caller-owned buffer
              char buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
              res = id(wifi_id).wifi_soft_ap_ip().str_to(buf);
            }
            else {
              res = id(ip).state;
            }
            return " " + res;

        - type: label
          text: "MAC:"

        - type: label
          text: !lambda |-
            return " " + id(mac_wifi).state;

    - id: !extend menu_settings_id
      items:
        - type: menu
          text: "Reset WiFi creds"
          items:
            - type: label

              text: "Reset?"

            - type: command
              text: "Yes"
              id: wifi_reset_yes
              on_value:
                - lambda: |-
                    id(wifi_reset_yes)->set_text("Yes - OK");
                - delay: 1s
                - script.execute: reset_wifi
