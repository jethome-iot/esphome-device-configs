display:
  - platform: ssd1306_i2c
    id: !extend ${display_settings_id}
    pages:
      - id: inputs_page
        lambda: |-
          auto black = Color(0, 0, 0);
          //it.filled_rectangle(0, 0, 128, 13);
          it.print(1, 0, id(f6x12), "INPUTS");

          // I1
          it.rectangle(0, 16, 17, 35);
          it.print(4, 52, id(f6x12), "1");
          if (id(input_1).state) {
            it.filled_rectangle(2, 18, 13, 15);
            it.triangle(8, 22, 5, 28, 11, 28, black);
          } else {
            it.filled_rectangle(2, 34, 13, 15);

            it.filled_triangle(8, 45, 5, 39, 11, 39, black);
          }

          //I2
          it.rectangle(22, 16, 17, 35);
          it.print(28, 52, id(f6x12), "2");
          if (id(input_2).state) {
            it.filled_rectangle(24, 18, 13, 15);
            it.triangle(30, 22, 27, 28, 33, 28, black);
          } else {
            it.filled_rectangle(24, 34, 13, 15);
            it.filled_triangle(30, 45, 27, 39, 33, 39, black);
          }

          //I3
          it.rectangle(44, 16, 17, 35);
