            it.filled_triangle(52, 45, 49, 39, 55, 39, black);
          }

          //I4
          it.rectangle(66, 16, 17, 35);
          it.print(70, 52, id(f6x12), "4");
          if (id(input_4).state) {
            it.filled_rectangle(68, 18, 13, 15);
