display:
  - platform: ssd1306_i2c
    id: !extend ${display_settings_id}
    pages:
      - id: inputs_page
        lambda: |-
          auto black = Color(0, 0, 0);
          //it.filled_rectangle(0, 0, 128, 13);
          it.print(1, 0, id(f6x12), "INPUTS");

          // Dynamically render inputs based on group size
          size_t input_count = id(digital_inputs_group_id).items().size();
          int rect_width = 17;
          int spacing = 5;
          int x = 0;
          for (size_t i = 0; i < input_count; i++) {
            int input_num = i + 1;
            
            // Get input entity and cast to BinarySensor
            auto *input = static_cast<esphome::binary_sensor::BinarySensor *>(id(digital_inputs_group_id).items()[i]);
            
            // Draw rectangle
            it.rectangle(x, 16, 17, 35);
            
            // Draw number
            it.printf(x + 4, 52, id(f6x12), "%d", input_num);
            
            // Draw input state indicator
            if (input->state) {
              it.filled_rectangle(x + 2, 18, 13, 15);
              it.triangle(x + 8, 22, x + 5, 28, x + 11, 28, black);
            } else {
              it.filled_rectangle(x + 2, 34, 13, 15);
              it.filled_triangle(x + 8, 45, x + 5, 39, x + 11, 39, black);
            }
            
            x += rect_width + spacing;
          }
