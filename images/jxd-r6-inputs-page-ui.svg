<?xml version="1.0" encoding="UTF-8"?>
<svg width="768" height="384" viewBox="0 0 128 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="128" height="64" fill="#000000"/>
  
  <!-- Header -->
  <text x="5" y="12" font-family="monospace" font-size="12" fill="#FFFFFF">INPUTS</text>
  
  <!-- Input 1 - ON -->
  <g id="input1">
    <rect x="5" y="16" width="17" height="35" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <!-- ON state - filled top with up triangle -->
    <rect x="7" y="18" width="13" height="15" fill="#FFFFFF"/>
    <polygon points="13,22 10,28 16,28" fill="none" stroke="#000000" stroke-width="1"/>
    <!-- Normal number -->
    <text x="9" y="60" font-family="monospace" font-size="10" fill="#FFFFFF">1</text>
  </g>
  
  <!-- Input 2 - OFF -->
  <g id="input2">
    <rect x="25" y="16" width="17" height="35" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <!-- OFF state - filled bottom with down filled triangle -->
    <rect x="27" y="34" width="13" height="15" fill="#FFFFFF"/>
    <polygon points="33,45 30,39 36,39" fill="#000000"/>
    <!-- Normal number -->
    <text x="29" y="60" font-family="monospace" font-size="10" fill="#FFFFFF">2</text>
  </g>
  
  <!-- Input 3 - ON -->
  <g id="input3">
    <rect x="45" y="16" width="17" height="35" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <!-- ON state - filled top with up triangle -->
    <rect x="47" y="18" width="13" height="15" fill="#FFFFFF"/>
    <polygon points="53,22 50,28 56,28" fill="none" stroke="#000000" stroke-width="1"/>
    <!-- Normal number -->
    <text x="49" y="60" font-family="monospace" font-size="10" fill="#FFFFFF">3</text>
  </g>
  
  <!-- Input 4 - OFF -->
  <g id="input4">
    <rect x="65" y="16" width="17" height="35" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <!-- OFF state - filled bottom with down filled triangle -->
    <rect x="67" y="34" width="13" height="15" fill="#FFFFFF"/>
    <polygon points="73,45 70,39 76,39" fill="#000000"/>
    <!-- Normal number -->
    <text x="69" y="60" font-family="monospace" font-size="10" fill="#FFFFFF">4</text>
  </g>
  
  <!-- Input 5 - ON -->
  <g id="input5">
    <rect x="85" y="16" width="17" height="35" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <!-- ON state - filled top with up triangle -->
    <rect x="87" y="18" width="13" height="15" fill="#FFFFFF"/>
    <polygon points="93,22 90,28 96,28" fill="none" stroke="#000000" stroke-width="1"/>
    <!-- Normal number -->
    <text x="89" y="60" font-family="monospace" font-size="10" fill="#FFFFFF">5</text>
  </g>
  
  <!-- Input 6 - OFF -->
  <g id="input6">
    <rect x="105" y="16" width="17" height="35" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <!-- OFF state - filled bottom with down filled triangle -->
    <rect x="107" y="34" width="13" height="15" fill="#FFFFFF"/>
    <polygon points="113,45 110,39 116,39" fill="#000000"/>
    <!-- Normal number -->
    <text x="109" y="60" font-family="monospace" font-size="10" fill="#FFFFFF">6</text>
  </g>
</svg>

