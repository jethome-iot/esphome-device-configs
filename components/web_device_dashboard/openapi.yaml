openapi: 3.1.0

info:
  title: web_device_dashboard HTTP API
  version: 1.0.0
  description: >-
    The device API behind the dashboard page, served by the ESPHome
    `web_device_dashboard` component on the device's own web server under
    `/api/device/`: the device identity (with the CPU board's EEPROM record when
    a `jethome_board_info` is wired in), the runtime status, the live network
    link, on a firmware with a `web_auth` the HTTP credentials, on one with an
    `mqtt_config` the MQTT client's settings and state and with an
    `mqtt_subscriptions` its subscription slots, and — on a firmware with
    a `config_json` store — the per-entity settings and their form fields.
    ESP-IDF (ESP32) only.

    This document is the wire contract; the TypeScript client in `client/device`
    implements it and the dashboard repository's dev server mocks it. Reads
    answer GET only and writes POST only, `auth`, `entity-settings`, `mqtt` and
    `mqtt/subscriptions` both (a read on GET, a write on POST); any other method
    is `405` with an `Allow` header. Route names match the URL path exactly, so
    an unknown name under the prefix is `404`. A POST needs a `Content-Length`, even `0`:
    ESP-IDF's server answers `411` without one. Every failure is
    `{"success": false, "error"}`.

    A request whose `Origin` header is not the `Host` it was sent to is answered
    `403` before it reaches a route: the credentials a browser has cached for
    this device cannot be steered here from a page on another site. That refusal
    is `text/plain`, not one of the JSON envelopes below — it is the server
    turning the request away, not a route answering it. Clients that send no
    `Origin` — `curl`, a script, a Home Assistant `rest_command` — are
    unaffected. Every route that reads a JSON body also demands
    `Content-Type: application/json`, a type no HTML form can send, and answers
    `415` without it.

    The page itself is outside this document: `GET /` answers it as `text/html`
    with `Content-Encoding: gzip` and `Cache-Control: public, max-age=3600`, and
    any other method on `/` is `405`. The entity state and control the page uses
    are `web_server`'s own routes and its `/events` stream, typed in
    `client/rest`.

servers:
  - url: http://{host}:{port}/api/device
    description: A device on the local network. The prefix is fixed.
    variables:
      host:
        default: device.local
      port:
        default: "80"

# The routes inherit whatever auth the `web_server:` block sets. The configs in
# this repository set Digest credentials, so that is the shipped default; the
# empty requirement covers a firmware built without an `auth:` block, where
# anything that reaches the port may call every route.
security:
  - webServerAuth: []
  - {}

tags:
  - name: read
    description: Read-only routes (GET).
  - name: write
    description: Mutating routes (POST).

paths:
  /info:
    get:
      tags: [read]
      operationId: getInfo
      summary: The device identity.
      description: >-
        `name` is the friendly name, or the node name without one. `mac_address`
        is the Ethernet MAC on a build with Ethernet, else the chip's base MAC,
        which `base_mac_address` always carries. With a `board_info_id`, what the
        firmware read from the CPU board's EEPROM: `serial_number`,
        `device_model` and `hw_revision` from the `device.id` record (the serial
        from the header on a v3 board that predates it), each only when the
        EEPROM has it, and `board`, the record verbatim plus the chip's eFuses.
      responses:
        "200":
          description: The identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /status:
    get:
      tags: [read]
      operationId: getStatus
      summary: The runtime status.
      description: Polled by the page every few seconds.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /network:
    get:
      tags: [read]
      operationId: getNetwork
      summary: The live network link.
      description: >-
        The active interface with its address, gateway, mask and DNS servers, and
        the SSID and RSSI on WiFi. Ethernet wins when both links are up.
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /auth:
    get:
      tags: [read]
      operationId: getAuth
      summary: The credentials the server checks.
      description: >-
        The username and how long the password is; the password itself is never
        answered. `is_default` says the device still takes the pair the firmware
        was built with. Only on a firmware with a `web_auth`; without one this
        route is the prefix's plain 404.
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoWebAuth"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthNotReady"
    post:
      tags: [write]
      operationId: setAuth
      summary: Replace the credentials.
      description: >-
        Both fields are required and are sent as they will be typed — this
        request carries the new password in the clear, whatever scheme the
        firmware checks with. The pair is stored and applied from the device's
        main loop, so this request still answers under the old one and the next
        request needs the new one; a browser asks for it again on the page's next
        call. A username is at most 32 characters and a password at most 64, both
        printable ASCII, and a username may not contain `:`, `"` or `\`. The
        request must say `Content-Type: application/json`, a type no HTML form
        can send: that is what keeps a page on another site from steering a
        browser's cached credentials at this route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthUpdate"
      responses:
        "200":
          description: >-
            Accepted: the pair passed validation and is queued for the next turn
            of the device's main loop, which is the only task that may write the
            flash preferences. A store that fails there leaves the old pair in
            force and says so in the device log; a client that needs to know
            confirms with a `GET` of this route under the new credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
                message: Credentials updated
        "400":
          description: >-
            Bad request — a body that is empty, not JSON or not an object
            (`Invalid JSON`); a `username` or `password` that is not a string
            (`'username' and 'password' must be strings`); either one empty, over
            its length, outside printable ASCII, or a username carrying `:`, `"`
            or `\`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: "'username' cannot contain ':', '\"' or '\\'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoWebAuth"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: The body is over 4 KiB; a credential pair is under a hundred bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Request body over 4 KiB
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/AuthNotReady"

  /mqtt:
    get:
      tags: [read]
      operationId: getMqtt
      summary: The MQTT settings and what runs this boot.
      description: >-
        The stored settings, never the password: `password_set` says whether one
        is stored. An empty `client_id` or `topic_prefix` means the firmware's
        default, which `client_id_default` and `topic_prefix_default` name.
        `running` is what the client runs this boot, with the defaults filled
        in, and null while it was not started. Read on the device's main loop,
        so `503` when that does not get to it. Only on a firmware with an
        `mqtt_config`; without one this route is the prefix's plain 404.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoMqtt"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: >-
            The device was too busy to read the settings, and asking again may
            succeed (`Device busy`); or the `mqtt_config` did not come up, which a
            device does not reach: codegen creates it before any route is served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                busy:
                  value:
                    success: false
                    error: Device busy
                not_available:
                  value:
                    success: false
                    error: MQTT not available
    post:
      tags: [write]
      operationId: setMqtt
      summary: Change the MQTT settings.
      description: >-
        A partial update: a key left out keeps its value, and `password: ""`
        clears the stored password. The first save in a boot that turns MQTT on
        connects at once (`started`), unless the effective topic prefix differs
        from the one this boot started with, whether this save or an earlier one
        changed it; every other change is stored and applies after a restart, which
        `reboot_required` says here and on `/status`. Turning Home Assistant
        discovery off applies at once: the device removes its retained entries
        from the broker, now when it is connected (`discovery_cleanup: running`)
        or on its next connect (`pending`). Turning MQTT off while the broker
        cannot be reached leaves them there, and the answer says so. Like
        `/auth`, it takes no confirmation. The settings are stored from the
        device's main loop: on a `503` nothing was stored. The request must say
        `Content-Type: application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MqttSettingsUpdate"
      responses:
        "200":
          description: >-
            Stored, or nothing to store (`Nothing changed`). `message` says what
            happens next; `reboot_required`, `started` and `discovery_cleanup`
            are the state after the save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttSaveResult"
              examples:
                started:
                  value:
                    success: true
                    message: Saved; MQTT is connecting
                    reboot_required: false
                    started: true
                    discovery_cleanup: none
                reboot:
                  value:
                    success: true
                    message: Saved; applies after a reboot
                    reboot_required: true
                    started: false
                    discovery_cleanup: none
                discovery_off:
                  value:
                    success: true
                    message: Saved; removing this device's Home Assistant entries
                    reboot_required: false
                    started: false
                    discovery_cleanup: running
        "400":
          description: >-
            Bad request — a body that is empty, not JSON or not an object
            (`Invalid JSON`); a key that is not a setting (`'<key>' is not an
            MQTT setting`); a value of the wrong type (`'enabled' must be true or
            false`, the same for `discovery`; `'port' must be a whole number`;
            `'<key>' must be a string`); or settings that break a rule, the first
            in this order — a `broker` missing while `enabled`, over 128
            characters, a URL, carrying a port, or with anything but letters,
            digits, `.`, `_` and `-` (a build with IPv6 also takes an address of
            two colons or more); a `port` outside 1–65535; a `username` over 64
            bytes or with control characters; a `password` over 128 bytes, with a
            NUL, or without a `username`; a `client_id` over 64 characters or with
            anything but printable ASCII without spaces; a `topic_prefix` over 64
            bytes, with `+`, `#` or control characters, starting with `$` or
            ending with `/`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                url:
                  value:
                    success: false
                    error: "'broker' takes a host name, not a URL: drop the 'mqtt://'"
                port:
                  value:
                    success: false
                    error: "'port' must be between 1 and 65535"
                unknown_key:
                  value:
                    success: false
                    error: "'host' is not an MQTT setting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoMqtt"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: The settings could not be written to flash; the old ones stay in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Storing the MQTT settings failed; the old ones stay in force
        "503":
          description: >-
            The device was too busy to take the request (`Device busy`), or the
            `mqtt_config` did not come up, as for the read; nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                busy:
                  value:
                    success: false
                    error: Device busy
                not_available:
                  value:
                    success: false
                    error: MQTT not available

  /mqtt/subscriptions:
    get:
      tags: [read]
      operationId: getMqttSubscriptions
      summary: The subscription slots, as saved and as they run.
      description: >-
        Every slot from 1 to `max_slots`, an empty one with `topic: ""`. The
        record fields are the saved slot; `entity` and `status` describe what
        runs this boot, and `pending` says the two differ, so the slot changes
        at the next restart. The slots are read from their file every time, on
        the device's main loop, so `503` when that does not get to it. Only on
        a firmware with an `mqtt_subscriptions`; without one this route is the
        prefix's plain 404.
      responses:
        "200":
          description: The slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttSubscriptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoMqttSubscriptions"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: >-
            The device was too busy to read the slots, and asking again may
            succeed (`Device busy`); or the `mqtt_subscriptions` did not come up,
            which a device does not reach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                busy:
                  value:
                    success: false
                    error: Device busy
                not_available:
                  value:
                    success: false
                    error: MQTT subscriptions not available
    post:
      tags: [write]
      operationId: setMqttSubscription
      summary: Save or clear one subscription slot.
      description: >-
        `{"slot", "enabled", "name", "topic", "kind", ...}` saves the slot whole:
        `enabled`, `name`, `topic` and `kind` are required, the rest take their
        defaults, and the fields the kind does not use are reset. `{"slot",
        "action": "clear"}` empties it. The keys a read answers with that are
        not slot fields (`pending`, `status`, `entity`) are ignored, so a slot
        can be sent back as read. Reading the file, judging the slot and writing
        the file are one step on the device's main loop: on a `503` nothing was
        written. A saved slot applies after a restart, which `reboot_required`
        says here and on `/status`. The request must say
        `Content-Type: application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MqttSlotSave"
                - $ref: "#/components/schemas/MqttSlotClear"
      responses:
        "200":
          description: >-
            Written, or nothing to write (`Nothing changed`). `reboot_required` is
            the state after it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttSlotSaveResult"
              examples:
                saved:
                  value:
                    success: true
                    message: Slot 3 saved; applies after a reboot
                    reboot_required: true
                cleared:
                  value:
                    success: true
                    message: Slot 3 cleared; its entity goes after a reboot
                    reboot_required: true
        "400":
          description: >-
            Bad request — a body that is empty, not JSON or not an object
            (`Invalid JSON`); a `slot` that is not a whole number from 1 to
            `max_slots`; an `action` other than `clear`; a key that is not a slot
            field (`'<key>' is not a slot field`); a value of the wrong type; or a
            slot that breaks a rule, the first in this order — `name` empty, over
            32 bytes, with control characters, with a `/`, or giving the id of another slot,
            of another entity of its kind or (a `sensor`) of a temperature probe;
            `topic` empty, over 128 bytes, with control characters, a leading or
            trailing space, `+` or `#`; `json_path` over 64 bytes or not 1 to 6
            keys separated by `.`; a `sensor`'s `unit` not in `units` or
            `decimals` outside 0–4; a `binary_sensor`'s payloads not 1 to 32
            bytes, or equal ignoring case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                slot:
                  value:
                    success: false
                    error: "'slot' must be a whole number from 1 to 8"
                wildcard:
                  value:
                    success: false
                    error: "'topic' cannot contain '+' or '#': a slot takes one topic"
                name:
                  value:
                    success: false
                    error: "'name' gives the same id as the entity 'Relay 1'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoMqttSubscriptions"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          description: >-
            Nothing was written: the storage is not mounted, the file could not be
            read just now, or the write failed (`Storage unavailable`); the file
            was written by newer firmware and is
            left as it is; the device was too busy (`Device busy`); or the
            `mqtt_subscriptions` did not come up, as for the read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                storage:
                  value:
                    success: false
                    error: Storage unavailable
                newer:
                  value:
                    success: false
                    error: The subscriptions file was written by newer firmware; it is left as it is
                busy:
                  value:
                    success: false
                    error: Device busy

  /capabilities:
    get:
      tags: [read]
      operationId: getCapabilities
      summary: What this firmware has.
      description: >-
        Which screens the page can draw and which routes exist. A key is present
        only when the capability is, so the test is `if (caps.files)`; one that
        has no detail to carry is `true`. Read on load, not polled — only
        `rollback` can change: an update, a failed update and a rollback each
        change it, so a client that shows it reads again after those. A `404`
        here is a firmware from before this route, not a device without
        capabilities.
      responses:
        "200":
          description: The capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /system/reboot:
    post:
      tags: [write]
      operationId: reboot
      summary: Restart the device.
      description: >-
        Answers first and restarts half a second later, so the answer reaches the
        caller. Nothing is cleared: settings and files are as they were. On a
        firmware with an `mqtt_config`, a removal of this device's Home Assistant
        entries that is going out gets up to five seconds more to finish.
      requestBody:
        $ref: "#/components/requestBodies/Confirmation"
      responses:
        "200":
          description: Rebooting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
                message: Rebooting
        "400":
          $ref: "#/components/responses/NotConfirmed"
        "403":
          $ref: "#/components/responses/WrongToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /system/factory-reset:
    post:
      tags: [write]
      operationId: factoryReset
      summary: Clear the stored settings and restart.
      description: >-
        The same reset as **Settings → Factory reset** on the display: the
        stored settings are cleared, then the device restarts and wipes the user
        partition on its way back up when the firmware has one — `capabilities`
        `factory_reset.clears_storage` says so, and that is what the
        confirmation dialog has to warn about. Answers before any of it happens,
        and the files are gone once the device is back, not when it answers. On a
        firmware with an `mqtt_config` and Home Assistant discovery on, this
        device's entries leave the broker first, for up to five seconds, while it
        is connected; otherwise they stay there.
      requestBody:
        $ref: "#/components/requestBodies/Confirmation"
      responses:
        "200":
          description: Resetting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
                message: Factory reset, rebooting
        "400":
          $ref: "#/components/responses/NotConfirmed"
        "403":
          $ref: "#/components/responses/WrongToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /system/rollback:
    post:
      tags: [write]
      operationId: rollback
      summary: Boot the other app slot.
      description: >-
        Selects the other app slot for the next boot and restarts. That is the
        firmware this one replaced — until a rollback makes the newer one the
        other slot, which is why `capabilities` reports the slot's version and a
        confirmation should show it. Available only when `capabilities` carries
        `rollback`; the slot is read back and checked while the request is open,
        so an image that is not whole is an error here rather than a device that
        comes back unchanged. The rolled-into firmware gets one monitored boot:
        if it fails before it marks itself good, the bootloader returns to this
        one. The restart waits for a Home Assistant cleanup as a reboot's does.
      requestBody:
        $ref: "#/components/requestBodies/Confirmation"
      responses:
        "200":
          description: Rolling back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
                message: Rolling back, rebooting
        "400":
          $ref: "#/components/responses/NotConfirmed"
        "403":
          $ref: "#/components/responses/WrongToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: >-
            The slot could not be selected: the ESP-IDF error when its image does
            not check out, or `The firmware to roll back to is gone` when it stopped
            being one to go back to after the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: ESP_ERR_OTA_VALIDATE_FAILED
        "503":
          description: >-
            Nothing to roll back to — `capabilities` carries no `rollback` — or
            the device was too busy to take the request; then nothing was
            selected, and asking again may succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unavailable:
                  value:
                    success: false
                    error: No firmware to roll back to
                busy:
                  value:
                    success: false
                    error: Device busy

  /entities:
    get:
      tags: [read]
      operationId: getEntityIndex
      summary: The entities that have settings, per type.
      description: >-
        For every settings type the firmware keeps, the entities of that type:
        the object id, which keys the settings records, and the display name,
        which `web_server`'s routes and `/events` address entities by. Internal
        entities are left out. The types are `entity_config`'s: `switch` and
        `binary_sensor`.
      responses:
        "200":
          description: The index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityIndex"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoStore"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /entity-settings:
    get:
      tags: [read]
      operationId: getEntitySettings
      summary: The stored records of one type, or one of them.
      description: >-
        An entity that was never edited has no record and is absent; with
        `source_name`, that entity's record or an empty list.
      parameters:
        - $ref: "#/components/parameters/TypeQuery"
        - name: source_name
          in: query
          required: false
          description: One entity's object id, as `/entities` lists it.
          schema:
            type: string
          example: relay_1
      responses:
        "200":
          description: The records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRecords"
        "400":
          description: No `type` parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Query parameter 'type' is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TypeNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/StoreNotReady"
    post:
      tags: [write]
      operationId: setEntitySettings
      summary: Update one entity's record, or remove it.
      description: >-
        An update replaces the entity's record with the fields given, saves the
        type's file and applies the record on the loop task once the answer is
        out. A field left out keeps its current value on a `switch`; on a
        `binary_sensor`, `inverted` left out counts as false. The body is read
        raw, so the request needs a `Content-Type` that is not a form: a
        form-encoded body is parsed into fields by the server and answered
        `Invalid JSON`. `action: delete` removes the record on a type that
        supports it; neither `switch` nor `binary_sensor` does, so it is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/EntitySettingsUpdate"
                - $ref: "#/components/schemas/EntitySettingsDelete"
      responses:
        "200":
          description: Saved and being applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              examples:
                updated:
                  value:
                    success: true
                    message: Settings updated
                removed:
                  value:
                    success: true
                    message: Entity was removed
        "400":
          description: >-
            Bad request — a body that is empty, not JSON or not an object
            (`Invalid JSON`); no `type` (`'type' is required`); a `settings` that
            is not an object (`'settings' must be an object`); an `action` that
            is anything but the string `delete` (`'action' must be 'delete'`); a
            record the type
            refuses (`Failed to update settings record`: no `source_name`, one
            naming no entity of that type, an `inverted` that is not a boolean, a
            `restore_mode` or `binding_mode` outside its options, a
            `binding_input` naming no input); a delete on a type that keeps its
            records (`Cannot delete: record not found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Failed to update settings record
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TypeNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: The body is over 4 KiB; a record is a few hundred bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Request body over 4 KiB
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/StoreNotReady"

  /entity-settings-meta:
    get:
      tags: [read]
      operationId: getEntitySettingsMeta
      summary: The form fields of every settings type.
      description: >-
        Per type, its fields in the order a form shows them, each with its kind,
        label, help text, default and, for an `enum`, its options. The `switch`
        binding fields are listed only on a firmware with the `bindings`
        component and at least one input, and `binding_input`'s options are the
        live inputs.
      responses:
        "200":
          description: The fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoStore"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

components:
  securitySchemes:
    webServerAuth:
      type: http
      scheme: digest
      description: >-
        Credentials from the `web_server:` `auth:` block. The scheme is fixed at
        build time; the configs in this repository build Digest. A firmware with
        a `web_auth` serves the pair stored on the device instead of the compiled
        one, so a client must be ready for either.

  parameters:
    TypeQuery:
      name: type
      in: query
      required: true
      description: The settings type, a key of `/entity-settings-meta`.
      schema:
        type: string
      example: switch

  requestBodies:
    Confirmation:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfirmRequest"

  responses:
    MethodNotAllowed:
      description: Wrong HTTP method for this route.
      headers:
        Allow:
          description: What the route accepts.
          schema:
            type: string
            enum: [GET, POST, "GET, POST"]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Method not allowed
    Unauthorized:
      description: >-
        The credentials the `web_server:` `auth:` block set — replaced by what a
        `web_auth` stored — are missing or wrong. The server names the scheme in
        `WWW-Authenticate`; the body is the HTTP server's, not this API's.
      headers:
        WWW-Authenticate:
          description: The scheme the firmware was built with.
          schema:
            type: string
    AuthNotReady:
      description: >-
        The `web_auth` did not come up. Codegen creates it before any route is
        served, so a device does not reach this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Web auth not available
    NoWebAuth:
      description: >-
        This firmware has no `web_auth`, so the credentials route does not exist;
        the answer is the prefix's plain 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Not found
    UnsupportedMediaType:
      description: >-
        The request did not say `Content-Type: application/json`. Every route
        that reads a JSON body demands it — a type no HTML form can send.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Expected Content-Type: application/json"
    NotConfirmed:
      description: The body is not a JSON object, or does not set `confirm` to true.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "'confirm' must be true"
    WrongToken:
      description: >-
        `confirm_token` is missing, or is not this device's. Nothing happened.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "'confirm_token' must be the last three octets of base_mac_address"
    BodyTooLarge:
      description: The body is over the 4 KiB cap.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Request body over 4 KiB
    NoMqtt:
      description: >-
        This firmware has no `mqtt_config`, so the MQTT route does not exist; the
        answer is the prefix's plain 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Not found
    NoMqttSubscriptions:
      description: >-
        This firmware has no `mqtt_subscriptions`, so the route does not exist;
        the answer is the prefix's plain 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Not found
    NoStore:
      description: >-
        This firmware has no `config_json` store, so the settings routes do not
        exist; the answer is the prefix's plain 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Not found
    TypeNotFound:
      description: >-
        No settings type of that name — or, on a firmware without a `config_json`
        store, no such route at all (`Not found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Settings type not found
    StoreNotReady:
      description: >-
        The `config_json` store has not come up. A write also answers this when
        the store is there but its filesystem never mounted: nothing it accepted
        would outlive the reboot, so nothing is accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missing:
              value:
                success: false
                error: Config JSON keeper not available
            unwritable:
              value:
                success: false
                error: Settings storage unavailable

  schemas:
    DeviceInfo:
      type: object
      required: [name, base_mac_address, mac_address, version]
      properties:
        name:
          type: string
          description: The friendly name, or the node name without one.
        base_mac_address:
          type: string
          description: The chip's base MAC, `AA:BB:CC:DD:EE:FF`.
        mac_address:
          type: string
          description: The Ethernet MAC on a build with Ethernet, else the base MAC.
        version:
          type: string
          description: The ESPHome version the firmware was built with.
        serial_number:
          type: string
          description: >-
            The device serial, from `device.id` or from the header of a v3 board.
            Only with a `board_info_id`, and only when the EEPROM has one.
        device_model:
          type: string
          description: The product model from `device.id`; as `serial_number`.
        hw_revision:
          type: string
          description: The product hardware revision from `device.id`; as `serial_number`.
        board:
          $ref: "#/components/schemas/BoardInfo"
      example:
        name: JXD-R6-E1ETH-LCD
        base_mac_address: "AA:BB:CC:DD:EE:FF"
        mac_address: "AA:BB:CC:DD:EE:02"
        version: 2026.8.2
        serial_number: DSN-2026-000042
        device_model: JXD-R6-E1ETH-LCD
        hw_revision: 1.2a
        board:
          valid: true
          header_version: 4
          boardname: JXD-CPU-E1ETH
          boardversion: "1.3"
          board_serial: ""
          usid: JXDR6E01012409012026000042A1B2
          cpuid: "AA:BB:CC:DD:EE:FF"
          mac: F0578DAABBCC
          timestamp: 1700000000
          signature_version: 2
          signature: "7a1c…"
          identity:
            model: JXD-R6-E1ETH-LCD
            serial: DSN-2026-000042
            hw_revision: 1.2a
            serial_matches_usid: true
          efuse:
            factory_mac: "AA:BB:CC:DD:EE:FF"
            custom_mac: F0578DAABBCC

    BoardInfo:
      type: object
      description: >-
        What `jethome_board_info` read from the CPU board's EEPROM, verbatim, plus
        the chip's own eFuses. Only `valid` when the header failed its checks.
      required: [valid]
      properties:
        valid:
          type: boolean
          description: The header parsed and its CRC checked.
        header_version:
          type: integer
          enum: [3, 4]
        boardname:
          type: string
        boardversion:
          type: string
        board_serial:
          type: string
          description: v4 headers only; empty on v3, where the field held the device serial.
        usid:
          type: string
          description: The unique system id the factory assigned.
        cpuid:
          type: string
          description: The chip's factory MAC as the factory wrote it, `AA:BB:CC:DD:EE:FF`.
        mac:
          type: string
          description: The chip's custom MAC as the factory wrote it, `AABBCCDDEEFF`.
        timestamp:
          type: integer
          description: When the header was written, Unix seconds.
        signature_version:
          type: integer
          description: 0 on a board that was never signed; otherwise the factory's scheme version, as written.
        signature:
          type: string
          description: The factory signature, hex; absent on a board that was never signed.
        identity:
          description: The `device.id` record, the product's identity; null on a board without one.
          oneOf:
            - $ref: "#/components/schemas/BoardIdentity"
            - type: "null"
        efuse:
          $ref: "#/components/schemas/BoardEfuse"

    BoardIdentity:
      type: object
      required: [model, serial, hw_revision]
      properties:
        model:
          type: string
        serial:
          type: string
        hw_revision:
          type: string
        serial_matches_usid:
          type: boolean
          description: >-
            The record's serial agrees with the header's USID. Absent when there was
            nothing to compare, so false always means a real mismatch.

    BoardEfuse:
      type: object
      description: >-
        The chip's eFuses in the header's two formats. Null when an eFuse could not
        be read; `custom_mac` is all zeros on a chip with none burned.
      required: [factory_mac, custom_mac]
      properties:
        factory_mac:
          type: [string, "null"]
        custom_mac:
          type: [string, "null"]

    AuthStatus:
      type: object
      required: [username, password_length, is_default]
      properties:
        username:
          type: string
        password_length:
          type: integer
          description: Characters in the stored password, so a client can show it masked.
        is_default:
          type: boolean
          description: The pair is still the one the firmware was built with.
      example:
        username: admin
        password_length: 5
        is_default: true

    AuthUpdate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 32
        password:
          type: string
          maxLength: 64
      example:
        username: admin
        password: a-better-one

    DeviceStatus:
      type: object
      required: [uptime_s, reset_reason, connection_type, rssi, ip_address, reboot_required]
      properties:
        ha_connected:
          type: boolean
          description: An API client is connected. Absent, not false, on a build with no `api:`.
        uptime_s:
          type: integer
          description: Seconds since boot.
        reset_reason:
          type: string
          enum:
            - power-on
            - external
            - software
            - panic
            - interrupt watchdog
            - task watchdog
            - watchdog
            - deep sleep
            - brownout
            - sdio
            - unknown
        connection_type:
          $ref: "#/components/schemas/ConnectionType"
        rssi:
          type: [integer, "null"]
          description: dBm on WiFi, null otherwise.
        ip_address:
          type: [string, "null"]
          description: The first address the network stack has, null before one is set.
        reboot_required:
          type: boolean
          description: >-
            A saved MQTT setting or subscription slot waits for a restart, or MQTT
            or its subscriptions are held back and a restart retries them;
            `reboot_reasons` names it. Modbus and Network mode, which also apply
            on restart, are not tracked.
        reboot_reasons:
          type: array
          description: What waits for the restart; omitted when nothing does.
          items:
            type: string
            enum: [mqtt]
        mqtt:
          $ref: "#/components/schemas/MqttLiveStatus"
      example:
        ha_connected: true
        uptime_s: 86400
        reset_reason: power-on
        connection_type: ethernet
        rssi: null
        ip_address: 192.168.1.50
        reboot_required: false
        mqtt:
          available: true
          enabled: true
          connected: true
          state: connected
          last_error: null

    MqttState:
      type: string
      enum: [not_configured, "off", connecting, connected, disconnected]
      description: >-
        `not_configured` and `off`: the client was not started this boot, with
        no broker stored or with one. `connecting` until the first attempt
        connects or fails, then `connected` or `disconnected`, which
        `last_error` explains.

    MqttError:
      type: string
      enum:
        - dns
        - unreachable
        - connection_lost
        - protocol
        - identifier_rejected
        - server_unavailable
        - bad_credentials
        - not_authorized
        - crash_guard
      description: >-
        Why the client is not connected, as far as the firmware can tell: the
        broker's name did not resolve; no connection to it; a connection that
        was up dropped; the broker refused the protocol version, the client id,
        the service, the credentials, or the authorization; or the client is
        held back after repeated crashes, which a restart retries.

    MqttDiscoveryCleanup:
      type: string
      enum: [none, running, pending]
      description: >-
        Removing this device's retained Home Assistant entries from the broker:
        `running` while they go out, `pending` while one is due and the broker
        is not connected — including after MQTT was turned off before it
        finished, until MQTT is next on with discovery off.

    MqttLiveStatus:
      type: object
      description: >-
        The client as it runs this boot. Absent on a firmware without an
        `mqtt_config`.
      required: [available, enabled, connected, state, last_error]
      properties:
        available:
          type: boolean
          enum: [true]
        enabled:
          type: boolean
          description: The client was started this boot.
        connected:
          type: boolean
        state:
          $ref: "#/components/schemas/MqttState"
        last_error:
          oneOf:
            - $ref: "#/components/schemas/MqttError"
            - type: "null"

    MqttRunning:
      type: object
      description: What the client runs this boot, with the defaults filled in.
      required: [broker, port, client_id, topic_prefix, status_topic, discovery]
      properties:
        broker:
          type: string
        port:
          type: integer
        client_id:
          type: string
        topic_prefix:
          type: string
        status_topic:
          type: string
          description: "`<topic_prefix>/status`: `online` while connected, `offline` otherwise."
        discovery:
          type: boolean

    MqttSettings:
      type: object
      required:
        - enabled
        - broker
        - port
        - username
        - password_set
        - client_id
        - client_id_default
        - topic_prefix
        - topic_prefix_default
        - discovery
        - state
        - last_error
        - running
        - apply_now
        - reboot_required
        - discovery_cleanup
        - stored_notice
      properties:
        enabled:
          type: boolean
        broker:
          type: string
        port:
          type: integer
        username:
          type: string
        password_set:
          type: boolean
          description: A password is stored. The password itself is never answered.
        client_id:
          type: string
          description: Empty for the default, `client_id_default`.
        client_id_default:
          type: string
          description: The node name and the MAC.
        topic_prefix:
          type: string
          description: Empty for the default, `topic_prefix_default`.
        topic_prefix_default:
          type: string
          description: The node name.
        discovery:
          type: boolean
          description: Home Assistant discovery. Off by default.
        state:
          $ref: "#/components/schemas/MqttState"
        last_error:
          oneOf:
            - $ref: "#/components/schemas/MqttError"
            - type: "null"
        running:
          oneOf:
            - $ref: "#/components/schemas/MqttRunning"
            - type: "null"
        apply_now:
          type: boolean
          description: >-
            The client has not started this boot, is not held back, and the
            effective topic prefix is still the one this boot started with: a
            save that turns MQTT on connects at once, unless it changes that
            prefix.
        reboot_required:
          type: boolean
          description: >-
            A saved change waits for a restart, or MQTT is held back after
            repeated crashes and a restart retries it.
        discovery_cleanup:
          $ref: "#/components/schemas/MqttDiscoveryCleanup"
        stored_notice:
          type: [string, "null"]
          pattern: "^(newer_firmware|invalid: .+)$"
          description: >-
            `newer_firmware`: newer firmware wrote the stored settings, so the
            fields show the defaults, MQTT is off, and a save replaces them.
            `invalid: <message>`: the stored settings break a rule of this
            firmware; they run anyway, and the next save must fix what the
            message names.
      example:
        enabled: true
        broker: 192.168.1.10
        port: 1883
        username: jxd
        password_set: true
        client_id: ""
        client_id_default: jxd-r6-e1eth-lcd-5c8214-a1b2c35c8214
        topic_prefix: ""
        topic_prefix_default: jxd-r6-e1eth-lcd-5c8214
        discovery: false
        state: connected
        last_error: null
        running:
          broker: 192.168.1.10
          port: 1883
          client_id: jxd-r6-e1eth-lcd-5c8214-a1b2c35c8214
          topic_prefix: jxd-r6-e1eth-lcd-5c8214
          status_topic: jxd-r6-e1eth-lcd-5c8214/status
          discovery: false
        apply_now: false
        reboot_required: false
        discovery_cleanup: none
        stored_notice: null

    MqttSettingsUpdate:
      type: object
      additionalProperties: false
      description: A key left out keeps its value; `{}` changes nothing.
      properties:
        enabled:
          type: boolean
        broker:
          type: string
          maxLength: 128
          description: >-
            A host name or an IPv4 address, without a scheme or a port. Required
            to turn MQTT on.
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          description: At most 64 bytes of UTF-8, no control characters.
        password:
          type: string
          writeOnly: true
          description: >-
            At most 128 bytes, no NUL, and only with a `username`. `""` clears
            the stored one.
        client_id:
          type: string
          maxLength: 64
          pattern: "^[!-~]*$"
          description: Printable ASCII without spaces; empty for the default.
        topic_prefix:
          type: string
          description: >-
            At most 64 bytes of UTF-8, without `+`, `#` or control characters,
            not starting with `$` nor ending with `/`; empty for the default.
        discovery:
          type: boolean
      example:
        enabled: true
        broker: 192.168.1.10
        port: 1883

    MqttSaveResult:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [reboot_required, started, discovery_cleanup]
          properties:
            message:
              type: string
              enum:
                - Saved; MQTT is connecting
                - Saved; removing this device's Home Assistant entries now, the rest applies after a reboot
                - >-
                  Saved; applies after a reboot. The broker is not reachable, so
                  this device's Home Assistant entries stay on it unless it comes
                  back before then
                - Saved; applies after a reboot
                - Saved; removing this device's Home Assistant entries
                - Saved; this device's Home Assistant entries stay on the broker until MQTT is turned on again
                - Saved; this device's Home Assistant entries go once the broker is reachable
                - Saved
                - Nothing changed
            reboot_required:
              type: boolean
              description: The saved settings differ from what runs; `/status` reports it too.
            started:
              type: boolean
              description: This save started the client; it is connecting now.
            discovery_cleanup:
              $ref: "#/components/schemas/MqttDiscoveryCleanup"

    MqttSlotKind:
      type: string
      enum: [sensor, binary_sensor, text_sensor]
      description: >-
        The entity a slot runs as, by its domain: Number, On/Off or Text in the
        dashboard.

    MqttSlotFields:
      type: object
      description: >-
        A slot's settings. `unit` and `decimals` are a `sensor`'s, `payload_on`
        and `payload_off` a `binary_sensor`'s; for the other kinds they hold their
        defaults.
      properties:
        enabled:
          type: boolean
          description: A disabled slot keeps its settings and runs no entity.
        name:
          type: string
          description: >-
            The entity's name, at most 32 bytes of UTF-8 without control
            characters or `/`, trimmed. Its id must not be another slot's,
            another entity's of its kind or (a `sensor`) a temperature probe's.
        topic:
          type: string
          description: >-
            One exact topic, at most 128 bytes of UTF-8, without control
            characters, `+` or `#`, nor a leading or trailing space. `""` is an
            empty slot.
        kind:
          $ref: "#/components/schemas/MqttSlotKind"
        json_path:
          type: string
          maxLength: 64
          description: >-
            Where the value sits in a JSON message: 1 to 6 keys separated by `.`,
            a number picking an element of a list. `""` reads the whole message.
        unit:
          type: string
          description: One of `units`, or `""`.
        decimals:
          type: integer
          minimum: 0
          maximum: 4
        payload_on:
          type: string
          description: 1 to 32 bytes, compared ignoring case.
        payload_off:
          type: string
          description: 1 to 32 bytes, not equal to `payload_on` ignoring case.

    MqttSlotSave:
      allOf:
        - $ref: "#/components/schemas/MqttSlotFields"
        - type: object
          required: [slot, enabled, name, topic, kind]
          properties:
            slot:
              type: integer
              minimum: 1
              description: 1 to `max_slots`.
      example:
        slot: 3
        enabled: true
        name: Garage door
        topic: zigbee2mqtt/garage_door
        kind: binary_sensor
        json_path: contact
        payload_on: "false"
        payload_off: "true"

    MqttSlotClear:
      type: object
      required: [slot, action]
      properties:
        slot:
          type: integer
          minimum: 1
        action:
          type: string
          enum: [clear]
      example:
        slot: 3
        action: clear

    MqttSlotState:
      type: string
      enum: ["off", waiting, ok, error, suspended]
      description: >-
        `off`: the slot runs nothing this boot (disabled, empty, breaking a rule,
        or no room for its entity). `suspended`: its entity runs but nothing is
        subscribed after repeated crashes. `waiting`: MQTT is not connected or no
        message came yet. `error`: the last message could not be read. `ok`.

    MqttSlot:
      allOf:
        - $ref: "#/components/schemas/MqttSlotFields"
        - type: object
          required:
            - slot
            - enabled
            - name
            - topic
            - kind
            - json_path
            - unit
            - decimals
            - payload_on
            - payload_off
            - pending
            - entity
            - status
          properties:
            slot:
              type: integer
              minimum: 1
            pending:
              type: boolean
              description: The saved slot differs from what runs; it changes at the next restart.
            entity:
              oneOf:
                - type: object
                  required: [domain, name]
                  properties:
                    domain:
                      $ref: "#/components/schemas/MqttSlotKind"
                    name:
                      type: string
                      description: The name `web_server` serves the entity under.
                - type: "null"
              description: The entity the slot runs as this boot, null when none.
            status:
              type: object
              required: [state, value, raw, error, age_s]
              properties:
                state:
                  $ref: "#/components/schemas/MqttSlotState"
                value:
                  type: string
                  description: >-
                    The value as the device shows it (`21.5 °C`, `On`, the text),
                    `""` while it is unknown.
                raw:
                  type: string
                  description: >-
                    The first 64 bytes of the last message, stray bytes and
                    control characters as `?`.
                error:
                  type: [string, "null"]
                  description: >-
                    Why the slot does not run (`invalid: <rule>`, `no room in the
                    entity table`) or why the last message could not be read (`not
                    JSON`, `key '<path>' not found`, `not a number`, `neither ON
                    nor OFF`, `not UTF-8`, `message over 2 KiB`).
                age_s:
                  type: [integer, "null"]
                  description: Seconds since the last message, null before one.

    MqttSubscriptions:
      type: object
      required: [max_slots, reboot_required, suspended, file_error, units, slots]
      properties:
        max_slots:
          type: integer
          minimum: 1
          maximum: 16
        reboot_required:
          type: boolean
          description: >-
            A saved slot differs from what runs, or the slots are suspended and a
            restart retries them.
        suspended:
          type: boolean
          description: >-
            After two crashes in a row while connected, the slots run their
            entities but nothing is subscribed this boot.
        file_error:
          type: [string, "null"]
          description: >-
            `newer_firmware`: the file was written by newer firmware, no slot runs
            and saves are refused. `unreadable`: the file was read and is broken;
            the next save sets it aside. `unreadable: renamed to
            subscriptions.json.bad`: it was set aside at boot. `unavailable`: the
            storage is not mounted, or the file could not be read just now; it is
            left as it is and read again later.
        units:
          type: array
          description: The units a `sensor` slot may take.
          items:
            type: string
        slots:
          type: array
          items:
            $ref: "#/components/schemas/MqttSlot"
      example:
        max_slots: 8
        reboot_required: false
        suspended: false
        file_error: null
        units: ["°C", "%"]
        slots:
          - slot: 1
            enabled: true
            name: Outdoor temperature
            topic: zigbee2mqtt/outdoor
            kind: sensor
            json_path: temperature
            unit: °C
            decimals: 1
            payload_on: "ON"
            payload_off: "OFF"
            pending: false
            entity:
              domain: sensor
              name: Outdoor temperature
            status:
              state: ok
              value: 21.4 °C
              raw: '{"battery":97,"temperature":21.4,"humidity":48}'
              error: null
              age_s: 12

    MqttSlotSaveResult:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [reboot_required]
          properties:
            message:
              type: string
              description: >-
                `Slot <N> saved; applies after a reboot`, `Slot <N> saved` (back to
                what runs), `Nothing changed`, `Slot <N> cleared; its entity goes
                after a reboot` or `Slot <N> cleared`.
            reboot_required:
              type: boolean
              description: Something waits for a restart now; `/status` reports it too.

    ConnectionType:
      type: string
      enum: [wifi, ethernet, none]
      description: The active link; Ethernet wins when both are up.

    NetworkStatus:
      type: object
      required: [hostname, connection_type, ip_address, gateway, subnet, dns1, dns2, ssid, rssi, ethernet_connected]
      properties:
        hostname:
          type: string
          description: The node name.
        connection_type:
          $ref: "#/components/schemas/ConnectionType"
        ip_address:
          type: [string, "null"]
        gateway:
          type: [string, "null"]
          description: IPv4; null when the link has none.
        subnet:
          type: [string, "null"]
          description: The IPv4 mask; null when the link has none.
        dns1:
          type: [string, "null"]
        dns2:
          type: [string, "null"]
        ssid:
          type: [string, "null"]
          description: WiFi only.
        rssi:
          type: [integer, "null"]
          description: dBm, WiFi only.
        ethernet_connected:
          type: boolean
      example:
        hostname: jxd-r6-e1eth-lcd-aabbcc
        connection_type: ethernet
        ip_address: 192.168.1.50
        gateway: 192.168.1.1
        subnet: 255.255.255.0
        dns1: 192.168.1.1
        dns2: null
        ssid: null
        rssi: null
        ethernet_connected: true

    ConfirmRequest:
      type: object
      required: [confirm, confirm_token]
      description: >-
        A guard against a stray POST, not an authorization scheme: whatever
        reaches the port and can read `/info` can send it.
      properties:
        confirm:
          type: boolean
          enum: [true]
        confirm_token:
          type: string
          description: >-
            The last three octets of `/info`'s `base_mac_address`, as it prints
            them. Matched in either case. Not `mac_address`, which on a build
            with Ethernet is a different MAC.
          pattern: "^[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}$"
          example: "DD:EE:FF"

    Capabilities:
      type: object
      required: [reboot, factory_reset]
      properties:
        reboot:
          type: boolean
          enum: [true]
          description: "`/system/reboot` is served. Always there: every device can reboot."
        factory_reset:
          type: object
          required: [clears_storage]
          description: "`/system/factory-reset` is served."
          properties:
            clears_storage:
              type: boolean
              description: >-
                Whether the reset also wipes the user partition, i.e. whether
                uploaded files and automation rules survive it.
        rollback:
          type: object
          required: [partition]
          description: >-
            The firmware `/system/rollback` would boot: after an update, the
            firmware it replaced; after a rollback, the newer one. Absent when
            there is nothing to go back to — a board flashed over serial, an
            update that failed or was interrupted, a firmware the bootloader
            already rolled back from because it crashed, or a switch still
            waiting for its reboot — which is also when that route is `503`.
          properties:
            partition:
              type: string
              description: The slot's partition label.
              example: app1
            version:
              type: string
              description: >-
                That image's ESPHome version, the same string `/info` reports as
                `version` for the running one. What a confirmation should show:
                after one rollback the other slot holds the newer firmware.
              example: 2026.8.1
            project_name:
              type: string
              description: The name that image was built under, the device's node name.
              example: jxd-r6-e1eth-lcd
        storage:
          $ref: "#/components/schemas/StorageCapability"
        files:
          type: object
          required: [url_prefix]
          description: >-
            The firmware serves the file API the Files screen uses. Absent
            without a `web_file_browser`.
          properties:
            url_prefix:
              type: string
              example: /files
        automations:
          type: object
          required: [url_prefix]
          description: >-
            The firmware serves the automations API the Automations screen uses.
            Absent without a `web_automation_editor`.
          properties:
            url_prefix:
              type: string
              example: /automation-editor
        entity_settings:
          type: object
          required: [types]
          description: >-
            The firmware has a `config_json` store, so the `/entity-settings`
            routes exist. Absent otherwise, and then those routes are `404`.
          properties:
            types:
              type: array
              items:
                type: string
              example: [switch, binary_sensor]
        board_info:
          type: boolean
          enum: [true]
          description: "`/info` carries the CPU board's EEPROM identity."
        mqtt:
          type: boolean
          enum: [true]
          description: "`/mqtt` is served: the firmware has an `mqtt_config`."
        mqtt_subscriptions:
          type: object
          required: [max_slots]
          description: >-
            `/mqtt/subscriptions` is served: the firmware has an
            `mqtt_subscriptions`, with this many slots.
          properties:
            max_slots:
              type: integer
              minimum: 1
              maximum: 16
              example: 8
      example:
        reboot: true
        factory_reset:
          clears_storage: true
        rollback:
          partition: app1
          version: 2026.8.1
          project_name: jxd-r6-e1eth-lcd
        storage:
          type: LittleFS
          base_path: /littlefs
          mounted: true
        files:
          url_prefix: /files
        automations:
          url_prefix: /automation-editor
        entity_settings:
          types: [switch, binary_sensor]
        board_info: true
        mqtt: true
        mqtt_subscriptions:
          max_slots: 8

    StorageCapability:
      type: object
      required: [type, base_path, mounted]
      description: >-
        The mount the Files screen browses and a factory reset wipes: what it is,
        not how full it is. Usage is live and this route is not polled, so the
        byte counts stay where they are already answered — `info` on the file API
        at `files.url_prefix`.
      properties:
        type:
          type: string
          description: What the storage component calls its filesystem.
          example: LittleFS
        base_path:
          type: string
          example: /littlefs
        mounted:
          type: boolean
          description: >-
            False when the partition failed to mount; the Files screen then has
            nothing to show.

    EntityIndex:
      type: object
      description: One key per settings type the firmware keeps, in the store's order.
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/EntityIndexEntry"
      example:
        switch:
          - source_name: relay_1
            name: Relay 1
        binary_sensor:
          - source_name: input_1
            name: Input 1

    EntityIndexEntry:
      type: object
      required: [source_name, name]
      properties:
        source_name:
          type: string
          description: The object id, the key of the settings records.
        name:
          type: string
          description: The display name, the key of `web_server`'s routes and `/events`.

    SettingsRecords:
      type: object
      required: [type, records]
      properties:
        type:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/SettingsRecord"
      example:
        type: switch
        records:
          - source_name: relay_1
            restore_mode: RESTORE_DEFAULT_OFF
            inverted: false
            binding_input: input_1
            binding_mode: toggle

    SettingsRecord:
      type: object
      description: >-
        `source_name` and the type's fields, as `/entity-settings-meta` lists
        them: `SwitchSettings` for a `switch`, `BinarySensorSettings` for a
        `binary_sensor`.
      required: [source_name]
      properties:
        source_name:
          type: string
      additionalProperties: true

    SwitchSettings:
      type: object
      description: "The `switch` fields. On write each is optional: a key left out keeps its current value."
      properties:
        restore_mode:
          type: string
          enum:
            - ALWAYS_OFF
            - ALWAYS_ON
            - RESTORE_DEFAULT_OFF
            - RESTORE_DEFAULT_ON
            - RESTORE_INVERTED_DEFAULT_OFF
            - RESTORE_INVERTED_DEFAULT_ON
            - RESTORE_DISABLED
          description: What the output does at power-up. The form offers the first three.
        inverted:
          type: boolean
        binding_input:
          type: string
          description: The object id of the input that drives this output, empty for none. With the `bindings` component only.
        binding_mode:
          type: string
          enum: [none, toggle, follow]

    BinarySensorSettings:
      type: object
      description: The `binary_sensor` fields. On write, `inverted` left out counts as false.
      properties:
        inverted:
          type: boolean

    EntitySettingsUpdate:
      type: object
      required: [type, source_name]
      # `action` belongs to the delete body; leaving it out here keeps the two
      # alternatives of the request's oneOf disjoint.
      not:
        required: [action]
      properties:
        type:
          type: string
          description: The settings type, a key of `/entity-settings-meta`.
        source_name:
          type: string
          description: The entity's object id, as `/entities` lists it.
        settings:
          description: >-
            The type's fields. Left out, a `switch` record is re-saved as it is,
            while a `binary_sensor` takes `inverted` as false — the same rule as
            for a single field left out.
          anyOf:
            - $ref: "#/components/schemas/SwitchSettings"
            - $ref: "#/components/schemas/BinarySensorSettings"
      example:
        type: switch
        source_name: relay_1
        settings:
          restore_mode: RESTORE_DEFAULT_OFF
          inverted: false
          binding_input: input_1
          binding_mode: toggle

    EntitySettingsDelete:
      type: object
      required: [type, source_name, action]
      properties:
        type:
          type: string
        source_name:
          type: string
        action:
          type: string
          enum: [delete]
      example:
        type: switch
        source_name: relay_1
        action: delete

    SettingsMeta:
      type: object
      required: [settings]
      properties:
        common:
          type: object
          description: Fields every type shares. Reserved; the device emits none today.
          additionalProperties:
            $ref: "#/components/schemas/FieldDef"
        settings:
          type: object
          description: One key per settings type, in the store's order; per type, its fields in form order.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/FieldDef"
      example:
        settings:
          switch:
            restore_mode:
              type: enum
              label: Start Mode
              description: "What this output does at power-up: force Off, force On, or restore the state it had before the reboot."
              default: ALWAYS_OFF
              options:
                - value: ALWAYS_OFF
                  label: "Off"
                - value: ALWAYS_ON
                  label: "On"
                - value: RESTORE_DEFAULT_OFF
                  label: Last
            binding_input:
              type: enum
              label: Bound input
              description: An input that drives this output directly, with no automation.
              default: ""
              options:
                - value: ""
                  label: None
                - value: input_1
                  label: Input 1
            binding_mode:
              type: enum
              label: Binding mode
              description: Toggle flips the output on each press of the input; Follow makes the output copy the input and takes over from Start Mode.
              default: none
              options:
                - value: none
                  label: Disabled
                - value: toggle
                  label: Toggle
                - value: follow
                  label: Follow
            inverted:
              type: boolean
              label: Inverted
              description: "Swaps the physical output: the app's On drives the pin low, Off drives it high."
              default: false
          binary_sensor:
            inverted:
              type: boolean
              label: Inverted
              description: "Reports the input the other way round: a closed contact shows as Off."
              default: false

    FieldDef:
      type: object
      required: [type, label]
      properties:
        type:
          type: string
          enum: [string, boolean, enum, number]
        label:
          type: string
        description:
          type: string
          description: Help text; the page shows it as a tooltip beside the label.
        default:
          description: The value an entity without a record has.
        options:
          type: array
          description: For `enum`; the value is what the record stores.
          items:
            $ref: "#/components/schemas/FieldOption"
        min:
          type: number
          description: For `number`, in the record's unit.
        max:
          type: number
        unit:
          type: string
          description: "For `number`: the record's unit."
        display_unit:
          type: string
          description: "For `number`: the unit the page shows, `unit` times `display_factor`."
        display_factor:
          type: number

    FieldOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string

    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
      example:
        success: true
        message: Settings updated

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
      example:
        success: false
        error: Not found
