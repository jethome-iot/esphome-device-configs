openapi: 3.1.0

info:
  title: web_device_dashboard HTTP API
  version: 1.0.0
  description: >-
    The device API behind the dashboard page, served by the ESPHome
    `web_device_dashboard` component on the device's own web server under
    `/api/device/`: the device identity (with the CPU board's EEPROM record when
    a `jethome_board_info` is wired in), the runtime status, the live network
    link, on a firmware with a `web_auth` the HTTP credentials, with a
    `dallas_scan` the temperature slots, and — on a firmware with a
    `config_json` store — the per-entity settings and their form fields.
    ESP-IDF (ESP32) only.

    This document is the wire contract; the TypeScript client in `client/device`
    implements it and the dashboard repository's dev server mocks it. Reads
    answer GET only and writes POST only, `entity-settings` both (a read on GET,
    a write on POST); any other method is `405` with an `Allow` header. Route
    names match the URL path exactly, so an unknown name under the prefix is
    `404`. A POST needs a `Content-Length`, even `0`: ESP-IDF's server answers
    `411` without one. Every failure is `{"success": false, "error"}`.

    A request whose `Origin` header is not the `Host` it was sent to is answered
    `403` before it reaches a route: the credentials a browser has cached for
    this device cannot be steered here from a page on another site. That refusal
    is `text/plain`, not one of the JSON envelopes below — it is the server
    turning the request away, not a route answering it. Clients that send no
    `Origin` — `curl`, a script, a Home Assistant `rest_command` — are
    unaffected. Every route that reads a JSON body also demands
    `Content-Type: application/json`, a type no HTML form can send, and answers
    `415` without it.

    The page itself is outside this document: `GET /` answers it as `text/html`
    with `Content-Encoding: gzip` and `Cache-Control: public, max-age=3600`, and
    any other method on `/` is `405`. The entity state and control the page uses
    are `web_server`'s own routes and its `/events` stream, typed in
    `client/rest`.

servers:
  - url: http://{host}:{port}/api/device
    description: A device on the local network. The prefix is fixed.
    variables:
      host:
        default: device.local
      port:
        default: "80"

# The routes inherit whatever auth the `web_server:` block sets. The configs in
# this repository set Digest credentials, so that is the shipped default; the
# empty requirement covers a firmware built without an `auth:` block, where
# anything that reaches the port may call every route.
security:
  - webServerAuth: []
  - {}

tags:
  - name: read
    description: Read-only routes (GET).
  - name: write
    description: Mutating routes (POST).

paths:
  /info:
    get:
      tags: [read]
      operationId: getInfo
      summary: The device identity.
      description: >-
        `name` is the friendly name, or the node name without one. `mac_address`
        is the Ethernet MAC on a build with Ethernet, else the chip's base MAC,
        which `base_mac_address` always carries. With a `board_info_id`, what the
        firmware read from the CPU board's EEPROM: `serial_number`,
        `device_model` and `hw_revision` from the `device.id` record (the serial
        from the header on a v3 board that predates it), each only when the
        EEPROM has it, and `board`, the record verbatim plus the chip's eFuses.
      responses:
        "200":
          description: The identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /status:
    get:
      tags: [read]
      operationId: getStatus
      summary: The runtime status.
      description: Polled by the page every few seconds.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /network:
    get:
      tags: [read]
      operationId: getNetwork
      summary: The live network link.
      description: >-
        The active interface with its address, gateway, mask and DNS servers, and
        the SSID and RSSI on WiFi. Ethernet wins when both links are up.
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /auth:
    get:
      tags: [read]
      operationId: getAuth
      summary: The credentials the server checks.
      description: >-
        The username and how long the password is; the password itself is never
        answered. `is_default` says the device still takes the pair the firmware
        was built with. Only on a firmware with a `web_auth`; without one this
        route is the prefix's plain 404.
      responses:
        "200":
          description: The credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoWebAuth"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthNotReady"
    post:
      tags: [write]
      operationId: setAuth
      summary: Replace the credentials.
      description: >-
        Both fields are required and are sent as they will be typed — this
        request carries the new password in the clear, whatever scheme the
        firmware checks with. The pair is stored and applied from the device's
        main loop, so this request still answers under the old one and the next
        request needs the new one; a browser asks for it again on the page's next
        call. A username is at most 32 characters and a password at most 64, both
        printable ASCII, and a username may not contain `:`, `"` or `\`. The
        request must say `Content-Type: application/json`, a type no HTML form
        can send: that is what keeps a page on another site from steering a
        browser's cached credentials at this route.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthUpdate"
      responses:
        "200":
          description: >-
            Accepted: the pair passed validation and is queued for the next turn
            of the device's main loop, which is the only task that may write the
            flash preferences. A store that fails there leaves the old pair in
            force and says so in the device log; a client that needs to know
            confirms with a `GET` of this route under the new credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
                message: Credentials updated
        "400":
          description: >-
            Bad request — a body that is empty, not JSON or not an object
            (`Invalid JSON`); a `username` or `password` that is not a string
            (`'username' and 'password' must be strings`); either one empty, over
            its length, outside printable ASCII, or a username carrying `:`, `"`
            or `\`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: "'username' cannot contain ':', '\"' or '\\'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoWebAuth"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: The body is over 4 KiB; a credential pair is under a hundred bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Request body over 4 KiB
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/AuthNotReady"

  /capabilities:
    get:
      tags: [read]
      operationId: getCapabilities
      summary: What this firmware has.
      description: >-
        Which screens the page can draw and which routes exist. A key is present
        only when the capability is, so the test is `if (caps.files)`; one that
        has no detail to carry is `true`. Read on load, not polled — only
        `rollback` can change: an update, a failed update and a rollback each
        change it, so a client that shows it reads again after those. A `404`
        here is a firmware from before this route, not a device without
        capabilities.
      responses:
        "200":
          description: The capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /system/reboot:
    post:
      tags: [write]
      operationId: reboot
      summary: Restart the device.
      description: >-
        Answers first and restarts half a second later, so the answer reaches the
        caller. Nothing is cleared: settings and files are as they were, and
        what waits for a restart (`/status` `reboot_reasons`) applies.
      requestBody:
        $ref: "#/components/requestBodies/Confirmation"
      responses:
        "200":
          description: Rebooting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
                message: Rebooting
        "400":
          $ref: "#/components/responses/NotConfirmed"
        "403":
          $ref: "#/components/responses/WrongToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /system/factory-reset:
    post:
      tags: [write]
      operationId: factoryReset
      summary: Clear the stored settings and restart.
      description: >-
        The same reset as **Settings → Factory reset** on the display: the
        stored settings are cleared, then the device restarts and wipes the user
        partition on its way back up when the firmware has one — `capabilities`
        `factory_reset.clears_storage` says so, and that is what the
        confirmation dialog has to warn about. Answers before any of it happens,
        and the files are gone once the device is back, not when it answers.
      requestBody:
        $ref: "#/components/requestBodies/Confirmation"
      responses:
        "200":
          description: Resetting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
                message: Factory reset, rebooting
        "400":
          $ref: "#/components/responses/NotConfirmed"
        "403":
          $ref: "#/components/responses/WrongToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /system/rollback:
    post:
      tags: [write]
      operationId: rollback
      summary: Boot the other app slot.
      description: >-
        Selects the other app slot for the next boot and restarts. That is the
        firmware this one replaced — until a rollback makes the newer one the
        other slot, which is why `capabilities` reports the slot's version and a
        confirmation should show it. Available only when `capabilities` carries
        `rollback`; the slot is read back and checked while the request is open,
        so an image that is not whole is an error here rather than a device that
        comes back unchanged. The rolled-into firmware gets one monitored boot:
        if it fails before it marks itself good, the bootloader returns to this
        one.
      requestBody:
        $ref: "#/components/requestBodies/Confirmation"
      responses:
        "200":
          description: Rolling back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                success: true
                message: Rolling back, rebooting
        "400":
          $ref: "#/components/responses/NotConfirmed"
        "403":
          $ref: "#/components/responses/WrongToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: >-
            The slot could not be selected: the ESP-IDF error when its image does
            not check out, or `The firmware to roll back to is gone` when it stopped
            being one to go back to after the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: ESP_ERR_OTA_VALIDATE_FAILED
        "503":
          description: >-
            Nothing to roll back to — `capabilities` carries no `rollback` — or
            the device was too busy to take the request; then nothing was
            selected, and asking again may succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unavailable:
                  value:
                    success: false
                    error: No firmware to roll back to
                busy:
                  value:
                    success: false
                    error: Device busy

  /temperature-slots:
    get:
      tags: [read]
      operationId: getTemperatureSlots
      summary: The temperature slots and what is in them.
      description: >-
        The slots of the firmware's `dallas_scan` up to the last one bound at
        boot or holding a device in the saved table, numbered from 1 as the
        `Temp N` sensors are. A slot freed between bound ones keeps its row, as it
        does in the panel's Temperatures menu. A slot's `free`, `address` and
        `can_forget` describe the saved table, the one
        `/temperature-slots/forget` and `/temperature-slots/assign` change and
        the next boot binds; the sensors keep reading the devices they booted
        with until then, and `pending` marks a slot where the two differ. Read
        again after a forget or an assign. Readings are not here: they are the
        sensors' state on `web_server`'s `/events`, matched by `name`.
      responses:
        "200":
          description: The slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureSlots"
        "404":
          $ref: "#/components/responses/NoTemperatureSlots"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: The loop task did not take the request in time (`Device busy`). Nothing was read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Device busy

  /temperature-slots/forget:
    post:
      tags: [write]
      operationId: forgetTemperatureSlots
      summary: Empty one slot, or every slot but the listed ones, from the next boot on.
      description: >-
        What **Temperatures → Temp N → Confirm** and **Settings → Temp sensors →
        Confirm** do on the panel, except that the device does not restart: the
        change is saved and applies after a reboot, and changes made before that
        add up. `slot` empties that slot: the device in it, if it is still on the
        bus, takes the lowest free slot again at the next boot, and the other
        slots keep their numbers. `all` empties every slot but the ones
        `sensors:` lists, so the devices are numbered again in bus order. A
        request that would change nothing in the saved table — a free slot, a
        listed one, or `all` with nothing but listed slots left — is refused with
        `409`; the slot's `can_forget` in `/temperature-slots` says beforehand. A
        table that cannot be written is `503`. Otherwise it empties the slots and
        writes the table before it answers; a write that fails is `500`, and the
        table stays as it was.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgetSlotsRequest"
            examples:
              one:
                value:
                  slot: 2
                  confirm: true
                  confirm_token: "DD:EE:FF"
              all:
                value:
                  all: true
                  confirm: true
                  confirm_token: "DD:EE:FF"
      responses:
        "200":
          description: Forgotten in the saved table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureSlotChangeResult"
              examples:
                one:
                  value:
                    success: true
                    message: Slot 2 forgotten; applies after a reboot
                    reboot_required: true
                all:
                  value:
                    success: true
                    message: Every slot forgotten; applies after a reboot
                    reboot_required: true
                undone:
                  summary: The table is back as the device booted with it
                  value:
                    success: true
                    message: Slot 4 forgotten
                    reboot_required: false
        "400":
          description: >-
            Not a confirmation (`'confirm' must be true`, as on the system
            routes), or not exactly one of a slot in range and `all: true`.
            Both keys present is refused whatever their values, `null` included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unconfirmed:
                  value:
                    success: false
                    error: "'confirm' must be true"
                neither:
                  value:
                    success: false
                    error: "'slot' or 'all' is required"
                both:
                  value:
                    success: false
                    error: "'slot' and 'all' exclude each other"
                notTrue:
                  value:
                    success: false
                    error: "'all' must be true"
                range:
                  value:
                    success: false
                    error: "'slot' must be a number from 1 to 16"
        "403":
          $ref: "#/components/responses/WrongToken"
        "404":
          $ref: "#/components/responses/NoTemperatureSlots"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: >-
            Nothing would change in the saved table. Nothing happened. A slot
            emptied since boot, by a forget or a move, says so.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                free:
                  value:
                    success: false
                    error: Slot 3 is free
                freeAfterReboot:
                  value:
                    success: false
                    error: Slot 2 is free after a reboot
                listed:
                  value:
                    success: false
                    error: Slot 1 belongs to a sensor listed in YAML
                nothing:
                  value:
                    success: false
                    error: "Nothing to forget: every slot is free or listed in YAML"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: >-
            The table could not be written, so it stays as it was and the device
            keeps running. The log says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: The slot table was not written
        "503":
          description: >-
            The table is kept in a file and the user partition did not mount, so
            nothing could be written (`Temperature slot storage unavailable`), or
            the loop task did not take the request in time (`Device busy`).
            Nothing happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Temperature slot storage unavailable

  /temperature-slots/assign:
    post:
      tags: [write]
      operationId: assignTemperatureSlot
      summary: Put a device into a slot, from the next boot on.
      description: >-
        Puts the device with this ROM into `slot`. If the table holds it in
        another slot already, the two slots swap what they hold, which is how a
        sensor moves to another number. If the address is new — typed in for a
        sensor not plugged in yet, say — it takes the slot from the device that
        held it; that device, if still on the bus, takes the lowest free slot at
        the next boot. A device whose slot changes takes that slot's `Temp N`
        name and Modbus register with it. Refused before anything happens:
        a malformed or non-thermometer address (`400`), and a listed slot, a
        listed sensor's address, or a device already in that slot (`409`), and
        a table that cannot be written (`503`), each judged against the saved
        table. Otherwise it writes the table before it answers, and the change
        applies after a reboot, together with any made before it; a write that
        fails is `500`, and the table stays as it was.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSlotRequest"
            example:
              slot: 1
              address: "0xeb01227905460228"
              confirm: true
              confirm_token: "DD:EE:FF"
      responses:
        "200":
          description: Assigned in the saved table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureSlotChangeResult"
              examples:
                waits:
                  value:
                    success: true
                    message: Slot 1 assigned; applies after a reboot
                    reboot_required: true
                undone:
                  summary: The table is back as the device booted with it
                  value:
                    success: true
                    message: Slot 1 assigned
                    reboot_required: false
        "400":
          description: >-
            Not a confirmation, a slot out of range, an address that is not 16
            hex digits after an optional `0x`, or one no thermometer can have: a family
            other than DS18B20, DS18S20, DS1822, DS1825 or DS28EA00, or a CRC
            that does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                range:
                  value:
                    success: false
                    error: "'slot' must be a number from 1 to 16"
                format:
                  value:
                    success: false
                    error: "'address' must be 16 hex digits, after an optional 0x"
                rom:
                  value:
                    success: false
                    error: "0x4e00001234567801 is not a thermometer ROM: wrong family or CRC"
        "403":
          $ref: "#/components/responses/WrongToken"
        "404":
          $ref: "#/components/responses/NoTemperatureSlots"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          description: >-
            The YAML decides this slot or this device, or the saved table has
            this device in this slot already. Nothing happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                listedSlot:
                  value:
                    success: false
                    error: Slot 1 belongs to a sensor listed in YAML
                listedAddress:
                  value:
                    success: false
                    error: 0x8a0122791699dd28 belongs to a sensor listed in YAML
                unchanged:
                  value:
                    success: false
                    error: 0xeb01227905460228 is in slot 2 already
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          description: >-
            The table could not be written, so it stays as it was and the device
            keeps running. The log says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: The slot table was not written
        "503":
          description: >-
            The table is kept in a file and the user partition did not mount, so
            nothing could be written (`Temperature slot storage unavailable`), or
            the loop task did not take the request in time (`Device busy`).
            Nothing happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Temperature slot storage unavailable

  /entities:
    get:
      tags: [read]
      operationId: getEntityIndex
      summary: The entities that have settings, per type.
      description: >-
        For every settings type the firmware keeps, the entities of that type:
        the object id, which keys the settings records, and the display name,
        which `web_server`'s routes and `/events` address entities by. Internal
        entities are left out. The types are `entity_config`'s: `switch` and
        `binary_sensor`.
      responses:
        "200":
          description: The index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityIndex"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoStore"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /entity-settings:
    get:
      tags: [read]
      operationId: getEntitySettings
      summary: The stored records of one type, or one of them.
      description: >-
        An entity that was never edited has no record and is absent; with
        `source_name`, that entity's record or an empty list.
      parameters:
        - $ref: "#/components/parameters/TypeQuery"
        - name: source_name
          in: query
          required: false
          description: One entity's object id, as `/entities` lists it.
          schema:
            type: string
          example: relay_1
      responses:
        "200":
          description: The records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRecords"
        "400":
          description: No `type` parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Query parameter 'type' is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TypeNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/StoreNotReady"
    post:
      tags: [write]
      operationId: setEntitySettings
      summary: Update one entity's record, or remove it.
      description: >-
        An update replaces the entity's record with the fields given, saves the
        type's file and applies the record on the loop task once the answer is
        out. A field left out keeps its current value on a `switch`; on a
        `binary_sensor`, `inverted` left out counts as false. The body is read
        raw, so the request needs a `Content-Type` that is not a form: a
        form-encoded body is parsed into fields by the server and answered
        `Invalid JSON`. `action: delete` removes the record on a type that
        supports it; neither `switch` nor `binary_sensor` does, so it is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/EntitySettingsUpdate"
                - $ref: "#/components/schemas/EntitySettingsDelete"
      responses:
        "200":
          description: Saved and being applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              examples:
                updated:
                  value:
                    success: true
                    message: Settings updated
                removed:
                  value:
                    success: true
                    message: Entity was removed
        "400":
          description: >-
            Bad request — a body that is empty, not JSON or not an object
            (`Invalid JSON`); no `type` (`'type' is required`); a `settings` that
            is not an object (`'settings' must be an object`); an `action` that
            is anything but the string `delete` (`'action' must be 'delete'`); a
            record the type
            refuses (`Failed to update settings record`: no `source_name`, one
            naming no entity of that type, an `inverted` that is not a boolean, a
            `restore_mode` or `binding_mode` outside its options, a
            `binding_input` naming no input); a delete on a type that keeps its
            records (`Cannot delete: record not found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Failed to update settings record
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TypeNotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: The body is over 4 KiB; a record is a few hundred bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                success: false
                error: Request body over 4 KiB
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/StoreNotReady"

  /entity-settings-meta:
    get:
      tags: [read]
      operationId: getEntitySettingsMeta
      summary: The form fields of every settings type.
      description: >-
        Per type, its fields in the order a form shows them, each with its kind,
        label, help text, default and, for an `enum`, its options. The `switch`
        binding fields are listed only on a firmware with the `bindings`
        component and at least one input, and `binding_input`'s options are the
        live inputs.
      responses:
        "200":
          description: The fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NoStore"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

components:
  securitySchemes:
    webServerAuth:
      type: http
      scheme: digest
      description: >-
        Credentials from the `web_server:` `auth:` block. The scheme is fixed at
        build time; the configs in this repository build Digest. A firmware with
        a `web_auth` serves the pair stored on the device instead of the compiled
        one, so a client must be ready for either.

  parameters:
    TypeQuery:
      name: type
      in: query
      required: true
      description: The settings type, a key of `/entity-settings-meta`.
      schema:
        type: string
      example: switch

  requestBodies:
    Confirmation:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfirmRequest"

  responses:
    MethodNotAllowed:
      description: Wrong HTTP method for this route.
      headers:
        Allow:
          description: What the route accepts.
          schema:
            type: string
            enum: [GET, POST, "GET, POST"]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Method not allowed
    Unauthorized:
      description: >-
        The credentials the `web_server:` `auth:` block set — replaced by what a
        `web_auth` stored — are missing or wrong. The server names the scheme in
        `WWW-Authenticate`; the body is the HTTP server's, not this API's.
      headers:
        WWW-Authenticate:
          description: The scheme the firmware was built with.
          schema:
            type: string
    AuthNotReady:
      description: >-
        The `web_auth` did not come up. Codegen creates it before any route is
        served, so a device does not reach this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Web auth not available
    NoWebAuth:
      description: >-
        This firmware has no `web_auth`, so the credentials route does not exist;
        the answer is the prefix's plain 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Not found
    UnsupportedMediaType:
      description: >-
        The request did not say `Content-Type: application/json`. Every route
        that reads a JSON body demands it — a type no HTML form can send.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "Expected Content-Type: application/json"
    NotConfirmed:
      description: The body is not a JSON object, or does not set `confirm` to true.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "'confirm' must be true"
    WrongToken:
      description: >-
        `confirm_token` is missing, or is not this device's. Nothing happened.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: "'confirm_token' must be the last three octets of base_mac_address"
    BodyTooLarge:
      description: The body is over the 4 KiB cap.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Request body over 4 KiB
    NoTemperatureSlots:
      description: >-
        This firmware has no `dallas_scan` wired to the dashboard
        (`dallas_scan_id:`): `capabilities` carries no `temperature_slots`. On a
        firmware built without one at all the routes do not exist, and the
        answer is the prefix's plain `Not found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            unwired:
              value:
                success: false
                error: No temperature slots
            absent:
              value:
                success: false
                error: Not found
    NoStore:
      description: >-
        This firmware has no `config_json` store, so the settings routes do not
        exist; the answer is the prefix's plain 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Not found
    TypeNotFound:
      description: >-
        No settings type of that name — or, on a firmware without a `config_json`
        store, no such route at all (`Not found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            error: Settings type not found
    StoreNotReady:
      description: >-
        The `config_json` store has not come up. A write also answers this when
        the store is there but its filesystem never mounted: nothing it accepted
        would outlive the reboot, so nothing is accepted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            missing:
              value:
                success: false
                error: Config JSON keeper not available
            unwritable:
              value:
                success: false
                error: Settings storage unavailable

  schemas:
    DeviceInfo:
      type: object
      required: [name, base_mac_address, mac_address, version]
      properties:
        name:
          type: string
          description: The friendly name, or the node name without one.
        base_mac_address:
          type: string
          description: The chip's base MAC, `AA:BB:CC:DD:EE:FF`.
        mac_address:
          type: string
          description: The Ethernet MAC on a build with Ethernet, else the base MAC.
        version:
          type: string
          description: The ESPHome version the firmware was built with.
        serial_number:
          type: string
          description: >-
            The device serial, from `device.id` or from the header of a v3 board.
            Only with a `board_info_id`, and only when the EEPROM has one.
        device_model:
          type: string
          description: The product model from `device.id`; as `serial_number`.
        hw_revision:
          type: string
          description: The product hardware revision from `device.id`; as `serial_number`.
        board:
          $ref: "#/components/schemas/BoardInfo"
      example:
        name: JXD-R6-E1ETH-LCD
        base_mac_address: "AA:BB:CC:DD:EE:FF"
        mac_address: "AA:BB:CC:DD:EE:02"
        version: 2026.8.2
        serial_number: DSN-2026-000042
        device_model: JXD-R6-E1ETH-LCD
        hw_revision: 1.2a
        board:
          valid: true
          header_version: 4
          boardname: JXD-CPU-E1ETH
          boardversion: "1.3"
          board_serial: ""
          usid: JXDR6E01012409012026000042A1B2
          cpuid: "AA:BB:CC:DD:EE:FF"
          mac: F0578DAABBCC
          timestamp: 1700000000
          signature_version: 2
          signature: "7a1c…"
          identity:
            model: JXD-R6-E1ETH-LCD
            serial: DSN-2026-000042
            hw_revision: 1.2a
            serial_matches_usid: true
          efuse:
            factory_mac: "AA:BB:CC:DD:EE:FF"
            custom_mac: F0578DAABBCC

    BoardInfo:
      type: object
      description: >-
        What `jethome_board_info` read from the CPU board's EEPROM, verbatim, plus
        the chip's own eFuses. Only `valid` when the header failed its checks.
      required: [valid]
      properties:
        valid:
          type: boolean
          description: The header parsed and its CRC checked.
        header_version:
          type: integer
          enum: [3, 4]
        boardname:
          type: string
        boardversion:
          type: string
        board_serial:
          type: string
          description: v4 headers only; empty on v3, where the field held the device serial.
        usid:
          type: string
          description: The unique system id the factory assigned.
        cpuid:
          type: string
          description: The chip's factory MAC as the factory wrote it, `AA:BB:CC:DD:EE:FF`.
        mac:
          type: string
          description: The chip's custom MAC as the factory wrote it, `AABBCCDDEEFF`.
        timestamp:
          type: integer
          description: When the header was written, Unix seconds.
        signature_version:
          type: integer
          description: 0 on a board that was never signed; otherwise the factory's scheme version, as written.
        signature:
          type: string
          description: The factory signature, hex; absent on a board that was never signed.
        identity:
          description: The `device.id` record, the product's identity; null on a board without one.
          oneOf:
            - $ref: "#/components/schemas/BoardIdentity"
            - type: "null"
        efuse:
          $ref: "#/components/schemas/BoardEfuse"

    BoardIdentity:
      type: object
      required: [model, serial, hw_revision]
      properties:
        model:
          type: string
        serial:
          type: string
        hw_revision:
          type: string
        serial_matches_usid:
          type: boolean
          description: >-
            The record's serial agrees with the header's USID. Absent when there was
            nothing to compare, so false always means a real mismatch.

    BoardEfuse:
      type: object
      description: >-
        The chip's eFuses in the header's two formats. Null when an eFuse could not
        be read; `custom_mac` is all zeros on a chip with none burned.
      required: [factory_mac, custom_mac]
      properties:
        factory_mac:
          type: [string, "null"]
        custom_mac:
          type: [string, "null"]

    AuthStatus:
      type: object
      required: [username, password_length, is_default]
      properties:
        username:
          type: string
        password_length:
          type: integer
          description: Characters in the stored password, so a client can show it masked.
        is_default:
          type: boolean
          description: The pair is still the one the firmware was built with.
      example:
        username: admin
        password_length: 5
        is_default: true

    AuthUpdate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 32
        password:
          type: string
          maxLength: 64
      example:
        username: admin
        password: a-better-one

    DeviceStatus:
      type: object
      required: [uptime_s, reset_reason, connection_type, rssi, ip_address, reboot_required]
      properties:
        ha_connected:
          type: boolean
          description: An API client is connected. Absent, not false, on a build with no `api:`.
        uptime_s:
          type: integer
          description: Seconds since boot.
        reset_reason:
          type: string
          enum:
            - power-on
            - external
            - software
            - panic
            - interrupt watchdog
            - task watchdog
            - watchdog
            - deep sleep
            - brownout
            - sdio
            - unknown
        connection_type:
          $ref: "#/components/schemas/ConnectionType"
        rssi:
          type: [integer, "null"]
          description: dBm on WiFi, null otherwise.
        ip_address:
          type: [string, "null"]
          description: The first address the network stack has, null before one is set.
        reboot_required:
          type: boolean
          description: >-
            A saved change waits for a restart; `reboot_reasons` names it.
            `/system/reboot` applies it. The Modbus settings, which also apply
            on restart, are not tracked.
        reboot_reasons:
          type: array
          description: What waits for the restart; omitted when nothing does.
          items:
            type: string
            enum: [temperature_slots]
            description: >-
              `temperature_slots`: a forget or an assign changed the saved slot
              table, see `/temperature-slots`.
      example:
        ha_connected: true
        uptime_s: 86400
        reset_reason: power-on
        connection_type: ethernet
        rssi: null
        ip_address: 192.168.1.50
        reboot_required: true
        reboot_reasons: [temperature_slots]

    ConnectionType:
      type: string
      enum: [wifi, ethernet, none]
      description: The active link; Ethernet wins when both are up.

    NetworkStatus:
      type: object
      required: [hostname, connection_type, ip_address, gateway, subnet, dns1, dns2, ssid, rssi, ethernet_connected]
      properties:
        hostname:
          type: string
          description: The node name.
        connection_type:
          $ref: "#/components/schemas/ConnectionType"
        ip_address:
          type: [string, "null"]
        gateway:
          type: [string, "null"]
          description: IPv4; null when the link has none.
        subnet:
          type: [string, "null"]
          description: The IPv4 mask; null when the link has none.
        dns1:
          type: [string, "null"]
        dns2:
          type: [string, "null"]
        ssid:
          type: [string, "null"]
          description: WiFi only.
        rssi:
          type: [integer, "null"]
          description: dBm, WiFi only.
        ethernet_connected:
          type: boolean
      example:
        hostname: jxd-r6-e1eth-lcd-aabbcc
        connection_type: ethernet
        ip_address: 192.168.1.50
        gateway: 192.168.1.1
        subnet: 255.255.255.0
        dns1: 192.168.1.1
        dns2: null
        ssid: null
        rssi: null
        ethernet_connected: true

    ConfirmRequest:
      type: object
      required: [confirm, confirm_token]
      description: >-
        A guard against a stray POST, not an authorization scheme: whatever
        reaches the port and can read `/info` can send it.
      properties:
        confirm:
          type: boolean
          enum: [true]
        confirm_token:
          type: string
          description: >-
            The last three octets of `/info`'s `base_mac_address`, as it prints
            them. Matched in either case. Not `mac_address`, which on a build
            with Ethernet is a different MAC.
          pattern: "^[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}:[0-9A-Fa-f]{2}$"
          example: "DD:EE:FF"

    TemperatureSlots:
      type: object
      required: [max_slots, reboot_required, slots]
      properties:
        max_slots:
          type: integer
          minimum: 1
          maximum: 64
          description: The size of the table, `dallas_scan`'s `max_sensors`.
        reboot_required:
          type: boolean
          description: >-
            Some slot is `pending`; `/status` names `temperature_slots` in
            `reboot_reasons` too.
        slots:
          type: array
          description: >-
            Slots 1 up to the last one bound at boot or holding a device in the
            saved table, in order; empty when there is none.
          items:
            $ref: "#/components/schemas/TemperatureSlot"
      example:
        max_slots: 16
        reboot_required: true
        slots:
          - slot: 1
            name: Boiler
            free: false
            listed: true
            address: "0x8a0122791699dd28"
            can_forget: false
            pending: false
          - slot: 2
            name: Temp 2
            free: true
            listed: false
            can_forget: false
            pending: true
            running_address: "0x9b01b5566e8a1f28"
          - slot: 3
            name: Temp 3
            free: false
            listed: false
            address: "0xeb01227905460228"
            can_forget: true
            pending: false

    TemperatureSlot:
      type: object
      description: >-
        `free`, `address` and `can_forget` describe the saved table, the one the
        next boot binds; `name` and `running_address` describe what runs until
        then.
      required: [slot, name, free, listed, can_forget, pending]
      properties:
        slot:
          type: integer
          minimum: 1
          description: The slot's number, from 1; the `slot` a forget takes.
        name:
          type: string
          description: >-
            The name of the slot's sensor — the entity `web_server` serves, so
            the key to its reading — or `<prefix> N` for a slot with no sensor
            this boot.
        free:
          type: boolean
          description: >-
            The saved table holds no device here: the slot was forgotten and
            nothing took it since.
        listed:
          type: boolean
          description: >-
            Taken by a sensor from `dallas_scan`'s `sensors:`, which the YAML
            fixes there: nothing here forgets it.
        address:
          type: string
          pattern: "^0x[0-9a-f]{16}$"
          description: >-
            The device's 1-Wire ROM in the saved table, as the panel prints it. A
            string, because 64 bits do not survive a JavaScript number. Absent
            for a free slot and for a listed sensor that is not a 1-Wire one.
        can_forget:
          type: boolean
          description: >-
            `/temperature-slots/forget` with this `slot` would empty it: it holds
            a device in the saved table, is not listed, and the table can be
            written. Whether that device still answers does not matter — an
            unplugged sensor is the usual reason to forget one.
        pending:
          type: boolean
          description: >-
            A forget or an assign changed this slot since boot; it applies after
            a reboot.
        running_address:
          type: string
          pattern: "^0x[0-9a-f]{16}$"
          description: >-
            The ROM this slot's sensor reads until the reboot. Only on a
            `pending` slot that had a device at boot.

    TemperatureSlotChangeResult:
      description: What a forget or an assign answers once the saved table is written.
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [reboot_required]
          properties:
            reboot_required:
              type: boolean
              description: >-
                The saved table differs from the one the device booted with,
                after this change; `/status` reports it too. False when the
                change put the table back as it booted, and the message then
                has no `; applies after a reboot`.

    AssignSlotRequest:
      allOf:
        - $ref: "#/components/schemas/ConfirmRequest"
        - type: object
          required: [slot, address]
          properties:
            slot:
              type: integer
              minimum: 1
              description: The slot to put the device into, from 1 up to `max_slots`.
            address:
              type: string
              pattern: "^(0[xX])?[0-9A-Fa-f]{16}$"
              description: >-
                The device's ROM as `/temperature-slots` prints it; the `0x` is
                optional and either case is taken.

    ForgetSlotsRequest:
      description: A confirmation with either `slot` or `all`, never both.
      allOf:
        - $ref: "#/components/schemas/ConfirmRequest"
        - oneOf:
            - type: object
              required: [slot]
              not:
                required: [all]
              properties:
                slot:
                  type: integer
                  minimum: 1
                  description: The slot to empty, from 1 up to `max_slots`.
            - type: object
              required: [all]
              not:
                required: [slot]
              properties:
                all:
                  type: boolean
                  enum: [true]
                  description: Every slot but the listed ones.

    Capabilities:
      type: object
      required: [reboot, factory_reset]
      properties:
        reboot:
          type: boolean
          enum: [true]
          description: "`/system/reboot` is served. Always there: every device can reboot."
        factory_reset:
          type: object
          required: [clears_storage]
          description: "`/system/factory-reset` is served."
          properties:
            clears_storage:
              type: boolean
              description: >-
                Whether the reset also wipes the user partition, i.e. whether
                uploaded files and automation rules survive it.
        rollback:
          type: object
          required: [partition]
          description: >-
            The firmware `/system/rollback` would boot: after an update, the
            firmware it replaced; after a rollback, the newer one. Absent when
            there is nothing to go back to — a board flashed over serial, an
            update that failed or was interrupted, a firmware the bootloader
            already rolled back from because it crashed, or a switch still
            waiting for its reboot — which is also when that route is `503`.
          properties:
            partition:
              type: string
              description: The slot's partition label.
              example: app1
            version:
              type: string
              description: >-
                That image's ESPHome version, the same string `/info` reports as
                `version` for the running one. What a confirmation should show:
                after one rollback the other slot holds the newer firmware.
              example: 2026.8.1
            project_name:
              type: string
              description: The name that image was built under, the device's node name.
              example: jxd-r6-e1eth-lcd
        storage:
          $ref: "#/components/schemas/StorageCapability"
        files:
          type: object
          required: [url_prefix]
          description: >-
            The firmware serves the file API the Files screen uses. Absent
            without a `web_file_browser`.
          properties:
            url_prefix:
              type: string
              example: /files
        automations:
          type: object
          required: [url_prefix]
          description: >-
            The firmware serves the automations API the Automations screen uses.
            Absent without a `web_automation_editor`.
          properties:
            url_prefix:
              type: string
              example: /automation-editor
        climates:
          type: object
          required: [url_prefix]
          description: >-
            The firmware serves the thermostat API the Climate screens use.
            Absent without a `web_climate_editor`.
          properties:
            url_prefix:
              type: string
              example: /climate-editor
        entity_settings:
          type: object
          required: [types]
          description: >-
            The firmware has a `config_json` store, so the `/entity-settings`
            routes exist. Absent otherwise, and then those routes are `404`.
          properties:
            types:
              type: array
              items:
                type: string
              example: [switch, binary_sensor]
        board_info:
          type: boolean
          enum: [true]
          description: "`/info` carries the CPU board's EEPROM identity."
        temperature_slots:
          type: boolean
          enum: [true]
          description: >-
            A `dallas_scan` is wired in, so `/temperature-slots`,
            `/temperature-slots/forget` and `/temperature-slots/assign` answer.
      example:
        reboot: true
        factory_reset:
          clears_storage: true
        rollback:
          partition: app1
          version: 2026.8.1
          project_name: jxd-r6-e1eth-lcd
        storage:
          type: LittleFS
          base_path: /littlefs
          mounted: true
        files:
          url_prefix: /files
        automations:
          url_prefix: /automation-editor
        climates:
          url_prefix: /climate-editor
        entity_settings:
          types: [switch, binary_sensor]
        board_info: true
        temperature_slots: true

    StorageCapability:
      type: object
      required: [type, base_path, mounted]
      description: >-
        The mount the Files screen browses and a factory reset wipes: what it is,
        not how full it is. Usage is live and this route is not polled, so the
        byte counts stay where they are already answered — `info` on the file API
        at `files.url_prefix`.
      properties:
        type:
          type: string
          description: What the storage component calls its filesystem.
          example: LittleFS
        base_path:
          type: string
          example: /littlefs
        mounted:
          type: boolean
          description: >-
            False when the partition failed to mount; the Files screen then has
            nothing to show.

    EntityIndex:
      type: object
      description: One key per settings type the firmware keeps, in the store's order.
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/EntityIndexEntry"
      example:
        switch:
          - source_name: relay_1
            name: Relay 1
        binary_sensor:
          - source_name: input_1
            name: Input 1

    EntityIndexEntry:
      type: object
      required: [source_name, name]
      properties:
        source_name:
          type: string
          description: The object id, the key of the settings records.
        name:
          type: string
          description: The display name, the key of `web_server`'s routes and `/events`.

    SettingsRecords:
      type: object
      required: [type, records]
      properties:
        type:
          type: string
        records:
          type: array
          items:
            $ref: "#/components/schemas/SettingsRecord"
      example:
        type: switch
        records:
          - source_name: relay_1
            restore_mode: RESTORE_DEFAULT_OFF
            inverted: false
            binding_input: input_1
            binding_mode: toggle

    SettingsRecord:
      type: object
      description: >-
        `source_name` and the type's fields, as `/entity-settings-meta` lists
        them: `SwitchSettings` for a `switch`, `BinarySensorSettings` for a
        `binary_sensor`.
      required: [source_name]
      properties:
        source_name:
          type: string
      additionalProperties: true

    SwitchSettings:
      type: object
      description: "The `switch` fields. On write each is optional: a key left out keeps its current value."
      properties:
        restore_mode:
          type: string
          enum:
            - ALWAYS_OFF
            - ALWAYS_ON
            - RESTORE_DEFAULT_OFF
            - RESTORE_DEFAULT_ON
            - RESTORE_INVERTED_DEFAULT_OFF
            - RESTORE_INVERTED_DEFAULT_ON
            - RESTORE_DISABLED
          description: What the output does at power-up. The form offers the first three.
        inverted:
          type: boolean
        binding_input:
          type: string
          description: The object id of the input that drives this output, empty for none. With the `bindings` component only.
        binding_mode:
          type: string
          enum: [none, toggle, follow]

    BinarySensorSettings:
      type: object
      description: The `binary_sensor` fields. On write, `inverted` left out counts as false.
      properties:
        inverted:
          type: boolean

    EntitySettingsUpdate:
      type: object
      required: [type, source_name]
      # `action` belongs to the delete body; leaving it out here keeps the two
      # alternatives of the request's oneOf disjoint.
      not:
        required: [action]
      properties:
        type:
          type: string
          description: The settings type, a key of `/entity-settings-meta`.
        source_name:
          type: string
          description: The entity's object id, as `/entities` lists it.
        settings:
          description: >-
            The type's fields. Left out, a `switch` record is re-saved as it is,
            while a `binary_sensor` takes `inverted` as false — the same rule as
            for a single field left out.
          anyOf:
            - $ref: "#/components/schemas/SwitchSettings"
            - $ref: "#/components/schemas/BinarySensorSettings"
      example:
        type: switch
        source_name: relay_1
        settings:
          restore_mode: RESTORE_DEFAULT_OFF
          inverted: false
          binding_input: input_1
          binding_mode: toggle

    EntitySettingsDelete:
      type: object
      required: [type, source_name, action]
      properties:
        type:
          type: string
        source_name:
          type: string
        action:
          type: string
          enum: [delete]
      example:
        type: switch
        source_name: relay_1
        action: delete

    SettingsMeta:
      type: object
      required: [settings]
      properties:
        common:
          type: object
          description: Fields every type shares. Reserved; the device emits none today.
          additionalProperties:
            $ref: "#/components/schemas/FieldDef"
        settings:
          type: object
          description: One key per settings type, in the store's order; per type, its fields in form order.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/FieldDef"
      example:
        settings:
          switch:
            restore_mode:
              type: enum
              label: Start Mode
              description: "What this output does at power-up: force Off, force On, or restore the state it had before the reboot."
              default: ALWAYS_OFF
              options:
                - value: ALWAYS_OFF
                  label: "Off"
                - value: ALWAYS_ON
                  label: "On"
                - value: RESTORE_DEFAULT_OFF
                  label: Last
            binding_input:
              type: enum
              label: Bound input
              description: An input that drives this output directly, with no automation.
              default: ""
              options:
                - value: ""
                  label: None
                - value: input_1
                  label: Input 1
            binding_mode:
              type: enum
              label: Binding mode
              description: Toggle flips the output on each press of the input; Follow makes the output copy the input and takes over from Start Mode.
              default: none
              options:
                - value: none
                  label: Disabled
                - value: toggle
                  label: Toggle
                - value: follow
                  label: Follow
            inverted:
              type: boolean
              label: Inverted
              description: "Swaps the physical output: the app's On drives the pin low, Off drives it high."
              default: false
          binary_sensor:
            inverted:
              type: boolean
              label: Inverted
              description: "Reports the input the other way round: a closed contact shows as Off."
              default: false

    FieldDef:
      type: object
      required: [type, label]
      properties:
        type:
          type: string
          enum: [string, boolean, enum, number]
        label:
          type: string
        description:
          type: string
          description: Help text; the page shows it as a tooltip beside the label.
        default:
          description: The value an entity without a record has.
        options:
          type: array
          description: For `enum`; the value is what the record stores.
          items:
            $ref: "#/components/schemas/FieldOption"
        min:
          type: number
          description: For `number`, in the record's unit.
        max:
          type: number
        unit:
          type: string
          description: "For `number`: the record's unit."
        display_unit:
          type: string
          description: "For `number`: the unit the page shows, `unit` times `display_factor`."
        display_factor:
          type: number

    FieldOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string

    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
      example:
        success: true
        message: Settings updated

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
      example:
        success: false
        error: Not found
