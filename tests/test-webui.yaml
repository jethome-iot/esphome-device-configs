# # для Wifi используется wifi_info
#   - platform: wifi_info
#     ip_address:
#       name: "Wifi IP"
#       id: ip
    # mac_address:
    #   name: ESP Mac Wifi Address
    #   id: mac1
# для ETH используется ethernet_info
  # - platform: ethernet_info
  #   ip_address:
  #     name: ETH IP Address
  #     id: eth_ip
    # mac_address:
    #   name: MAC
    #   id: mac1

  - platform: template
    id: time_rtc_sensor
    name: "Time RTC"
    lambda: |-
      if(!id(pcf8563_time).is_failed()){
        char str[30];
        time_t currTime = id(pcf8563_time).now().timestamp;

        strftime(str, sizeof(str), "%d.%m.%Y %X", localtime(&currTime));
        //ESP_LOGD("custom", "time: %s", str);
        return std::string(str);

      } else {
        return std::string("");
      }

    update_interval: 1s
    web_server:
      sorting_group_id: device
      sorting_weight: 1


button:
  - platform: template
    name: "Start Test"
    id: start_test
    icon: mdi:play-circle
    web_server:
      sorting_group_id: test_group
      sorting_weight: -1
    on_press:
      then:
        - script.execute: full_test
    
