web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: test_group
      name: "Tests"
      sorting_weight: -1
    - id: cpu_board_group
      name: "CPU board results"
      sorting_weight: 0
    - id: peripheral_board_group
      name: "Peripheral board results"
      sorting_weight: 1
    - id: display_board_group
      name: "Display board results"
      sorting_weight: 2

