script:
# тест PSRAM
  - id: test_psram
    then:
      - script.execute:
          id: started_test
          test_name: "PSRAM"
      - lambda: |-
          static const char* TAG = "test";
          id(psram_result_bool).publish_state(false);

          RAMAllocator<uint8_t> allocator(RAMAllocator<uint8_t>::ALLOC_EXTERNAL);
          size_t max_size = heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM);

          if (max_size != 0) {
            ESP_LOGI(TAG,"PSRAM size %dKb", heap_caps_get_total_size(MALLOC_CAP_SPIRAM)>>10);
            ESP_LOGI(TAG,"Testing max free block size %dKb", max_size>>10);

            uint8_t *mem = allocator.allocate(max_size);
            const unsigned int seed = 0xaaaa;

            if (mem == nullptr) {
              ESP_LOGE(TAG, "Cannot allocate psram");
              id(psram_result_bool).publish_state(false);
              return;
            }
            // Writing
            uint32_t *p = (uint32_t *)mem;
            unsigned int rseed = seed ^ 0xa5a5a5a5;
            for (int i = 0; i < max_size / 4; i++) {
                *p++ = rand_r(&rseed);
            }

            // Reading
            p = (uint32_t *)mem;
            rseed = seed ^ 0xa5a5a5a5;
            for (int i = 0; i < max_size / 4; i++) {
              uint32_t ex = rand_r(&rseed);
              if (ex != *p) {
                ESP_LOGE(TAG, "check_mem_seed: %x has 0x%08"PRIx32" expected 0x%08"PRIx32"\n", (char*)p-(char*)mem, *p, ex);
                // id(psram_result_bool).publish_state(false);
                break;
              }
              p++;
            }
            allocator.deallocate(mem, max_size);
            id(psram_result_bool).publish_state(true);


          } else {
            ESP_LOGE(TAG, "PSRAM wasn't finded");
            id(psram_result_bool).publish_state(false);
            return;
          }
      - script.execute:
          id: result_test
          test_name: "PSRAM"
          test_result: !lambda return id(psram_result_bool).state;

      - script.execute:
          id: finished_test
          test_name: "PSRAM"

# тест измерения напряжения
  - id: test_vin_voltage
    then:
      - script.execute:
          id: started_test
          test_name: "VIN voltage"
      - lambda: |-
          static const char* TAG = "test";
          id(vin_result_bool).publish_state(false);

          if (id(vin_voltage).has_state()) {
            float vin_voltage_value = id(vin_voltage).state;

            if(vin_voltage_value >= 0 && vin_voltage_value < 60) {
              id(vin_result_bool).publish_state(true);
              // ESP_LOGI(TAG, "VIN voltage test OK");
            } else {
              id(vin_result_bool).publish_state(false);
              // ESP_LOGE(TAG, "VIN voltage test FAILED");
            }
          } else {
            id(vin_result_bool).publish_state(false);
            // ESP_LOGE(TAG, "VIN voltage test FAILED");
          }
      - script.execute:
          id: result_test
          test_name: "VIN voltage"
          test_result: !lambda return id(vin_result_bool).state;

      - script.execute:
          id: finished_test
          test_name: "VIN voltage"

