script:
  - id: test_eeprom_per
    then:
      - script.execute:
          id: started_test
          test_name: "EEPROM 0x56"
      - lambda: |-
          static const char* TAG = "test";
          uint8_t write_byte = 0xAB;
          uint8_t read_byte = 0x00;

          id(eeprom_per_result_bool).publish_state(false);

          eeprom_per->put(0x0001, write_byte);
          // ESP_LOGD(TAG, "Write to EEPROM: 0x%X", write_byte);

          eeprom_per->get(0x0001, &read_byte);
          // ESP_LOGD(TAG, "Read from EEPROM: 0x%X", read_byte);

          if (read_byte == write_byte) {
            id(eeprom_per_result_bool).publish_state(true);
            // ESP_LOGI(TAG, "EEPROM peripheral board test OK");
          } else {
            id(eeprom_per_result_bool).publish_state(false);
            // ESP_LOGE(TAG, "EEPROM peripheral board test FAILED");
          }

          // Очистка EEPROM
          eeprom_per->put(0x0001, 0x00);

      - script.execute:
          id: result_test
          test_name: "EEPROM 0x56"
          test_result: !lambda return id(eeprom_per_result_bool).state;

      - script.execute:
          id: finished_test
          test_name: "EEPROM 0x56"

