# Google Test binary for components/automations and components/web_automation_editor on a
# firmware without climate_hub, built through esphome compile by tests/run.py. The suites of
# the two components build with the hub, so this one is where their branches for a firmware
# without thermostats compile and run. As there, nothing declared here is ever set up: the
# tests create their own engine and editor, over the harness's web_server_base stand-in.
esphome:
  name: automations-no-climate-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [filesystem_storage_abstract, automations, web_automation_editor, web_origin_guard, loop_job, switch_hold]
  - source: ../../harness/components
    components: [dir_storage, web_server_base]

dir_storage:
  id: test_storage
  path: .storage

automations:
  storage: test_storage

web_server_base: {}

web_automation_editor:

# App sizes its entity lists from what is declared here and silently drops a
# registration past that, so this is at least what the cases register.
binary_sensor:
  - platform: template
    id: in_1_unused
    name: "In 1"

switch:
  - platform: template
    id: relay_1_unused
    name: "Relay 1"
    optimistic: true
