# Google Test binary for components/web_schedule_editor, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared
# here is ever set up: the entities, the hub, the engine and the editor exist only to get
# the sources compiled and the USE_* defines set. The tests create their own, over the
# harness's web_server_base stand-in.
esphome:
  name: web-schedule-editor-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      # dump_config's rows exist only in the log; the cases read them through a listener.
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components:
      - filesystem_storage_abstract
      - schedules
      - climate_hub
      - web_schedule_editor
      - web_origin_guard
      - loop_job
      - switch_hold
  - source: ../../harness/components
    components: [dir_storage, web_server_base]

time:
  - platform: host
    id: host_time
    timezone: UTC

dir_storage:
  id: test_storage
  path: .storage

# Not `schedules`: a global by that name hides the namespace in the generated code.
# contract.json's environment has room for three.
schedules:
  id: schedules_engine
  storage: test_storage
  time_id: host_time
  max_schedules: 3

# Reserves the pool the cases' one hub registers: its max_controllers must match.
# contract.json's two thermostats, and one more a case adds.
climate_hub:
  storage: test_storage
  max_controllers: 3

web_server_base: {}

web_schedule_editor:

# App sizes its entity lists from what is declared here and silently drops a
# registration past that, so this is at least what cases/common.h registers: the
# relays contract.json names, the thermostats' sensor and relays, and one internal
# switch. The unit fills the generated unit table the sensor takes its own from.
sensor:
  - platform: template
    id: room_unused
    name: "Room"
    unit_of_measurement: "°C"

switch:
  - platform: template
    id: relay_1_unused
    name: "Relay 1"
    optimistic: true
  - platform: template
    id: relay_2_unused
    name: "Relay 2"
    optimistic: true
  - platform: template
    id: relay_3_unused
    name: "Relay 3"
    optimistic: true
  - platform: template
    id: boiler_unused
    name: "Boiler"
    optimistic: true
  - platform: template
    id: pump_unused
    name: "Pump"
    optimistic: true
  - platform: template
    id: hidden_unused
    name: "Hidden"
    optimistic: true
    internal: true
