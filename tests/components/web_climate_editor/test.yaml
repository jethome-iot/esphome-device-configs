# Google Test binary for components/web_climate_editor, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared
# here is ever set up: the entities, the hub and the editor exist only to get the
# sources compiled and the USE_* defines set. The tests create their own, over the
# harness's web_server_base stand-in.
esphome:
  name: web-climate-editor-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      # dump_config's rows exist only in the log; the cases read them through a listener.
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [filesystem_storage_abstract, climate_hub, web_climate_editor, web_origin_guard, loop_job, switch_hold]
  - source: ../../harness/components
    components: [dir_storage, web_server_base]

dir_storage:
  id: test_storage
  path: .storage

# Reserves the pool the cases' one hub registers: its max_controllers must match.
climate_hub:
  storage: test_storage
  max_controllers: 3

web_server_base: {}

web_climate_editor:

# App sizes its entity lists from what is declared here and silently drops a
# registration past that, so this is at least what cases/common.h registers: one
# YAML climate beside the pool, the sensors, the relays, one internal sensor and one
# internal switch. Temp 1 and Temp 2 are contract.json's, named as the client mock
# names them.
# The units fill the generated unit table the cases' sensors take theirs from.
climate:
  - platform: template
    id: hall_unused
    name: "Hall"
    supported_modes: [heat]

sensor:
  - platform: template
    id: room_unused
    name: "Room"
    unit_of_measurement: "°C"
  - platform: template
    id: floor_unused
    name: "Floor"
    unit_of_measurement: "°C"
  - platform: template
    id: probe_unused
    name: "Probe"
    internal: true
  - platform: template
    id: uptime_unused
    name: "Uptime"
    unit_of_measurement: s
  - platform: template
    id: counter_unused
    name: "Counter"
  - platform: template
    id: temp_1_unused
    name: "Temp 1"
    unit_of_measurement: "°C"
  - platform: template
    id: temp_2_unused
    name: "Temp 2"
    unit_of_measurement: "°C"

switch:
  - platform: template
    id: relay_1_unused
    name: "Relay 1"
    optimistic: true
  - platform: template
    id: relay_2_unused
    name: "Relay 2"
    optimistic: true
  - platform: template
    id: hidden_unused
    name: "Hidden"
    optimistic: true
