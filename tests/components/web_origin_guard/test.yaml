# Google Test binary for components/web_origin_guard, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared here is
# ever set up: the block exists to get the header compiled. The cases wrap a recording handler
# in a guard and drive it over the web_server_base stand-in, the way a request off the socket
# would reach it.
esphome:
  name: web-origin-guard-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [web_origin_guard]
  - source: ../../harness/components
    components: [web_server_base]

web_server_base: {}

web_origin_guard:
