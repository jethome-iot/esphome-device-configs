# Google Test binary for components/network_config, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared here
# is ever set up: the sections exist to get the sources compiled and the defines set
# (USE_NETWORK_CONFIG, USE_SELECT). The tests build their own record and component.
#
# No wifi: or ethernet: section - neither builds for the host platform, so the half of the
# component that talks to them is compiled out here and covered under QEMU and on hardware.
esphome:
  name: network-config-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [filesystem_storage_abstract, config_base, config_json, network_config]
  - source: ../../harness/components
    components: [dir_storage]

dir_storage:
  id: test_storage
  path: .storage

config_json:
  storage: test_storage

network_config:
  id: network_config_id
  settings_id: network_settings
  network_mode_select_id: network_mode

# The mode select the component publishes into; the cases register one of their own.
select:
  - platform: template
    id: network_mode
    name: "Network mode"
    optimistic: true
    initial_option: "Ethernet"
    options: ["Auto", "Ethernet", "WiFi"]
