# Google Test binary for components/jethome_board_info, built through esphome compile
# by tests/run.py. The harness main.cpp replaces the generated one, so nothing
# declared here is ever set up: the tests build the component over a fake I2C bus
# themselves. The i2c: block only lets i2c_eeprom validate on the host; the device
# is never opened.
esphome:
  name: jethome-board-info-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      # The logger keeps listeners only when a component asks for them in
      # codegen; the tests read the errors and warnings through one.
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [i2c_eeprom, jethome_board_info]

i2c:
  - id: bus
    device: /dev/i2c-0

i2c_eeprom:
  - id: eeprom
    size: 64KB
    address: 0x54

jethome_board_info:
  eeprom_id: eeprom
