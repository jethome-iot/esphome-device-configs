# Google Test binary for components/config_json, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared
# here is ever set up: the sections exist to get the sources compiled and the USE_*
# defines set. The tests build their own keeper over a test-only settings type.
esphome:
  name: config-json-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [filesystem_storage_abstract, config_base, config_json]
  - source: ../../harness/components
    components: [dir_storage]

dir_storage:
  id: test_storage
  path: .storage

config_json:
  storage: test_storage
