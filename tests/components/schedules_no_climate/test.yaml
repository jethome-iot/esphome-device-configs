# Google Test binary for components/schedules on a firmware without climate_hub, built
# through esphome compile by tests/run.py. The component's own suite builds with the hub,
# so this one is where its branches for a firmware without thermostats compile and run.
# As there, nothing declared here is ever set up: the cases create their own engine.
esphome:
  name: schedules-no-climate-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [filesystem_storage_abstract, schedules, loop_job, switch_hold]
  - source: ../../harness/components
    components: [dir_storage]

time:
  - platform: host
    id: host_time
    timezone: UTC

dir_storage:
  id: test_storage
  path: .storage

schedules:
  id: schedules_engine
  storage: test_storage
  time_id: host_time

# App sizes its entity lists from what is declared here and silently drops a
# registration past that, so this is at least what the cases register.
switch:
  - platform: template
    id: relay_1_unused
    name: "Relay 1"
    optimistic: true
