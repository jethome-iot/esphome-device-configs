# Google Test binary for components/schedules and web_schedule_editor on a firmware
# without climate_hub, built through esphome compile by tests/run.py. Their own suites
# build with the hub, so this one is where their branches for a firmware without
# thermostats compile and run.
# As there, nothing declared here is ever set up: the cases create their own engine.
esphome:
  name: schedules-no-climate-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components:
      - filesystem_storage_abstract
      - schedules
      - loop_job
      - switch_hold
      - web_schedule_editor
      - web_origin_guard
  - source: ../../harness/components
    components: [dir_storage, web_server_base]

time:
  - platform: host
    id: host_time
    timezone: UTC

dir_storage:
  id: test_storage
  path: .storage

schedules:
  id: schedules_engine
  storage: test_storage
  time_id: host_time

web_server_base: {}

web_schedule_editor:

# App sizes its entity lists from what is declared here and silently drops a
# registration past that, so this is at least what the cases register.
switch:
  - platform: template
    id: relay_1_unused
    name: "Relay 1"
    optimistic: true
