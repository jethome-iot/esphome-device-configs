# Google Test binary for components/entity_config, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared here
# is ever set up: the sections exist to get the sources compiled and the defines set
# (ENTITY_CONFIG_*, USE_BINARY_SENSOR_FILTER), and the entities size App's lists. The
# tests register their own.
esphome:
  name: entity-config-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [filesystem_storage_abstract, config_base, config_json, entity_config, bindings]
  - source: ../../harness/components
    components: [dir_storage]

dir_storage:
  id: test_storage
  path: .storage

config_json:
  storage: test_storage

entity_config:
  settings: [switch, binary_sensor]

bindings:

# App sizes its entity lists from what is declared here and silently drops a
# registration past that, so this is at least what cases/common.h registers.
binary_sensor:
  - platform: template
    id: in_1_unused
    name: "Input 1"
  - platform: template
    id: in_2_unused
    name: "Input 2"

switch:
  - platform: template
    id: relay_1_unused
    name: "Relay 1"
    optimistic: true
  - platform: template
    id: relay_2_unused
    name: "Relay 2"
    optimistic: true
