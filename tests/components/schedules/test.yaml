# Google Test binary for components/schedules, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared
# here is ever set up: the entities, the hub and the engine exist only to get the
# sources compiled and the USE_* defines set. The tests create their own.
esphome:
  name: schedules-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      # The logger keeps listeners only when a component asks for them in
      # codegen; the tests read the warnings through one.
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [filesystem_storage_abstract, schedules, climate_hub, loop_job, switch_hold]
  - source: ../../harness/components
    components: [dir_storage]

time:
  - platform: host
    id: host_time
    timezone: UTC

dir_storage:
  id: test_storage
  path: .storage

# Not `schedules`: a global by that name hides the namespace in the generated code.
schedules:
  id: schedules_engine
  storage: test_storage
  time_id: host_time

# The thermostats the schedules drive; the cases' one hub registers this pool.
climate_hub:
  storage: test_storage
  max_controllers: 2

# App sizes its entity lists from what is declared here and silently drops a
# registration past that, so this is at least what cases/common.h registers.
sensor:
  - platform: template
    id: room_unused
    name: "Room"
    unit_of_measurement: "°C"

switch:
  - platform: template
    id: relay_1_unused
    name: "Relay 1"
    optimistic: true
  - platform: template
    id: relay_2_unused
    name: "Relay 2"
    optimistic: true
  - platform: template
    id: boiler_unused
    name: "Boiler"
    optimistic: true
  - platform: template
    id: hidden_unused
    name: "Hidden"
    optimistic: true
    internal: true
