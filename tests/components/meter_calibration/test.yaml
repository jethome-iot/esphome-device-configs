# Google Test binary for components/meter_calibration, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared here is
# ever set up: the tests build the metering board's EEPROM, its jethome_board_info and the
# loader over a fake I2C bus themselves. jeefs_vectors.h is jethome_board_info's image
# builder, shared rather than copied.
esphome:
  name: meter-calibration-test
  includes:
    - ../../harness/main.cpp
    - ../../harness/environment.cpp
    - ../jethome_board_info/cases/jeefs_vectors.h
    - cases
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      # The logger keeps listeners only when a component asks for them in
      # codegen; the tests read the errors and warnings through one.
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [i2c_eeprom, jethome_board_info, meter_calibration]

i2c:
  - id: bus
    device: /dev/i2c-0

i2c_eeprom:
  - id: eeprom_meter
    size: 64KB
    address: 0x56

jethome_board_info:
  - id: meter_board_info
    eeprom_id: eeprom_meter
    required: false

meter_calibration:
  board_info_id: meter_board_info
  chip: atm90e32
  board_model: JXD-D3-PM3-3
