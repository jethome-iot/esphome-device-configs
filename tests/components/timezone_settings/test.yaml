# Google Test binary for components/timezone_settings, built through esphome compile by
# tests/run.py. The harness main.cpp replaces the generated one, so nothing declared here is
# ever set up: the sections exist to get the sources and the generated wiring compiled. The
# cases build their own instances over clocks whose syncs they fire.
esphome:
  name: timezone-settings-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer
      # dump_config and the refusals say what they say only in the log, which a case reads
      # through a listener.
      - -DUSE_LOG_LISTENERS
      - -DESPHOME_LOG_MAX_LISTENERS=1

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [timezone_settings]

# What rtc-time.yaml keeps Home Assistant's zone in.
globals:
  - id: ha_zone
    type: esphome::time::ParsedTimezone
    restore_value: true

# The host stands in for all three. Home Assistant's has no timezone, as the device's has none.
time:
  - platform: host
    id: ha_clock
  - platform: host
    id: sntp_clock
    timezone: UTC
  - platform: host
    id: rtc_clock
    timezone: UTC

timezone_settings:
  id: zone
  timezone: Europe/Berlin
  homeassistant_zone: ha_zone
  clocks:
    homeassistant: ha_clock
    sntp: sntp_clock
    rtc: rtc_clock
  # So the generated automation compiles; the cases attach their own.
  on_clock_set:
    then:
      - logger.log: "Clock set"
