# Google Test binary for components/web_automation_editor, built through esphome
# compile by tests/run.py. The harness main.cpp replaces the generated one, so
# nothing declared here is ever set up: the entities, the engine and the editor
# exist only to get the sources compiled and the USE_* defines set. The tests
# create their own, over the harness's web_server_base stand-in.
esphome:
  name: web-automation-editor-test
  includes: [../../harness/main.cpp, ../../harness/environment.cpp, cases]
  libraries: ["google/googletest@^1.15.2"]
  platformio_options:
    build_type: debug
    build_unflags: [-Os]
    build_flags:
      - -Og
      - -DESPHOME_DEBUG
      - -fsanitize=address
      - -fsanitize=undefined
      - -fno-sanitize-recover=all
      - -fno-omit-frame-pointer

host:

logger:
  level: DEBUG

external_components:
  - source: ../../../components
    components: [filesystem_storage_abstract, automations, web_automation_editor, web_origin_guard]
  - source: ../../harness/components
    components: [dir_storage, web_server_base]

time:
  - platform: host
    id: host_time
    timezone: UTC

dir_storage:
  id: test_storage
  path: .storage

automations:
  storage: test_storage
  time_id: host_time

web_server_base: {}

web_automation_editor:

# App sizes its entity lists from what is declared here and silently drops a
# registration past that, so this is at least what cases/common.h registers.
# The unit puts "°C" into the generated unit table, where the cases expect it.
binary_sensor:
  - platform: template
    id: in_1_unused
    name: "In 1"

sensor:
  - platform: template
    id: temp_unused
    name: "Temp"
    unit_of_measurement: "°C"

switch:
  - platform: template
    id: relay_1_unused
    name: "Relay 1"
    optimistic: true
  - platform: template
    id: hidden_unused
    name: "Hidden"
    optimistic: true
