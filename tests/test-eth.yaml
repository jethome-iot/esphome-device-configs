script:
  - id: test_eth
  # проверка значения на nan
    then:
      - script.execute:
          id: started_test
          test_name: "ETH"
      - lambda: |-
          static const char* TAG = "test";

          id(eth_result_bool).publish_state(false);
          
          if(id(eth_ip).has_state()) {
            if (id(eth_ip).state != "0.0.0.0") {
              id(eth_result_bool).publish_state(true);
              ESP_LOGI(TAG, "ETH IP Address: %s", id(eth_ip).state.c_str());
            } else {
              id(eth_result_bool).publish_state(false);
              ESP_LOGE(TAG, "ETH IP Address is empty");
            }
          }

      - script.execute:
          id: result_test
          test_name: "ETH"
          test_result: !lambda return id(eth_result_bool).state;
      - script.execute: 
          id: finished_test
          test_name: "ETH"
