---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# The vendored menu components must stay byte-comparable to the upstream release they
# track — see components/README.md. No formatter may touch them.
exclude: &vendored ^components/(display_menu_base|graphical_display_menu)/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        args: [--fix]
        exclude: *vendored
      - id: ruff-format
        exclude: *vendored

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
        exclude: *vendored

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch=master]
