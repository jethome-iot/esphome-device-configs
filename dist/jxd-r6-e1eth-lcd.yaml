                - lambda: id(forget_temps_yes)->set_text("Confirm - OK");
                - script.execute:
                    id: forget_temperatures
                    slot: -1
        - type: menu
          text: Factory reset
          weight: 40
          items:
            - type: label
              text: Factory reset?
            - type: command
              text: Confirm
              id: factory_reset_yes
              on_value:
                - lambda: id(factory_reset_yes)->set_text("Confirm - OK");
                - delay: 1s
                - lambda: |-
                    // The partition is wiped at the next boot; the record has to outlive
                    // the preferences erase, which takes all of NVS.
                    global_preferences->reset();
                    if (!id(user_storage)->request_format()) {
                      ESP_LOGE("factory_reset", "Wiping the user partition failed");
                    }
                    App.safe_reboot();
        - type: command
          text: Reboot device
          weight: 30
          on_value:
            - lambda: App.safe_reboot();
    - id: !extend 'info_submenu'
      items:
        - type: label
          text: 'IP(Eth):'
        - type: label
          text: !lambda |-
            return " " + id(ip_eth).state;
        - type: label
          text: 'IP(WiFi):'
        - type: label
          text: !lambda |-
            if (id(captive_portal_id).is_active()) {
              char buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
              return " " + std::string(id(wifi_id).wifi_soft_ap_ip().str_to(buf));
