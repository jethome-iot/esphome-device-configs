      - address: 3
        read_lambda: return id(relay_4).state;
        write_lambda: |-
          const std::string holder = switch_hold::holder(id(relay_4));
          if (!holder.empty() && x != id(relay_4).state) {
            ESP_LOGW("modbus", "Coil 0x0003 refused: thermostat '%s' drives relay_4", holder.c_str());
            return false;
          }
          if (x) {
            id(relay_4).turn_on();
          } else {
            id(relay_4).turn_off();
          }
          return true;
      - address: 4
        read_lambda: return id(relay_5).state;
        write_lambda: |-
          const std::string holder = switch_hold::holder(id(relay_5));
          if (!holder.empty() && x != id(relay_5).state) {
            ESP_LOGW("modbus", "Coil 0x0004 refused: thermostat '%s' drives relay_5", holder.c_str());
            return false;
          }
          if (x) {
            id(relay_5).turn_on();
          } else {
            id(relay_5).turn_off();
          }
          return true;
      - address: 5
        read_lambda: return id(relay_6).state;
        write_lambda: |-
          const std::string holder = switch_hold::holder(id(relay_6));
          if (!holder.empty() && x != id(relay_6).state) {
            ESP_LOGW("modbus", "Coil 0x0005 refused: thermostat '%s' drives relay_6", holder.c_str());
            return false;
          }
          if (x) {
            id(relay_6).turn_on();
          } else {
            id(relay_6).turn_off();
          }
          return true;
      - address: 16
        read_lambda: return id(input_1).state;
      - address: 17
        read_lambda: return id(input_2).state;
      - address: 18
        read_lambda: return id(input_3).state;
      - address: 19
        read_lambda: return id(input_4).state;
      - address: 20
        read_lambda: return id(input_5).state;
      - address: 21
        read_lambda: return id(input_6).state;
modbus_map:
  modbus_server_id: modbus_server1
  bits:
    - address: 0
      name: Relays
    - address: 16
      name: Inputs
  registers:
    - address: 0
      name: Temperature slots
      scale: 0.1
      unit: °C
      no_value: 32768
network:
  priority:
    - ethernet
    - wifi
ethernet:
  id: ethernet_id
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: 17
  phy_addr: 1
  power_pin: GPIO15
  on_connect:
    - component.update: ip
  on_disconnect:
    - component.update: ip
wifi:
  id: wifi_id
  enable_on_boot: false
  reboot_timeout: 0s
  ap: null
  on_connect:
    - component.update: ip
  on_disconnect:
    - component.update: ip
captive_portal:
  id: captive_portal_id
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - pcf8563.write_time: null
        - delay: 1s
        - lambda: id(stored_timezone) = esphome::time::get_global_tz();
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        pcf8563.write_time: null
  - platform: pcf8563
    id: pcf8563_time
    address: 81
    timezone: ${timezone}
    update_interval: 15min
littlefs_storage:
  id: user_storage
  partition_label: littlefs
  partition_size: 4MB
  base_path: /littlefs
config_json:
  id: config_json_keeper
  storage: user_storage
dallas_scan:
  id: temps
  one_wire_id: one_wire_bus
  max_sensors: 16
  storage: file
  update_interval: 20s
  web_server:
    sorting_group_id: group_temperature
    sorting_weight: 1
uart:
  - id: jxm_uart1
    tx_pin: GPIO33
    rx_pin: GPIO34
    baud_rate: 9600
    stop_bits: 1
  - id: jxm_uart2
    tx_pin: GPIO32
    rx_pin: GPIO39
    baud_rate: 9600
    stop_bits: 1
web_auth:
  id: web_auth_credentials
web_device_dashboard:
  board_info_id: board_info
  storage_id: user_storage
  dallas_scan_id: temps
web_file_browser:
  storage_id: user_storage
display:
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: blank_page
        lambda: return;
  - platform: ssd1306_i2c
    id: display1
    model: SH1106_128X64
    address: 60
    update_interval: 200ms
    pages:
      - id: main_page
        lambda: |-
          uint8_t mac[6];
          get_mac_address_raw(mac);
          auto str_name = "${friendly_name}-" + str_snprintf("%02X%02X", 4, mac[4], mac[5]);

          const int row_size = 15;
          int y = (64 - row_size * 4) / 2;

          it.printf(0, y, id(f6x12), "%s", str_name.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "IP: %s", id(ip).state.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "UP: %s", id(uptime_sensor).state.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "VIN: %2.1fV", id(input_voltage).state);

          // Status icons share the bottom row, to the right of the VIN reading:
          // centred on the row's cap height, and off the screen edge.
          it.image(88, 45, ${link_icon});
          it.image(109, 45, id(api_server).is_connected() ? id(icon_ha) : id(icon_ha_off));
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: status_page
        lambda: |-
          const auto black = Color(0, 0, 0);
          const int radius = 4;
          const int x_spacing = 15;
          const int x_start = 5;

          it.print(0, 0, id(f5x7), "Relays");
          int x = x_start;
          for (size_t i = 0; i < id(relays).size(); i++) {
            if (id(relays)[i]->state) {
              it.filled_circle(x, 15, radius);
            } else {
              it.circle(x, 15, radius);
            }
            if ((int) i == id(status_relay_sel)) {
              it.filled_rectangle(x - 3, 21, 7, 9);
              it.printf(x - 2, 22, id(f5x7), black, "%d", (int) i + 1);
            } else {
              it.printf(x - 2, 22, id(f5x7), "%d", (int) i + 1);
            }
            x += x_spacing;
          }

          it.print(0, 32, id(f5x7), "Inputs");
          x = x_start;
          int num = 1;
          for (auto *input : id(inputs)) {
            if (input->state) {
              it.filled_circle(x, 47, radius);
            } else {
              it.circle(x, 47, radius);
            }
            it.printf(x - 2, 54, id(f5x7), "%d", num++);
            x += x_spacing;
          }

          // Slots up to the last bound one, three rows, a freed slot reads --.-; UP/DOWN scroll.
          const int rows = 3;
          auto *scan = id(temps);
          const int used = scan->used_slots();
          int &scroll = id(status_temp_scroll);
          scroll = std::clamp(scroll, 0, std::max(used - rows, 0));

          it.print(92, 0, id(f5x7), "Temp");
          if (scroll > 0)
            it.filled_triangle(117, 6, 121, 6, 119, 2);
          if (scroll + rows < used)
            it.filled_triangle(123, 2, 127, 2, 125, 6);

          int y = 11;
          for (int slot = scroll; slot < std::min(scroll + rows, used); slot++) {
            it.printf(92, y, id(f5x7), "%.7s", scan->slot_name(slot).c_str());
            y += 8;
            const float value = scan->temperature(slot);
            if (std::isnan(value)) {
              it.print(92, y, id(f5x7), "--.-");
            } else {
              it.printf(92, y, id(f5x7), "%.1f", value);
            }
            y += 11;
          }
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: time_page
        lambda: |-
          const auto width = it.get_width();
          const auto height = it.get_height();
          it.strftime(width / 2, height / 2 - 12, id(big_label_font), TextAlign::CENTER,
                      "%H:%M:%S", id(pcf8563_time).now());
          it.strftime(width / 2, height / 2 + 8, id(f7x14_mod2), TextAlign::CENTER,
                      "%a, %b %d", id(pcf8563_time).now());
