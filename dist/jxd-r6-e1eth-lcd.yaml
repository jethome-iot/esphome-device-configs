display:
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: blank_page
        lambda: return;
  - platform: ssd1306_i2c
    id: display1
    model: SH1106_128X64
    address: 60
    update_interval: 200ms
    pages:
      - id: main_page
        lambda: |-
          uint8_t mac[6];
          get_mac_address_raw(mac);
          auto str_name = "${friendly_name}-" + str_snprintf("%02X%02X", 4, mac[4], mac[5]);

          const int row_size = 15;
          int y = (64 - row_size * 4) / 2;

          it.printf(0, y, id(f6x12), "%s", str_name.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "IP: %s", id(ip).state.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "UP: %s", id(uptime_sensor).state.c_str());
          y += row_size;
          it.printf(0, y, id(f6x12), "VIN: %2.1fV", id(input_voltage).state);

          // Status icons share the bottom row, to the right of the VIN reading:
          // centred on the row's cap height, and off the screen edge.
          it.image(88, 45, ${link_icon});
          it.image(109, 45, id(api_server).is_connected() ? id(icon_ha) : id(icon_ha_off));
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: status_page
        lambda: |-
          const auto black = Color(0, 0, 0);
          const int radius = 4;
          const int x_spacing = 15;
          const int x_start = 5;

          it.print(0, 0, id(f5x7), "Relays");
          int x = x_start;
          for (size_t i = 0; i < id(relays).size(); i++) {
            if (id(relays)[i]->state) {
              it.filled_circle(x, 15, radius);
            } else {
              it.circle(x, 15, radius);
            }
            if ((int) i == id(status_relay_sel)) {
              it.filled_rectangle(x - 3, 21, 7, 9);
              it.printf(x - 2, 22, id(f5x7), black, "%d", (int) i + 1);
            } else {
              it.printf(x - 2, 22, id(f5x7), "%d", (int) i + 1);
            }
            x += x_spacing;
          }

          it.print(0, 32, id(f5x7), "Inputs");
          x = x_start;
          int num = 1;
          for (auto *input : id(inputs)) {
            if (input->state) {
              it.filled_circle(x, 47, radius);
            } else {
              it.circle(x, 47, radius);
            }
            it.printf(x - 2, 54, id(f5x7), "%d", num++);
            x += x_spacing;
          }

          // Slots up to the last bound one, three rows, a freed slot reads --.-; UP/DOWN scroll.
          const int rows = 3;
          auto *scan = id(temps);
          const int used = scan->used_slots();
          int &scroll = id(status_temp_scroll);
          scroll = std::clamp(scroll, 0, std::max(used - rows, 0));

          it.print(92, 0, id(f5x7), "Temp");
          if (scroll > 0)
            it.filled_triangle(117, 6, 121, 6, 119, 2);
          if (scroll + rows < used)
            it.filled_triangle(123, 2, 127, 2, 125, 6);

          int y = 11;
          for (int slot = scroll; slot < std::min(scroll + rows, used); slot++) {
            it.printf(92, y, id(f5x7), "%.7s", scan->slot_name(slot).c_str());
            y += 8;
            const float value = scan->temperature(slot);
            if (std::isnan(value)) {
              it.print(92, y, id(f5x7), "--.-");
            } else {
              it.printf(92, y, id(f5x7), "%.1f", value);
            }
            y += 11;
          }
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: time_page
        lambda: |-
          const auto width = it.get_width();
          const auto height = it.get_height();
          it.strftime(width / 2, height / 2 - 12, id(big_label_font), TextAlign::CENTER,
                      "%H:%M:%S", id(pcf8563_time).now());
          it.strftime(width / 2, height / 2 + 8, id(f7x14_mod2), TextAlign::CENTER,
                      "%a, %b %d", id(pcf8563_time).now());
