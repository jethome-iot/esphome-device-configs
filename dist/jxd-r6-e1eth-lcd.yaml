  - platform: template
    name: Network mode
    id: network_mode
    web_server:
      sorting_group_id: group_network
      sorting_weight: 0
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: Ethernet
    options:
      - Auto
      - Ethernet
      - WiFi
    on_value:
      - if:
          condition:
            lambda: return id(network_mode_applied);
          then:
            - script.execute: apply_network_mode
interval:
  - interval: 1s
    then:
      - lambda: "if (id(display_off_threshold_s) == 0)\n  return;\n\nif (id(display_off_s)\
          \ >= id(display_off_threshold_s)) {\n  id(display_menu).hide();\n  id(display1).show_page(id(blank_page));\n\
          } else {\n  id(display_off_s)++;\n}"
  - interval: 2s
    then:
      - lambda: "const bool ap = id(wifi_id).is_ap_active();\nif (ap != id(ap_was_active))\
          \ {\n  id(ap_was_active) = ap;\n  id(ip).update();\n}"
i2c:
  - id: i2c1
    sda: 5
    scl: 4
    frequency: 400kHz
    scan: true
modbus:
  - id: modbus_bus
    uart_id: jxm_uart2
    role: server
number:
  - platform: template
    name: Modbus address
    id: modbus_address
