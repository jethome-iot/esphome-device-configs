                });
                offset->add_on_enter_callback([=]() { *pending = stored(); });
                offset->add_on_next_callback([=]() { *pending = std::min(pending->value_or(stored()) + 1, limit); });
                offset->add_on_prev_callback([=]() { *pending = std::max(pending->value_or(stored()) - 1, -limit); });
                offset->add_on_leave_callback([=]() {
