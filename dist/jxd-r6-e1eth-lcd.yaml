esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            id(relays) = {id(relay_1), id(relay_2), id(relay_3),
                          id(relay_4), id(relay_5), id(relay_6)};
            id(inputs) = {id(input_1), id(input_2), id(input_3),
                          id(input_4), id(input_5), id(input_6)};
    - priority: 700
      then:
        - script.execute: apply_modbus_bus
        - globals.set:
            id: modbus_bus_applied
            value: 'true'
    - priority: 600
      then:
        - script.execute: set_wifi_ap
    - priority: 200
      then:
        - script.execute: apply_network_mode
        - globals.set:
            id: network_mode_applied
            value: 'true'
    - priority: 700
      then:
        - lambda: |-
            using namespace display_menu_base;
            using namespace panel_text;
            using Field = entity_config::SwitchSettingsJson::Field;
            static constexpr size_t ROW = 18;  // f7x14_mod2 glyphs across the panel
            auto *font = id(f7x14_mod2);
            const HasGlyph has = [font](uint32_t code_point) { return font->find_glyph(code_point) != nullptr; };
            // The same cut for On and Off, so the label does not change as the state does.
            auto with_state = [has](const std::string &name, bool on) {
              return panel_fit(panel_safe(name, 4 * ROW, has), ROW - 6) + (on ? " (On)" : " (Off)");
            };
            auto add_row = [](MenuItemMenu *menu, const char *text, std::function<size_t()> count,
                              std::function<std::string(int)> label, std::function<int()> index,
                              std::function<void(size_t)> set) {
              auto *pending = new int(-1);  // the choice being edited; -1 outside editing
              // The row reads "text (value)" or "text >value<": a value too long for the rest
              // of it is cut, so the closing mark stays on the panel.
              const size_t taken = panel_glyphs(text) + 3;
              const size_t room = taken < ROW ? ROW - taken : 0;
              auto *row = new MenuItemCustom();
              row->set_text(std::string(text));
              row->set_value_lambda(
                  [=](const MenuItem *) { return panel_fit(label(*pending >= 0 ? *pending : index()), room); });
              row->add_on_enter_callback([=]() { *pending = index(); });
              row->add_on_next_callback([=]() { *pending = (*pending + 1) % static_cast<int>(count()); });
              row->add_on_prev_callback([=]() {
                const int n = count();
                *pending = *pending < 0 ? n - 1 : (*pending + n - 1) % n;
              });
              row->add_on_leave_callback([=]() {
                if (*pending >= 0 && *pending != index())
                  set(*pending);
                *pending = -1;
              });
              menu->add_item(row);
            };
            // A first row naming the entity. The menu has no row the cursor skips, so the
            // submenu opens on the row below it; CENTER does nothing on a label. on_enter also
            // fires on BACK from a child menu, so these submenus must not get one.
            auto add_title = [has](MenuItemMenu *menu, std::function<std::string()> name) {
              auto *title = new MenuItem(MENU_ITEM_LABEL);
              title->set_text([has, name](const MenuItem *) { return panel_fit(panel_safe(name(), 4 * ROW, has), ROW); });
              menu->add_item(title);
              menu->add_on_enter_callback([]() { id(display_menu).down(); });
            };
            // Each submenu is built next to its entity, so nothing binds its rows by position.
            auto *sws = id(switch_settings);
            for (auto *sw : id(relays)) {
              auto *menu = new MenuItemMenu();
              menu->set_text([sws, sw, with_state](const MenuItem *) {
                return with_state(sws->display_name(sw), sw->state);
              });
              add_title(menu, [sws, sw]() { return sws->display_name(sw); });
              // Not a MenuItemSwitch: a relay a thermostat drives is the thermostat's, and the row
              // only logs whose it is.
              auto *state_row = new MenuItemCustom();
              state_row->set_text(std::string("State"));
              state_row->set_immediate_edit(true);
              state_row->set_value_lambda([sw](const MenuItem *) { return std::string(sw->state ? "On" : "Off"); });
              auto toggle = [sw]() {
                const std::string holder = switch_hold::holder(sw);
                if (holder.empty()) {
                  sw->toggle();
                } else {
                  ESP_LOGI("menu", "'%s' left alone: thermostat '%s' drives it", sw->get_name().c_str(), holder.c_str());
                }
              };
              state_row->add_on_next_callback(toggle);
              state_row->add_on_prev_callback(toggle);
              menu->add_item(state_row);

              // set_option refuses only an Inverted change on a relay a thermostat drives.
              auto field_row = [&](const char *text, Field field) {
                add_row(menu, text, [sws, field]() { return sws->option_count(field); },
                        [sws, sw, field, has](int index) {
                          return panel_safe(sws->option_label(sw, field, index), 4 * ROW, has);
                        },
                        [sws, sw, field]() { return sws->option_index(sw, field); },
                        [sws, sw, field](size_t index) {
                          if (!sws->set_option(sw, field, index))
                            ESP_LOGI("menu", "'%s' Inverted left alone: thermostat '%s' drives it",
                                     sw->get_name().c_str(), switch_hold::holder(sw).c_str());
                        });
              };
              field_row("Inverted", Field::INVERTED);
              field_row("Start mode", Field::RESTORE_MODE);
              field_row("Bind to", Field::BINDING_INPUT);
              field_row("Binding", Field::BINDING_MODE);
              id(relays_menu)->add_item(menu);
            }

            auto *bss = id(binary_sensor_settings);
            for (auto *input : id(inputs)) {
              auto *menu = new MenuItemMenu();
              menu->set_text([bss, input, with_state](const MenuItem *) {
                return with_state(bss->display_name(input), input->state);
              });
              add_title(menu, [bss, input]() { return bss->display_name(input); });
              auto *state_row = new MenuItem(MENU_ITEM_LABEL);
              state_row->set_text([input](const MenuItem *) {
                return std::string(input->state ? "State (On)" : "State (Off)");
              });
              menu->add_item(state_row);

              add_row(menu, "Inverted", []() { return 2; },
                      [](int index) { return index == 1 ? "Yes" : "No"; },
