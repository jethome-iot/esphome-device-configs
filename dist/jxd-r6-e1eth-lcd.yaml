      sorting_weight: 1
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 1
    min_value: 1
    max_value: 247
    step: 1
modbus_server:
  - id: modbus_server1
    modbus_id: modbus_bus
    address: 1
    courtesy_response:
      enabled: true
