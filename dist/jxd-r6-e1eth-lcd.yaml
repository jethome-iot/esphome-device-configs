    bits:
      - address: 0
        read_lambda: return id(relay_1).state;
        write_lambda: |-
          const std::string holder = switch_hold::holder(id(relay_1));
          if (!holder.empty() && x != id(relay_1).state) {
            ESP_LOGW("modbus", "Coil 0x0000 refused: thermostat '%s' drives relay_1", holder.c_str());
            return false;
          }
          if (x) {
            id(relay_1).turn_on();
          } else {
            id(relay_1).turn_off();
          }
          return true;
      - address: 1
        read_lambda: return id(relay_2).state;
        write_lambda: |-
          const std::string holder = switch_hold::holder(id(relay_2));
          if (!holder.empty() && x != id(relay_2).state) {
