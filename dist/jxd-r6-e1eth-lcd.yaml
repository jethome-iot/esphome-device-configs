        - type: label
          text: 'MAC(Eth):'
        - type: label
          text: !lambda |-
            return " " + id(mac_eth).state;
        - type: label
          text: 'MAC(WiFi):'
        - type: label
          text: !lambda |-
            return " " + id(mac_wifi).state;
        - type: label
          text: 'AP password:'
        - type: label
          text: !lambda |-
            uint8_t mac[6];
            get_mac_address_raw(mac);
            return " " + str_snprintf("%02x%02x%02x%02x", 8, mac[2], mac[3], mac[4], mac[5]);
    - id: !extend 'menu_settings_id'
      items:
        - type: select
          text: Network
          select: network_mode
        - type: menu
          text: Reset WiFi creds
          weight: 20
          items:
            - type: label
              text: Reset?
            - type: command
              text: Confirm
              id: wifi_reset_yes
              on_value:
                - lambda: id(wifi_reset_yes)->set_text("Confirm - OK");
                - delay: 1s
                - script.execute: reset_wifi
    - id: !extend 'info_submenu'
      items:
        - type: label
          weight: 10
          text: 'Serial:'
        - type: label
          weight: 10
          text: !lambda |-
            // A v4 board without device.id has only its board serial.
            auto *board = id(board_info);
            const auto &serial = board->get_device_serial().empty() ? board->get_board_serial() : board->get_device_serial();
            return serial.empty() ? std::string(" --") : " " + serial;
dashboard_import:
  package_import_url: github://jethome-iot/esphome-device-configs/dist/jxd-r6-e1eth-lcd.yaml@master
  import_full_config: true
substitutions:
  link_icon: 'id(ethernet_id).is_connected() ? id(icon_eth) : id(wifi_id).is_connected()
    || id(wifi_id).is_ap_active() ? id(icon_wifi) : (id(network_mode).active_index().value_or(0)
    == 2 ? id(icon_wifi_off) : id(icon_eth_off))'
  timezone: UTC
  name: jxd-r6-e1eth-lcd
  friendly_name: JXD-R6-E1ETH-LCD
  version: 1.0.0
