panel_text: null
graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  fill_row: true
  right_for_menu_enter: false
  on_redraw:
    then:
      - component.update: display1
  items:
    - type: menu
      text: Relays
      id: relays_menu
    - type: menu
      text: Inputs
      id: inputs_menu
    - type: menu
      text: Temperatures
      id: temperatures_menu
      items:
        - type: label
          text: !lambda |-
            auto *s = id(pcb_temp);
            if (std::isnan(s->state))
              return str_sprintf("%s: --", s->get_name().c_str());
            return str_sprintf("%s: %.1f°C", s->get_name().c_str(), s->state);
    - type: menu
      text: Thermostats
      id: thermostats_menu
    - type: menu
      text: Automations
      id: automations_menu
    - type: menu
      text: Info
      id: info_submenu
      items: null
    - type: menu
      text: Settings
      id: menu_settings_id
      items:
        - type: select
          text: Display off
          select: display_off_timer_select
        - type: menu
          text: Modbus
          weight: 10
          items:
            - type: number
              text: Address
              number: modbus_address
              format: '%.0f'
            - type: select
              text: Baud rate
              select: modbus_baud_rate
            - type: select
              text: Parity
              select: modbus_parity
            - type: select
              text: Stop bits
              select: modbus_stop_bits
        - type: menu
          text: Temp sensors
          weight: 20
          items:
            - type: label
              text: Forget all?
            - type: command
              text: Confirm
              id: forget_temps_yes
              on_value:
                - lambda: id(forget_temps_yes)->set_text("Confirm - OK");
                - script.execute:
                    id: forget_temperatures
                    slot: -1
        - type: menu
          text: Factory reset
          weight: 40
          items:
            - type: label
              text: Factory reset?
            - type: command
              text: Confirm
              id: factory_reset_yes
              on_value:
                - lambda: id(factory_reset_yes)->set_text("Confirm - OK");
                - delay: 1s
                - script.execute: run_factory_reset
        - type: command
          text: Reboot device
          weight: 30
          on_value:
            - lambda: App.safe_reboot();
    - id: !extend 'info_submenu'
      items:
        - type: label
          text: 'IP(Eth):'
        - type: label
          text: !lambda |-
            return " " + id(ip_eth).state;
        - type: label
          text: 'IP(WiFi):'
        - type: label
          text: !lambda |-
            if (id(captive_portal_id).is_active()) {
              char buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
              return " " + std::string(id(wifi_id).wifi_soft_ap_ip().str_to(buf));
            }
            return " " + id(ip_wifi).state;
        - type: label
          text: 'MAC(Eth):'
        - type: label
          text: !lambda |-
            return " " + id(mac_eth).state;
        - type: label
          text: 'MAC(WiFi):'
        - type: label
          text: !lambda |-
            return " " + id(mac_wifi).state;
        - type: label
          text: 'AP password:'
        - type: label
          text: !lambda |-
            uint8_t mac[6];
            get_mac_address_raw(mac);
            return " " + str_snprintf("%02x%02x%02x%02x", 8, mac[2], mac[3], mac[4], mac[5]);
    - id: !extend 'menu_settings_id'
      items:
        - type: select
          text: Network
          select: network_mode
        - type: menu
          text: Reset WiFi creds
          weight: 20
          items:
            - type: label
              text: Reset?
            - type: command
              text: Confirm
              id: wifi_reset_yes
              on_value:
                - lambda: id(wifi_reset_yes)->set_text("Confirm - OK");
                - delay: 1s
                - script.execute: reset_wifi
                - delay: 3s
                - lambda: id(wifi_reset_yes)->set_text("Confirm");
    - id: !extend 'info_submenu'
      items:
        - type: label
          weight: 10
          text: 'Serial:'
        - type: label
          weight: 10
          text: !lambda |-
            // A v4 board without device.id has only its board serial.
            auto *board = id(board_info);
            const auto &serial = board->get_device_serial().empty() ? board->get_board_serial() : board->get_device_serial();
            return serial.empty() ? std::string(" --") : " " + serial;
dashboard_import:
  package_import_url: github://jethome-iot/esphome-device-configs/dist/jxd-r6-e1eth-lcd.yaml@master
  import_full_config: true
substitutions:
