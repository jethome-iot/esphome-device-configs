          return (int16_t) (std::isnan(t) ? -32768 : lroundf(t * 10));'
      - address: 15
        value_type: S_WORD
        read_lambda: 'float t = id(temps)->temperature(15);

          return (int16_t) (std::isnan(t) ? -32768 : lroundf(t * 10));'
    bits:
      - address: 0
        read_lambda: return id(relay_1).state;
        write_lambda: "if (x) {\n  id(relay_1).turn_on();\n} else {\n  id(relay_1).turn_off();\n\
          }\nreturn true;"
      - address: 1
        read_lambda: return id(relay_2).state;
        write_lambda: "if (x) {\n  id(relay_2).turn_on();\n} else {\n  id(relay_2).turn_off();\n\
          }\nreturn true;"
      - address: 2
        read_lambda: return id(relay_3).state;
        write_lambda: "if (x) {\n  id(relay_3).turn_on();\n} else {\n  id(relay_3).turn_off();\n\
          }\nreturn true;"
      - address: 3
        read_lambda: return id(relay_4).state;
        write_lambda: "if (x) {\n  id(relay_4).turn_on();\n} else {\n  id(relay_4).turn_off();\n\
          }\nreturn true;"
      - address: 4
        read_lambda: return id(relay_5).state;
        write_lambda: "if (x) {\n  id(relay_5).turn_on();\n} else {\n  id(relay_5).turn_off();\n\
          }\nreturn true;"
      - address: 5
        read_lambda: return id(relay_6).state;
        write_lambda: "if (x) {\n  id(relay_6).turn_on();\n} else {\n  id(relay_6).turn_off();\n\
          }\nreturn true;"
      - address: 16
        read_lambda: return id(input_1).state;
      - address: 17
        read_lambda: return id(input_2).state;
      - address: 18
        read_lambda: return id(input_3).state;
      - address: 19
        read_lambda: return id(input_4).state;
      - address: 20
        read_lambda: return id(input_5).state;
      - address: 21
        read_lambda: return id(input_6).state;
image:
  - platform: file
    file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/res/ethernet.svg
    id: icon_eth
    type: BINARY
  - platform: file
    file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/res/ethernet-off.svg
    id: icon_eth_off
    type: BINARY
  - platform: file
    file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/res/wifi.svg
    id: icon_wifi
    type: BINARY
  - platform: file
    file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/res/wifi-off.svg
    id: icon_wifi_off
    type: BINARY
  - platform: file
    file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/res/ha.svg
    id: icon_ha
    type: BINARY
  - platform: file
    file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/res/ha-off.svg
    id: icon_ha_off
    type: BINARY
network:
  priority:
    - ethernet
    - wifi
ethernet:
  id: ethernet_id
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: 17
  phy_addr: 1
  power_pin: GPIO15
  on_connect:
    - component.update: ip
  on_disconnect:
    - component.update: ip
wifi:
  id: wifi_id
  enable_on_boot: false
  reboot_timeout: 0s
  ap: null
  on_connect:
    - component.update: ip
  on_disconnect:
    - component.update: ip
captive_portal:
  id: captive_portal_id
script:
  - id: set_wifi_ap
    then:
      - lambda: 'uint8_t mac[6];

          get_mac_address_raw(mac);

          wifi::WiFiAP ap;

          ap.set_ssid("${friendly_name}-" + str_snprintf("%02X%02X", 4, mac[4], mac[5]));

          ap.set_password(str_snprintf("%02x%02x%02x%02x", 8, mac[2], mac[3], mac[4],
          mac[5]));

          id(wifi_id).set_ap(ap);'
  - id: apply_network_mode
    then:
      - lambda: "// Option index: 0 Auto, 1 Ethernet, 2 WiFi.\nconst size_t mode =\
          \ id(network_mode).active_index().value_or(0);\nif (mode == 2) {\n  id(ethernet_id).disable();\n\
          } else {\n  id(ethernet_id).enable();\n}\nif (mode == 1) {\n  id(wifi_id).disable();\n\
          } else {\n  id(wifi_id).enable();\n}"
      - component.update: ip
  - id: reset_wifi
    then:
      - logger.log: Reset WiFi creds
      - lambda: 'id(wifi_id).save_wifi_sta("", "");

          App.safe_reboot();'
  - id: setup_time
    then:
      - lambda: "const auto &tz = id(stored_timezone);\nif (tz.std_offset_seconds\
          \ != 0 || tz.has_dst()) {\n  esphome::time::set_global_tz(tz);\n}"
      - pcf8563.read_time:
          id: pcf8563_time
  - id: forget_temperatures
    parameters:
      slot: int
    then:
      - delay: 1s
      - lambda: id(temps)->forget(slot);
  - id: check_blank_page
    then:
      - lambda: "id(display_off_s) = 0;\nif (id(display1).get_active_page() == id(blank_page))\
          \ {\n  id(display1).show_page(id(main_page));\n}"
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - pcf8563.write_time: null
        - delay: 1s
        - lambda: id(stored_timezone) = esphome::time::get_global_tz();
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        pcf8563.write_time: null
  - platform: pcf8563
    id: pcf8563_time
    address: 81
    timezone: ${timezone}
    update_interval: 15min
external_components:
  - source:
      type: git
      url: https://github.com/jethome-iot/esphome-device-configs.git
      ref: master
      path: components
    components:
      - filesystem_storage_abstract
      - littlefs_storage
      - web_file_browser
  - source:
      type: git
      url: https://github.com/jethome-iot/esphome-device-configs.git
      ref: master
      path: components
    components:
      - dallas_scan
littlefs_storage:
  id: user_storage
  partition_label: littlefs
  partition_size: 4MB
  base_path: /littlefs
web_file_browser:
  storage_id: user_storage
dallas_scan:
  id: temps
  one_wire_id: one_wire_bus
  max_sensors: 16
  update_interval: 20s
  web_server:
    sorting_group_id: group_temperature
    sorting_weight: 1
uart:
  - id: jxm_uart1
    tx_pin: GPIO33
    rx_pin: GPIO34
    baud_rate: 9600
    stop_bits: 1
  - id: jxm_uart2
    tx_pin: GPIO32
    rx_pin: GPIO39
    baud_rate: 9600
    stop_bits: 1
display:
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: blank_page
        lambda: return;
  - platform: ssd1306_i2c
    id: display1
    model: SH1106_128X64
    address: 60
    update_interval: 200ms
    pages:
      - id: main_page
        lambda: 'uint8_t mac[6];

          get_mac_address_raw(mac);

          auto str_name = "${friendly_name}-" + str_snprintf("%02X%02X", 4, mac[4],
          mac[5]);


          const int row_size = 15;

          int y = (64 - row_size * 4) / 2;


          it.printf(0, y, id(f6x12), "%s", str_name.c_str());

          y += row_size;

          it.printf(0, y, id(f6x12), "IP: %s", id(ip).state.c_str());

          y += row_size;

          it.printf(0, y, id(f6x12), "UP: %s", id(uptime_sensor).state.c_str());

          y += row_size;

          it.printf(0, y, id(f6x12), "VIN: %2.1fV", id(input_voltage).state);


          // Status icons share the bottom row, to the right of the VIN reading:

          // centred on the row''s cap height, and off the screen edge.

          it.image(88, 45, ${link_icon});

          it.image(109, 45, id(api_server).is_connected() ? id(icon_ha) : id(icon_ha_off));'
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: status_page
        lambda: "const auto black = Color(0, 0, 0);\nconst int radius = 4;\nconst\
          \ int x_spacing = 15;\nconst int x_start = 5;\n\nit.print(0, 0, id(f5x7),\
          \ \"Relays\");\nint x = x_start;\nfor (size_t i = 0; i < id(relays).size();\
          \ i++) {\n  if (id(relays)[i]->state) {\n    it.filled_circle(x, 15, radius);\n\
          \  } else {\n    it.circle(x, 15, radius);\n  }\n  if ((int) i == id(status_relay_sel))\
          \ {\n    it.filled_rectangle(x - 3, 21, 7, 9);\n    it.printf(x - 2, 22,\
          \ id(f5x7), black, \"%d\", (int) i + 1);\n  } else {\n    it.printf(x -\
          \ 2, 22, id(f5x7), \"%d\", (int) i + 1);\n  }\n  x += x_spacing;\n}\n\n\
          it.print(0, 32, id(f5x7), \"Inputs\");\nx = x_start;\nint num = 1;\nfor\
          \ (auto *input : id(inputs)) {\n  if (input->state) {\n    it.filled_circle(x,\
          \ 47, radius);\n  } else {\n    it.circle(x, 47, radius);\n  }\n  it.printf(x\
          \ - 2, 54, id(f5x7), \"%d\", num++);\n  x += x_spacing;\n}\n\n// Slots up\
          \ to the last bound one, three rows, a freed slot reads --.-; UP/DOWN scroll.\n\
          const int rows = 3;\nauto *scan = id(temps);\nconst int used = scan->used_slots();\n\
          int &scroll = id(status_temp_scroll);\nscroll = std::clamp(scroll, 0, std::max(used\
          \ - rows, 0));\n\nit.print(92, 0, id(f5x7), \"Temp\");\nif (scroll > 0)\n\
          \  it.filled_triangle(117, 6, 121, 6, 119, 2);\nif (scroll + rows < used)\n\
          \  it.filled_triangle(123, 2, 127, 2, 125, 6);\n\nint y = 11;\nfor (int\
          \ slot = scroll; slot < std::min(scroll + rows, used); slot++) {\n  it.printf(92,\
          \ y, id(f5x7), \"%.7s\", scan->slot_name(slot).c_str());\n  y += 8;\n  const\
          \ float value = scan->temperature(slot);\n  if (std::isnan(value)) {\n \
          \   it.print(92, y, id(f5x7), \"--.-\");\n  } else {\n    it.printf(92,\
          \ y, id(f5x7), \"%.1f\", value);\n  }\n  y += 11;\n}"
  - platform: ssd1306_i2c
    id: !extend 'display1'
    pages:
      - id: time_page
        lambda: "const auto width = it.get_width();\nconst auto height = it.get_height();\n\
          it.strftime(width / 2, height / 2 - 12, id(big_label_font), TextAlign::CENTER,\n\
          \            \"%H:%M:%S\", id(pcf8563_time).now());\nit.strftime(width /\
          \ 2, height / 2 + 8, id(f7x14_mod2), TextAlign::CENTER,\n            \"\
          %a, %b %d\", id(pcf8563_time).now());"
font:
  - file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/fonts/7x14-mod2.bdf
    id: f7x14_mod2
  - file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/fonts/6x12.bdf
    id: f6x12
  - file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/fonts/5x7.bdf
    id: f5x7
  - file: https://raw.githubusercontent.com/jethome-iot/esphome-device-configs/master/assets/fonts/spleen-12x24.bdf
    id: big_label_font
graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  on_redraw:
    then:
      - component.update: display1
  items:
    - type: menu
      text: Relays
      items:
        - type: switch
          text: Relay 1
          switch: relay_1
          immediate_edit: true
        - type: switch
          text: Relay 2
          switch: relay_2
          immediate_edit: true
        - type: switch
          text: Relay 3
          switch: relay_3
          immediate_edit: true
        - type: switch
          text: Relay 4
          switch: relay_4
          immediate_edit: true
        - type: switch
          text: Relay 5
          switch: relay_5
          immediate_edit: true
        - type: switch
          text: Relay 6
          switch: relay_6
          immediate_edit: true
    - type: menu
      text: Inputs
      items:
        - type: label
          text: !lambda |-
            return id(input_1).state ? "Input 1: ON" : "Input 1: OFF";
        - type: label
          text: !lambda |-
            return id(input_2).state ? "Input 2: ON" : "Input 2: OFF";
        - type: label
          text: !lambda |-
            return id(input_3).state ? "Input 3: ON" : "Input 3: OFF";
        - type: label
          text: !lambda |-
            return id(input_4).state ? "Input 4: ON" : "Input 4: OFF";
        - type: label
          text: !lambda |-
            return id(input_5).state ? "Input 5: ON" : "Input 5: OFF";
        - type: label
          text: !lambda |-
            return id(input_6).state ? "Input 6: ON" : "Input 6: OFF";
    - type: menu
      text: Temperatures
      id: temperatures_menu
      items:
        - type: label
          text: !lambda |-
            auto *s = id(pcb_temp);
            if (std::isnan(s->state))
              return str_sprintf("%s: --", s->get_name().c_str());
            return str_sprintf("%s: %.1f°C", s->get_name().c_str(), s->state);
    - type: menu
      text: Info
      id: info_submenu
      items: null
    - type: menu
      text: Settings
      id: menu_settings_id
      items:
        - type: select
          text: Display off
          select: display_off_timer_select
        - type: menu
          text: Modbus
          items:
            - type: label
              text: Applied on reboot
            - type: number
              text: Address
              number: modbus_address
              format: '%.0f'
            - type: select
              text: Baud rate
              select: modbus_baud_rate
            - type: select
              text: Parity
              select: modbus_parity
            - type: select
              text: Stop bits
              select: modbus_stop_bits
        - type: menu
          text: Temp sensors
          items:
            - type: label
              text: Forget all?
            - type: command
              text: Confirm
              id: forget_temps_yes
              on_value:
                - lambda: id(forget_temps_yes)->set_text("Confirm - OK");
                - script.execute:
                    id: forget_temperatures
                    slot: -1
        - type: menu
          text: Factory reset
          items:
            - type: label
              text: Factory reset?
            - type: command
              text: Confirm
              id: factory_reset_yes
              on_value:
                - lambda: id(factory_reset_yes)->set_text("Confirm - OK");
                - delay: 1s
                - lambda: 'global_preferences->reset();

                    App.safe_reboot();'
        - type: command
          text: Reboot device
          on_value:
            - lambda: App.safe_reboot();
    - id: !extend 'info_submenu'
      items:
        - type: label
          text: 'IP(Eth):'
        - type: label
          text: !lambda |-
            return " " + id(ip_eth).state;
        - type: label
          text: 'IP(WiFi):'
        - type: label
          text: !lambda |-
            if (id(captive_portal_id).is_active()) {
              char buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
              return " " + std::string(id(wifi_id).wifi_soft_ap_ip().str_to(buf));
            }
            return " " + id(ip_wifi).state;
        - type: label
          text: 'MAC(Eth):'
        - type: label
          text: !lambda |-
            return " " + id(mac_eth).state;
        - type: label
          text: 'MAC(WiFi):'
        - type: label
          text: !lambda |-
            return " " + id(mac_wifi).state;
        - type: label
          text: 'AP password:'
        - type: label
          text: !lambda |-
            uint8_t mac[6];
            get_mac_address_raw(mac);
            return " " + str_snprintf("%02x%02x%02x%02x", 8, mac[2], mac[3], mac[4], mac[5]);
    - id: !extend 'menu_settings_id'
      items:
        - type: select
          text: Network
          select: network_mode
        - type: menu
          text: Reset WiFi creds
          items:
            - type: label
              text: Reset?
            - type: command
              text: Confirm
              id: wifi_reset_yes
              on_value:
                - lambda: id(wifi_reset_yes)->set_text("Confirm - OK");
                - delay: 1s
                - script.execute: reset_wifi
dashboard_import:
  package_import_url: github://jethome-iot/esphome-device-configs/dist/jxd-r6-e1eth-lcd.yaml@master
  import_full_config: true
substitutions:
  link_icon: 'id(ethernet_id).is_connected() ? id(icon_eth) : id(wifi_id).is_connected()
    || id(wifi_id).is_ap_active() ? id(icon_wifi) : (id(network_mode).active_index().value_or(0)
    == 2 ? id(icon_wifi_off) : id(icon_eth_off))'
  timezone: UTC
  name: jxd-r6-e1eth-lcd
  friendly_name: JXD-R6-E1ETH-LCD
  version: 1.0.0
