  - platform: template
    id: display_off_timer_select
    optimistic: true
    internal: true
    restore_value: true
    initial_option: 5m
    options:
      - 5m
      - 10m
      - 15m
      - never
    on_value:
      then:
        - lambda: 'const uint32_t MINUTES[] = {5, 10, 15, 0};

            id(display_off_threshold_s) = MINUTES[i] * 60;

            id(display_off_s) = 0;'
  - platform: template
    name: Modbus baud rate
    id: modbus_baud_rate
