script:
  - id: run_factory_reset
    then:
      - lambda: |-
          // The partition is wiped at the next boot; the record has to outlive
          // the preferences erase, which takes all of NVS.
          global_preferences->reset();
          if (!id(user_storage)->request_format()) {
            ESP_LOGE("factory_reset", "The user partition was not wiped and will not be");
          }
          App.safe_reboot();
  - id: fn_factory_reset
    then:
      - logger.log:
          level: WARN
          format: 'FN held for 10 s: factory reset in 5 s'
      - status_indicator.blink_fast: red_led
      - delay: 5s
      - script.execute: run_factory_reset
  - id: apply_modbus_bus
    then:
      - lambda: |-
          auto *bus = id(jxm_uart2);
          const uint32_t baud = parse_number<uint32_t>(id(modbus_baud_rate).current_option().c_str()).value_or(9600);
          const uint8_t stop_bits = parse_number<uint8_t>(id(modbus_stop_bits).current_option().c_str()).value_or(1);
          const auto parity = (uart::UARTParityOptions) id(modbus_parity).active_index().value_or(0);
          // A select re-set to its own option fires too, and a reload drops what is on the wire.
          if (baud == bus->get_baud_rate() && stop_bits == bus->get_stop_bits() && parity == bus->get_parity()) {
            return;
          }
          bus->set_baud_rate(baud);
          bus->set_stop_bits(stop_bits);
          bus->set_parity(parity);
          bus->load_settings(false);
          // Modbus takes its frame timing from the UART in setup(), which ran before this.
          id(modbus_bus).setup();
  - id: set_wifi_ap
    then:
      - lambda: |-
          uint8_t mac[6];
          get_mac_address_raw(mac);
          wifi::WiFiAP ap;
          ap.set_ssid("${friendly_name}-" + str_snprintf("%02X%02X", 4, mac[4], mac[5]));
          ap.set_password(str_snprintf("%02x%02x%02x%02x", 8, mac[2], mac[3], mac[4], mac[5]));
          id(wifi_id).set_ap(ap);
  - id: apply_network_mode
    then:
      - lambda: |-
          // Option index: 0 Auto, 1 Ethernet, 2 WiFi.
          const size_t mode = id(network_mode).active_index().value_or(0);
          if (mode == 2) {
            id(ethernet_id).disable();
          } else {
            id(ethernet_id).enable();
          }
          if (mode == 1) {
            id(wifi_id).disable();
          } else {
            id(wifi_id).enable();
          }
      - component.update: ip
  - id: reset_wifi
    then:
      - logger.log: Reset WiFi creds
      - lambda: |-
          // Both keys WiFiComponent::start can pick, the literal being its own.
          constexpr uint32_t WIFI_PREF_KEY_NO_COMPILED_NETWORK = 88491487;
          const uint32_t keys[] = {WIFI_PREF_KEY_NO_COMPILED_NETWORK, App.get_config_version_hash()};
          uint8_t cleared = 0;
          bool ok = true;
          for (uint32_t key : keys) {
            auto pref = global_preferences->make_preference(sizeof(cleared), key);
            ok = pref.save(&cleared) && ok;
          }
          ok = global_preferences->sync() && ok;
          if (!ok) {
            ESP_LOGE("reset_wifi", "Clearing the WiFi credentials failed");
          }
          id(wifi_id).clear_sta();
          // Restarting the radio is what raises the AP; in Ethernet mode there is none to raise.
          if (!id(wifi_id).is_disabled()) {
            id(wifi_id).disable();
            id(wifi_id).enable();
          }
  - id: setup_time
    then:
      - lambda: |-
          const auto &tz = id(stored_timezone);
          if (tz.std_offset_seconds != 0 || tz.has_dst()) {
            esphome::time::set_global_tz(tz);
          }
      - pcf8563.read_time:
          id: pcf8563_time
  - id: forget_temperatures
    parameters:
      slot: int
    then:
      - delay: 1s
      - lambda: id(temps)->forget(slot);
  - id: check_blank_page
    then:
      - lambda: |-
          id(display_off_s) = 0;
          if (id(display1).get_active_page() == id(blank_page)) {
            id(display1).show_page(id(main_page));
          }
