  - platform: template
    id: fn_held
    internal: true
    setup_priority: 600
    lambda: |-
      static bool armed = false;
      if (!id(fn_button).state)
        armed = true;
      return armed && id(fn_button).state;
    filters:
      - delayed_on: 10s
    on_press:
      - script.execute: fn_factory_reset
  - platform: gpio
    name: UP
    id: up_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 8
      mode:
        input: true
    on_press:
      - lambda: |-
          if (id(display_menu).is_active()) {
            id(display_menu).up();
          } else if (id(display1).get_active_page() == id(status_page)) {
            id(status_temp_scroll)--;
            id(display1).update();
          }
      - script.execute: check_blank_page
  - platform: gpio
    name: DOWN
    id: down_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 9
      mode:
        input: true
    on_press:
      - lambda: |-
          if (id(display_menu).is_active()) {
            id(display_menu).down();
          } else if (id(display1).get_active_page() == id(status_page)) {
            id(status_temp_scroll)++;
            id(display1).update();
          }
      - script.execute: check_blank_page
  - platform: gpio
    name: LEFT
    id: left_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 10
      mode:
        input: true
    on_press:
      - lambda: |-
          auto *page = id(display1).get_active_page();
          if (id(display_menu).is_active()) {
            id(display_menu).left();
          } else if (page == id(main_page) || page == id(blank_page)) {
            id(status_relay_sel) = 0;
            id(status_temp_scroll) = 0;
            id(display1).show_page(id(status_page));
          } else if (page == id(status_page) && !id(relays).empty()) {
            int n = id(relays).size();
            id(status_relay_sel) = (id(status_relay_sel) + n - 1) % n;
            id(display1).update();
          }
      - script.execute: check_blank_page
  - platform: gpio
    name: RIGHT
    id: right_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 11
      mode:
        input: true
    on_press:
      - lambda: |-
          auto *page = id(display1).get_active_page();
          if (id(display_menu).is_active()) {
            id(display_menu).right();
          } else if (page == id(main_page) || page == id(blank_page)) {
            id(display1).show_page(id(time_page));
          } else if (page == id(status_page) && !id(relays).empty()) {
            int n = id(relays).size();
            id(status_relay_sel) = (id(status_relay_sel) + 1) % n;
            id(display1).update();
          }
      - script.execute: check_blank_page
  - platform: gpio
    name: CENTER
    id: center_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 12
      mode:
        input: true
    on_press:
      - lambda: |-
          auto *page = id(display1).get_active_page();
          if (id(display_menu).is_active()) {
            id(display_menu).enter();
          } else if (page == id(main_page)) {
            id(display_menu).show_main();
          } else if (page == id(status_page)) {
            int sel = id(status_relay_sel);
            if (sel >= 0 && sel < (int) id(relays).size()) {
              // A relay a thermostat drives is the thermostat's: the press only logs whose it is.
              auto *relay = id(relays)[sel];
              const std::string holder = switch_hold::holder(relay);
              if (holder.empty()) {
                relay->toggle();
              } else {
                ESP_LOGI("status_page", "'%s' left alone: thermostat '%s' drives it", relay->get_name().c_str(),
                         holder.c_str());
              }
              id(display1).update();
            }
          }
      - script.execute: check_blank_page
  - platform: gpio
    name: HOME
    id: home_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 13
      mode:
        input: true
    on_press:
      - lambda: |-
          if (id(display1).get_active_page() != id(main_page)) {
            id(display_menu).hide();
            id(display1).show_page(id(main_page));
          }
