    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto *engine = id(automations_engine);
            // A row holds the rule's id, not a pointer: add and remove move the configs.
            auto state_of = [engine](uint32_t rule_id) {
              for (const auto &config : engine->configs().get_all_configs()) {
                if (config.id == rule_id)
                  return config.enabled ? 1 : 0;
              }
              return -1;  // removed since boot
            };
            // The value is appended to the row text and the row is clipped at the panel
            // edge, so a long name would push On / Off off the screen.
            auto fit = [](const std::string &text, size_t chars) {
              size_t i = 0;
              while (i < text.size() && chars-- > 0) {
                for (i++; i < text.size() && (static_cast<unsigned char>(text[i]) & 0xC0) == 0x80; i++) {
                }
              }
              return text.substr(0, i);
            };
            // A cut name is no longer known to be unique — two rules may start alike — so a row
            // that had to cut one carries the rule's id, the one the editor and the log use.
            auto label = [&fit](const automations::AutomationConfig &config) {
              const std::string cut = fit(config.name, 12);
              if (cut.size() == config.name.size())
                return cut;
              const std::string tag = " #" + std::to_string(config.id);
              return fit(config.name, 12 - tag.size()) + tag;
            };
            for (const auto &config : engine->configs().get_all_configs()) {
              const uint32_t rule_id = config.id;
              auto *pending = new int(-1);  // the choice being edited; -1 outside editing
              auto *row = new MenuItemCustom();
              row->set_text(label(config));
              row->set_value_lambda([=](const MenuItem *) {
                const int state = *pending >= 0 ? *pending : state_of(rule_id);
                return std::string(state < 0 ? "--" : state > 0 ? "On" : "Off");
              });
              row->add_on_enter_callback([=]() { *pending = state_of(rule_id); });
              auto flip = [=]() {
                if (*pending >= 0)
                  *pending = 1 - *pending;
              };
              row->add_on_next_callback(flip);
              row->add_on_prev_callback(flip);
              row->add_on_leave_callback([=]() {
                const int current = state_of(rule_id);
                bool persisted = false;
                // Only on a change to a rule still there: the engine rewrites the rule's file on
                // every call. A rule naming an entity that is gone is never written, so put the
                // live state back rather than leave the row promising what a reboot would undo.
                if (*pending >= 0 && current >= 0 && *pending != current &&
                    engine->set_enable_automation(rule_id, *pending > 0, &persisted) && !persisted)
                  engine->set_enable_automation(rule_id, *pending == 0);
                *pending = -1;
              });
              id(automations_menu)->add_item(row);
            }
            if (id(automations_menu)->items_size() == 0) {
              // An empty submenu cannot be entered, so the row would do nothing at all.
              auto *note = new MenuItem(MENU_ITEM_LABEL);
              note->set_text("No automations");
              id(automations_menu)->add_item(note);
            }
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            static constexpr size_t ROW = 18;  // f7x14_mod2 glyphs across the panel
            auto *hub = id(climates);
            // Rows hold the thermostat's id, not a pointer: the store moves its documents. One
            // deleted since boot is not found, and its rows say --.
            auto reading = [hub](const std::string &thermostat_id) {
              const auto *config = hub->store().get(thermostat_id);
              const float value = config != nullptr ? hub->sensor_reading(config->sensor_id) : NAN;
              return std::isnan(value) ? std::string("--") : str_sprintf("%.1f°C", value);
            };
            auto glyphs = [](const std::string &text) -> size_t {
              return std::count_if(text.begin(), text.end(),
                                   [](char c) { return (static_cast<unsigned char>(c) & 0xC0) != 0x80; });
            };
            for (const auto &doc : hub->store().all()) {
              const std::string thermostat_id = doc->id;
              const std::string boot_name = doc->name;
              auto *menu = new MenuItemMenu();
              // Names are ASCII; the name gives way so the reading stays on the panel.
              menu->set_text([=](const MenuItem *) {
                const auto *config = hub->store().get(thermostat_id);
                const std::string value = reading(thermostat_id);
                const std::string &name = config != nullptr ? config->name : boot_name;
                std::string cut = name.substr(0, ROW - 2 - glyphs(value));
                while (!cut.empty() && cut.back() == ' ')
                  cut.pop_back();  // a cut between words would leave "Floor heating : --"
                return cut + ": " + value;
              });

              // The list row cuts the name to make room for the reading, so "Floor heating 1" and
              // "Floor heating 2" look alike there; this says which one is open.
              auto *title = new MenuItem(MENU_ITEM_LABEL);
              title->set_text([=](const MenuItem *) {
                const auto *config = hub->store().get(thermostat_id);
                return (config != nullptr ? config->name : boot_name).substr(0, ROW);
              });
              menu->add_item(title);

              auto *current = new MenuItem(MENU_ITEM_LABEL);
              current->set_text([=](const MenuItem *) { return "Current: " + reading(thermostat_id); });
              menu->add_item(current);

              // The dashboard's badge, with a fault in place of the Off it forces. Mode off shows
              // Off even with a fault: the mode, not the fault, holds the relays open then.
              auto doing_of = [=]() -> const char * {
                using climate_hub::HubAction;
                using climate_hub::HubFault;
                using climate_hub::HubMode;
                const auto *config = hub->store().get(thermostat_id);
                if (config == nullptr)
                  return "--";
                if (!config->enabled)
                  return "Disabled";
                const auto *runtime = hub->runtime(thermostat_id);
                if (runtime == nullptr)
                  return "Waiting";
                if (config->mode == HubMode::OFF)
                  return "Off";
                switch (runtime->fault()) {
                  case HubFault::SENSOR_STALE:
                    return "No reading";
                  case HubFault::OVERTEMP:
                    return "Overheat";
                  case HubFault::RELAY_CONTESTED:  // control goes on: show what it does
                  case HubFault::NONE:
                    break;
                }
                switch (runtime->action()) {
                  case HubAction::HEATING:
                    return "Heating";
                  case HubAction::COOLING:
                    return "Cooling";
                  case HubAction::IDLE:
                    return "Idle";
                  case HubAction::OFF:
                    break;
                }
                return "Off";
              };
              auto *doing = new MenuItem(MENU_ITEM_LABEL);
              doing->set_text([=](const MenuItem *) { return std::string("State: ") + doing_of(); });
              menu->add_item(doing);

              // Counted in steps from the target the row opened on, so the steps add no float
              // error, and written only when they moved it: an untouched row never puts that
              // target back over one Home Assistant or the dashboard set meanwhile.
              auto *opened = new float(NAN);  // NaN outside editing
              auto *steps = new int(0);
              auto stepped = [=]() -> float {
                const auto *config = hub->store().get(thermostat_id);
                if (config == nullptr)
                  return NAN;
                if (std::isnan(*opened))
                  return config->setpoint;
                const auto &visual = config->visual;
                return std::clamp(*opened + *steps * visual.step, visual.min_temperature, visual.max_temperature);
              };
              auto *target = new MenuItemCustom();
              target->set_text(std::string("Target"));
              target->set_value_lambda([=](const MenuItem *) {
                const float value = stepped();
                return std::isnan(value) ? std::string("--") : str_sprintf("%.1f°C", value);
              });
              target->add_on_enter_callback([=]() {
                const auto *config = hub->store().get(thermostat_id);
                *opened = config != nullptr ? config->setpoint : NAN;
                *steps = 0;
              });
              // The margin keeps a float a hair inside a limit from taking a press that shows nothing.
              target->add_on_next_callback([=]() {
                const auto *config = hub->store().get(thermostat_id);
                if (config != nullptr && !std::isnan(*opened) &&
                    stepped() < config->visual.max_temperature - config->visual.step / 1000)
                  (*steps)++;
              });
              target->add_on_prev_callback([=]() {
                const auto *config = hub->store().get(thermostat_id);
                if (config != nullptr && !std::isnan(*opened) &&
                    stepped() > config->visual.min_temperature + config->visual.step / 1000)
                  (*steps)--;
              });
              target->add_on_leave_callback([=]() {
                const float value = stepped();
                if (*steps != 0 && !std::isnan(value) && value != *opened) {
                  const auto result = hub->set_setpoint(thermostat_id, value);
                  if (!result.ok)
                    ESP_LOGW("menu", "Thermostat '%s' target: %s", thermostat_id.c_str(), result.error.c_str());
                }
                *opened = NAN;
                *steps = 0;
              });
              menu->add_item(target);

              auto enabled_of = [=]() {
                const auto *config = hub->store().get(thermostat_id);
                return config == nullptr ? -1 : config->enabled ? 1 : 0;
              };
              auto *was = new int(-1);      // the flag the row opened on; -1 outside editing
              auto *pending = new int(-1);  // the choice being edited
              auto *enabled = new MenuItemCustom();
              enabled->set_text(std::string("Enabled"));
              enabled->set_value_lambda([=](const MenuItem *) {
                const int live = enabled_of();
                const int state = live < 0 ? -1 : *pending >= 0 ? *pending : live;
                return std::string(state < 0 ? "--" : state > 0 ? "On" : "Off");
              });
              enabled->add_on_enter_callback([=]() { *was = *pending = enabled_of(); });
              auto flip = [=]() {
                if (*pending >= 0)
                  *pending = 1 - *pending;
              };
              enabled->add_on_next_callback(flip);
              enabled->add_on_prev_callback(flip);
              // Never a take-over: the panel does not stop another thermostat to free a relay. A
              // refused On leaves the row at Off, and the log says why.
              enabled->add_on_leave_callback([=]() {
                if (*pending >= 0 && *pending != *was && enabled_of() >= 0) {
                  const auto result = hub->set_enabled(thermostat_id, *pending > 0);
                  if (!result.ok) {
                    ESP_LOGW("menu", "Thermostat '%s' not %s: %s", thermostat_id.c_str(),
                             *pending > 0 ? "enabled" : "disabled", result.error.c_str());
                  } else if (!result.persisted) {
                    ESP_LOGW("menu", "Thermostat '%s' changed but not saved; a reboot undoes it",
                             thermostat_id.c_str());
                  }
                }
                *was = *pending = -1;
              });
              menu->add_item(enabled);
              id(thermostats_menu)->add_item(menu);
            }
            if (id(thermostats_menu)->items_size() == 0) {
              // An empty submenu cannot be entered, so the row would do nothing at all.
              auto *note = new MenuItem(MENU_ITEM_LABEL);
              note->set_text("No thermostats");
              id(thermostats_menu)->add_item(note);
            }
