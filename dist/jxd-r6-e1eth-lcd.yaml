                address->set_text(str_sprintf("0x%016" PRIx64, rom));
                menu->add_item(address);
              }
              if (!scan->pinned(slot)) {
                // Edited like the settings rows: CENTER opens it, LEFT / RIGHT step by 0.1 up to
                // ±5.0, CENTER or BACK saves it. A save that fails leaves the stored offset shown.
                const int limit = std::lround(dallas_scan::DallasScan::MAX_OFFSET * 10);
                auto stored = [scan, slot]() { return static_cast<int>(std::lround(scan->offset(slot) * 10)); };
                auto *pending = new optional<int>();  // tenths of a degree, while editing
                auto *offset = new MenuItemCustom();
                offset->set_text(std::string("Offset"));
                offset->set_value_lambda([=](const MenuItem *) {
                  const int tenths = pending->value_or(stored());
