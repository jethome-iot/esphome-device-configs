esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: "id(relays) = {id(relay_1), id(relay_2), id(relay_3),\n        \
            \      id(relay_4), id(relay_5), id(relay_6)};\nid(inputs) = {id(input_1),\
            \ id(input_2), id(input_3),\n              id(input_4), id(input_5), id(input_6)};"
    - priority: 700
      then:
        - lambda: 'id(modbus_server1).set_address((uint8_t) id(modbus_address).state);

            auto *bus = id(jxm_uart2);

            bus->set_baud_rate(parse_number<uint32_t>(id(modbus_baud_rate).current_option().c_str()).value_or(9600));

            bus->set_stop_bits(parse_number<uint8_t>(id(modbus_stop_bits).current_option().c_str()).value_or(1));

            bus->set_parity((uart::UARTParityOptions) id(modbus_parity).active_index().value_or(0));

            bus->load_settings(false);'
    - priority: 600
      then:
        - script.execute: set_wifi_ap
    - priority: 200
      then:
        - script.execute: apply_network_mode
        - globals.set:
            id: network_mode_applied
            value: 'true'
    - priority: 500
      then:
        - lambda: "using namespace display_menu_base;\nauto *scan = id(temps);\nfor\
            \ (size_t slot = 0; slot < scan->used_slots(); slot++) {\n  const std::string\
            \ name = scan->slot_name(slot);\n  auto format = [name](float value) {\n\
            \    return std::isnan(value) ? name + \": --\" : str_sprintf(\"%s: %.1f°C\"\
            , name.c_str(), value);\n  };\n\n  // The row shows the reading and opens\
            \ the slot: reading, address, and\n  // forget where it changes anything.\
            \ A freed slot between sensors keeps\n  // its row and only says that\
            \ it is free.\n  auto *menu = new MenuItemMenu();\n  menu->set_text(format(scan->temperature(slot)));\
            \  // a listed sensor may have a state already\n  auto *sensor = scan->sensor(slot);\n\
            \  if (sensor == nullptr) {\n    auto *note = new MenuItem(MENU_ITEM_LABEL);\n\
            \    note->set_text(\"Free slot\");\n    menu->add_item(note);\n    id(temperatures_menu)->add_item(menu);\n\
            \    continue;\n  }\n  auto *reading = new MenuItem(MENU_ITEM_LABEL);\n\
            \  reading->set_text(format(sensor->state));\n  sensor->add_on_state_callback([menu,\
            \ reading, format](float value) {\n    menu->set_text(format(value));\n\
            \    reading->set_text(format(value));\n  });\n  menu->add_item(reading);\n\
            \  if (const uint64_t rom = scan->address(slot); rom != 0) {\n    auto\
            \ *address = new MenuItem(MENU_ITEM_LABEL);\n    address->set_text(str_sprintf(\"\
            0x%016\" PRIx64, rom));\n    menu->add_item(address);\n  }\n  if (!scan->pinned(slot))\
            \ {\n    auto *question = new MenuItem(MENU_ITEM_LABEL);\n    question->set_text(\"\
            Forget slot?\");\n    menu->add_item(question);\n    auto *confirm = new\
            \ MenuItemCommand();\n    confirm->set_text(\"Confirm\");\n    confirm->add_on_value_callback([confirm,\
            \ slot]() {\n      confirm->set_text(\"Confirm - OK\");\n      id(forget_temperatures)->execute(slot);\n\
            \    });\n    menu->add_item(confirm);\n  }\n  id(temperatures_menu)->add_item(menu);\n\
            }"
    - priority: 600
      then:
        - delay: 200ms
        - script.execute: setup_time
  name: ${name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  project:
    name: JetHome.JXD-R6-E1ETH-LCD
    version: ${version}
