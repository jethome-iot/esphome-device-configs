network:
  priority:
    - ethernet
    - wifi
ethernet:
  id: ethernet_id
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_OUT
    pin: 17
  phy_addr: 1
  power_pin: GPIO15
  on_connect:
    - component.update: ip
  on_disconnect:
    - component.update: ip
wifi:
  id: wifi_id
  enable_on_boot: false
  reboot_timeout: 0s
  ap: null
  on_connect:
    - component.update: ip
  on_disconnect:
    - component.update: ip
captive_portal:
  id: captive_portal_id
interval:
  - interval: 2s
    then:
      - lambda: |-
          const bool ap = id(wifi_id).is_ap_active();
          if (ap != id(ap_was_active)) {
            id(ap_was_active) = ap;
            id(ip).update();
          }
script:
  - id: set_wifi_ap
    then:
      - lambda: |-
          uint8_t mac[6];
          get_mac_address_raw(mac);
          wifi::WiFiAP ap;
          ap.set_ssid("${friendly_name}-" + str_snprintf("%02X%02X", 4, mac[4], mac[5]));
          ap.set_password(str_snprintf("%02x%02x%02x%02x", 8, mac[2], mac[3], mac[4], mac[5]));
          id(wifi_id).set_ap(ap);
  - id: apply_network_mode
    then:
      - lambda: |-
          // Option index: 0 Auto, 1 Ethernet, 2 WiFi.
          const size_t mode = id(network_mode).active_index().value_or(0);
          if (mode == 2) {
            id(ethernet_id).disable();
          } else {
            id(ethernet_id).enable();
          }
          if (mode == 1) {
            id(wifi_id).disable();
          } else {
            id(wifi_id).enable();
          }
      - component.update: ip
  - id: reset_wifi
    then:
      - logger.log: Reset WiFi creds
      - lambda: |-
          // Both keys WiFiComponent::start can pick, the literal being its own.
          constexpr uint32_t WIFI_PREF_KEY_NO_COMPILED_NETWORK = 88491487;
          const uint32_t keys[] = {WIFI_PREF_KEY_NO_COMPILED_NETWORK, App.get_config_version_hash()};
          uint8_t cleared = 0;
          bool ok = true;
          for (uint32_t key : keys) {
            auto pref = global_preferences->make_preference(sizeof(cleared), key);
            ok = pref.save(&cleared) && ok;
          }
          ok = global_preferences->sync() && ok;
          if (!ok) {
            ESP_LOGE("reset_wifi", "Clearing the WiFi credentials failed");
          }
          id(wifi_id).clear_sta();
          // Restarting the radio is what raises the AP; in Ethernet mode there is none to raise.
          if (!id(wifi_id).is_disabled()) {
            id(wifi_id).disable();
            id(wifi_id).enable();
          }
  - id: setup_time
    then:
      - lambda: |-
          const auto &tz = id(stored_timezone);
          if (tz.std_offset_seconds != 0 || tz.has_dst()) {
            esphome::time::set_global_tz(tz);
          }
      - pcf8563.read_time:
          id: pcf8563_time
  - id: forget_temperatures
    parameters:
      slot: int
    then:
      - delay: 1s
      - lambda: id(temps)->forget(slot);
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - pcf8563.write_time: null
        - delay: 1s
        - lambda: id(stored_timezone) = esphome::time::get_global_tz();
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        pcf8563.write_time: null
  - platform: pcf8563
    id: pcf8563_time
    address: 81
    timezone: ${timezone}
    update_interval: 15min
littlefs_storage:
  id: user_storage
  partition_label: littlefs
  partition_size: 4MB
  base_path: /littlefs
config_json:
