esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            id(relays) = {id(relay_1), id(relay_2), id(relay_3),
                          id(relay_4), id(relay_5), id(relay_6)};
            id(inputs) = {id(input_1), id(input_2), id(input_3),
                          id(input_4), id(input_5), id(input_6)};
    - priority: 700
      then:
        - lambda: |-
            id(modbus_server1).set_address((uint8_t) id(modbus_address).state);
            auto *bus = id(jxm_uart2);
            bus->set_baud_rate(parse_number<uint32_t>(id(modbus_baud_rate).current_option().c_str()).value_or(9600));
            bus->set_stop_bits(parse_number<uint8_t>(id(modbus_stop_bits).current_option().c_str()).value_or(1));
            bus->set_parity((uart::UARTParityOptions) id(modbus_parity).active_index().value_or(0));
            bus->load_settings(false);
    - priority: 600
      then:
        - script.execute: set_wifi_ap
    - priority: 200
      then:
        - script.execute: apply_network_mode
        - globals.set:
            id: network_mode_applied
            value: 'true'
    - priority: 600
