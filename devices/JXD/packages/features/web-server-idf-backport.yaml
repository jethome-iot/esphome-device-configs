# Shadows the built-in web_server_idf with components/web_server_idf, which raises the httpd
# task's stack to 8192 bytes (issue #64) and carries upstream ESPHome PR #17800 ahead of its
# release (issue #70). scripts/vendored-diff.py prints the whole patch; what a bump keeps is in
# that component's README.
external_components:
  - source: ${components}
    components: [web_server_idf]
