# Firmware updates from fw.jethome.com: the device polls the manifest of its own
# slug there and installs the esp.ota image of the selected channel.
external_components:
  - source: ${components}
    components: [jethome_manifest, jethome_update]

http_request:
  useragent: JetHome
  # The manifest is small, but a busy uplink makes 4.5s a tight read.
  timeout: 10s

ota:
  # Named so display/firmware-page.yaml can hang the install screen off it.
  - platform: http_request
    id: firmware_ota

update:
  - platform: jethome_update
    id: firmware_update
    name: Firmware update
    source: https://fw.jethome.com/api/devices/${fw_device}/info
    channel: release

select:
  - platform: template
    id: firmware_channel
    name: Firmware channel
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: release
    options: [release, nightly]
    on_value:
      # Switching drops what the old channel offered and asks the new one, unless an install
      # is under way; offline the check does nothing.
      - lambda: id(firmware_update).set_channel(x);

button:
  - platform: template
    id: check_firmware_button
    name: Check for updates
    icon: mdi:cloud-refresh
    entity_category: config
    on_press:
      - lambda: id(firmware_update).check();
