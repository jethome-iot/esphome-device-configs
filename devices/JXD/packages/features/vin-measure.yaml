sensor:
  - platform: adc
    name: "VIN voltage"
    id: vin_meas
    pin: GPIO35
    attenuation: 2.5dB
    accuracy_decimals: 2
    entity_category: diagnostic
    internal: true
    update_interval: 100ms
    filters:
      - multiply: 32.0
      - median:
          window_size: 20
          send_every: 20
          send_first_at: 10
      - clamp:
          min_value: 0
      - lambda: |-
          if (x <= 2.8) return 0;
          return x;

  - platform: adc
    name: "PoE voltage"
    id: poe_voltage
    pin: GPIO37
    attenuation: 2.5dB
    accuracy_decimals: 2
    entity_category: diagnostic
    internal: true
    update_interval: 100ms
    filters:
      - multiply: 32.0
      - median:
          window_size: 20
          send_every: 20
          send_first_at: 10
      - clamp:
          min_value: 0
      - lambda: |-
          if (x <= 2.8) return 0;
          return x;

  # The name the previous firmware gave it, so the Home Assistant entity keeps its id.
  - platform: template
    name: "Input voltage"
    id: input_voltage
    web_server:
      sorting_group_id: group_system
      sorting_weight: 2
    entity_category: diagnostic
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 1
    # The readings it picks from change every 2 s (median of 20 samples at 100 ms).
    update_interval: 2s
    lambda: |-
      return std::max(id(vin_meas).state, id(poe_voltage).state);
