# Copies the panic record ESPHome's crash handler leaves in .noinit onto the user partition at
# the next boot, so a device that panicked in the field can hand the report back over /files.
# Prototype for issue #63; not part of the shipped device config.
external_components:
  - source: ${components}
    components: [crash_report]

crash_report:
  storage: user_storage
