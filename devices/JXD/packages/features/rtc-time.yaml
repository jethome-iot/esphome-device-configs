# In effect until Home Assistant reports its own or one is chosen on the dashboard. IANA names
# and POSIX TZ strings both work: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
substitutions:
  timezone: UTC

external_components:
  - source: ${components}
    components: [ntp_servers, timezone_settings]

# Home Assistant's zone is global but RAM-only; keep it across reboots.
globals:
  - id: stored_timezone
    type: esphome::time::ParsedTimezone
    restore_value: true

# Which zone is in effect: Home Assistant's, the compiled one, or one chosen on the dashboard.
timezone_settings:
  id: device_timezone
  timezone: ${timezone}
  homeassistant_zone: stored_timezone
  clocks:
    homeassistant: homeassistant_time
    sntp: sntp_time
    rtc: pcf8563_time
  # Set on the dashboard: into the RTC too, or its next read would put the old time back.
  on_clock_set:
    then:
      pcf8563.write_time:

# Servers set on the dashboard, asked ahead of sntp_time's own.
ntp_servers:
  id: device_ntp
  sntp_id: sntp_time

time:
  # No timezone here: that is what makes Home Assistant send its own.
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        pcf8563.write_time:

  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        pcf8563.write_time:

  - platform: pcf8563
    id: pcf8563_time
    address: 0x51
    timezone: ${timezone}
    update_interval: 15min

script:
  - id: setup_time
    then:
      - pcf8563.read_time:
          id: pcf8563_time
