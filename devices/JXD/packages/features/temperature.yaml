# One Temp N sensor per DS18B20 found at boot. A new sensor takes the lowest free
# slot in bus order and the slot then keeps its ROM address across reboots; slots:
# pins a slot or hands it to a YAML sensor. Details: doc/ONEWIRE_WORKFLOW.md
external_components:
  - source: ${components}
    components: [dallas_scan]

dallas_scan:
  id: temps
  one_wire_id: one_wire_bus
  max_sensors: 16
  update_interval: 20s
  web_server:
    sorting_group_id: group_temperature
    sorting_weight: 1

script:
  # slot: 0-based, or -1 for all
  - id: forget_temperatures
    parameters:
      slot: int
    then:
      - delay: 1s
      - lambda: 'id(temps)->forget(slot);'
