esp32:
  board: esp32dev
  flash_size: 16MB
  flash_frequency: 80MHz
  watchdog_timeout: 60s
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_COMPILER_OPTIMIZATION_SPEED: y
      CONFIG_D0WD_PSRAM_CLK_IO: "6"
      # ESP-IDF's default of one drops all but the first SNTP server rtc-time.yaml lists.
      CONFIG_LWIP_SNTP_MAX_SERVERS: "3"

psram:
  mode: quad
  speed: 80MHz

api:
  id: api_server
  encryption:
  reboot_timeout: 0s

# Until Home Assistant has set the API key, whoever connects first can control the device and
# write a key of their own: that stays possible for 15 minutes after a boot, then not until the
# next one.
provisioning:
  timeout: 15min
  # Upstream only asks the clients to leave: one that stays would keep control past the window.
  # ESPHome's own OTA, if opened in the window, closes with it.
  on_timeout:
    - script.execute:
        id: drop_api_clients
        reason: Window expired
    - switch.turn_off: esphome_ota_allowed

script:
  # Every API client goes, whatever state it is in; Home Assistant comes back with its key.
  - id: drop_api_clients
    parameters:
      reason: string
    then:
      - lambda: |-
          #ifdef USE_API
          unsigned dropped = 0;
          for (auto &client : id(api_server)->active_clients()) {
            if (!client->is_marked_for_removal()) {
              client->on_fatal_error();
              dropped++;
            }
          }
          if (dropped > 0)
            ESP_LOGW("api", "%s: dropped %u client(s)", reason.c_str(), dropped);
          #endif

esphome:
  on_boot:
    # A device that already has its key counts as added even before the network is up: upstream
    # would close the window on it after a long outage and turn even that key away until a reboot.
    - priority: -100
      then:
        - lambda: |-
            #if defined(USE_PROVISIONING) && defined(USE_API_NOISE)
            auto *manager = provisioning::global_provisioning_manager;
            if (manager != nullptr && id(api_server)->get_noise_ctx().has_psk())
              manager->set_source_provisioned(0, true);  // the network source
            #endif
  on_loop:
    - lambda: |-
        #if defined(USE_PROVISIONING) && defined(USE_API_NOISE)
        // The manager stops for good once the device is added. A key cleared later leaves it
        // unprovisioned at once, 100 ms before the server stops taking the old key, so its check
        // runs here, in this pass: past the window it closes before a keyless client can get in.
        auto *manager = provisioning::global_provisioning_manager;
        if (manager != nullptr && !manager->closed() && !manager->is_provisioned()) {
          // Its check reads a 32-bit clock, which reads as early again past 49.7 days of uptime.
          if (millis_64() > UINT32_MAX)
            manager->set_timeout(1);
          manager->loop();
        }
        // Checked every loop, so the change is seen before Home Assistant is back with the key.
        auto *api = id(api_server);
        noise::psk_t key;
        api->get_noise_ctx().load_psk(key);
        static noise::psk_t last = key;
        if (key != last) {
          // A key set, cleared or replaced only asks the clients to leave: one that stays keeps
          // the session it had.
          last = key;
          id(drop_api_clients).execute(api->get_noise_ctx().has_psk() ? "Key set" : "Key cleared");
          // ESPHome's own OTA, opened before the change, closes as well.
          id(esphome_ota_allowed).turn_off();
        }
        #endif

ota:
  # Takes plaintext uploads from anyone even once Home Assistant has set the API key, so it
  # stays locked unless esphome_ota_allowed is on.
  - platform: esphome
    id: esphome_ota
    # Builds the password check in, for the switch to set at run time.
    password: ""
  - platform: web_server

switch:
  - platform: template
    id: esphome_ota_allowed
    name: Allow uploads from ESPHome
    icon: mdi:upload-lock
    entity_category: config
    web_server:
      sorting_group_id: group_system
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(esphome_ota).set_auth_password("");
      # Another turn-on restarts the delay, a turn-off cancels it.
      - delay: 30min
      - switch.turn_off: esphome_ota_allowed
    turn_off_action:
      # A password nobody knows. An upload encrypted with the API key never asks for it.
      - lambda: |-
          uint8_t lock[16];
          random_bytes(lock, sizeof(lock));
          char hex[sizeof(lock) * 2 + 1];
          format_hex_to(hex, lock, sizeof(lock));
          id(esphome_ota).set_auth_password(hex);

preferences:
  flash_write_interval: 5s

external_components:
  - source: ${components}
    components: [i2c_eeprom, jethome_board_info, status_indicator]

i2c_eeprom:
  - id: eeprom_cpu
    size: 64KB
    address: 0x54

# The board's identity, as the factory wrote it.
jethome_board_info:
  id: board_info
  eeprom_id: eeprom_cpu

logger:
  level: debug

web_server:
  port: 80
  version: 3
  # No local: true. web_device_dashboard owns /, so the page it would embed is never served.
  sorting_groups:
    - id: group_relays
      name: "Relays"
      sorting_weight: 10
    - id: group_inputs
      name: "Inputs"
      sorting_weight: 20
    - id: group_temperature
      name: "Temperature"
      sorting_weight: 30
    - id: group_climate
      name: "Climate"
      sorting_weight: 35
    - id: group_modbus
      name: "Modbus"
      sorting_weight: 40
    - id: group_network
      name: "Network"
      sorting_weight: 50
    - id: group_system
      name: "System"
      sorting_weight: 60

sensor:
  - platform: tmp102
    name: "PCB Temp"
    id: pcb_temp
    web_server:
      sorting_group_id: group_system
      sorting_weight: 1
    update_interval: 20s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    name: "FN"
    id: fn_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
      # The board's boot button: GPIO0 is strapping by design.
      ignore_strapping_warning: true

# The bi-colour LED: green while the pin is low, red while it is high.
status_indicator:
  id: red_led
  pin:
    number: GPIO2
    # Wired this way by the board's design, like GPIO0.
    ignore_strapping_warning: true

text_sensor:
  - platform: uptime
    name: Uptime
    id: uptime_sensor
    internal: true
    format:
      separator: " "
