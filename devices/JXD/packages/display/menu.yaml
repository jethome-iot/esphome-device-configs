                    - delay: 1s
                    - script.execute:
                        id: forget_temperatures
                        slot: 3

            - type: menu
              text: "Temp5"
              items:
                - type: label
                  text: !lambda |-
                    uint64_t a = id(dallas_slots)[4];
                    return a ? str_sprintf("0x%016" PRIx64, a) : std::string("empty");

                - type: label
