graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  on_redraw:
    then:
      - component.update: display1
  items:
    # The settings rows of each Relay N / Input N are added at boot (esphome: on_boot below).
    - type: menu
      text: "Relays"
      id: relays_menu
      items:
        - type: menu
          text: !lambda 'return id(relay_1).state ? "Relay 1 (On)" : "Relay 1 (Off)";'
          items:
            - type: switch
              text: "State"
              switch: relay_1
              immediate_edit: true

        - type: menu
          text: !lambda 'return id(relay_2).state ? "Relay 2 (On)" : "Relay 2 (Off)";'
          items:
            - type: switch
              text: "State"
              switch: relay_2
              immediate_edit: true

        - type: menu
          text: !lambda 'return id(relay_3).state ? "Relay 3 (On)" : "Relay 3 (Off)";'
          items:
            - type: switch
              text: "State"
              switch: relay_3
              immediate_edit: true

        - type: menu
          text: !lambda 'return id(relay_4).state ? "Relay 4 (On)" : "Relay 4 (Off)";'
          items:
            - type: switch
              text: "State"
              switch: relay_4
              immediate_edit: true

        - type: menu
          text: !lambda 'return id(relay_5).state ? "Relay 5 (On)" : "Relay 5 (Off)";'
          items:
            - type: switch
              text: "State"
              switch: relay_5
              immediate_edit: true

        - type: menu
          text: !lambda 'return id(relay_6).state ? "Relay 6 (On)" : "Relay 6 (Off)";'
          items:
            - type: switch
              text: "State"
              switch: relay_6
              immediate_edit: true

    - type: menu
      text: "Inputs"
      id: inputs_menu
      items:
        - type: menu
          text: !lambda 'return id(input_1).state ? "Input 1 (On)" : "Input 1 (Off)";'
          items:
            - type: label
              text: !lambda 'return id(input_1).state ? "State (On)" : "State (Off)";'

        - type: menu
          text: !lambda 'return id(input_2).state ? "Input 2 (On)" : "Input 2 (Off)";'
          items:
            - type: label
              text: !lambda 'return id(input_2).state ? "State (On)" : "State (Off)";'

        - type: menu
          text: !lambda 'return id(input_3).state ? "Input 3 (On)" : "Input 3 (Off)";'
          items:
            - type: label
              text: !lambda 'return id(input_3).state ? "State (On)" : "State (Off)";'

        - type: menu
          text: !lambda 'return id(input_4).state ? "Input 4 (On)" : "Input 4 (Off)";'
          items:
            - type: label
              text: !lambda 'return id(input_4).state ? "State (On)" : "State (Off)";'

        - type: menu
          text: !lambda 'return id(input_5).state ? "Input 5 (On)" : "Input 5 (Off)";'
          items:
            - type: label
              text: !lambda 'return id(input_5).state ? "State (On)" : "State (Off)";'

        - type: menu
          text: !lambda 'return id(input_6).state ? "Input 6 (On)" : "Input 6 (Off)";'
          items:
            - type: label
              text: !lambda 'return id(input_6).state ? "State (On)" : "State (Off)";'

    # A Temp N submenu per slot up to the last bound one is added at boot (esphome:
    # on_boot below); a freed slot's submenu only says Free slot.
    - type: menu
      text: "Temperatures"
      id: temperatures_menu
      items:
        - type: label
          text: !lambda |-
            auto *s = id(pcb_temp);
            if (std::isnan(s->state))
              return str_sprintf("%s: --", s->get_name().c_str());
            return str_sprintf("%s: %.1f°C", s->get_name().c_str(), s->state);

    - type: menu
      text: "Info"
      id: info_submenu
      items:

    - type: menu
      text: "Settings"
      id: menu_settings_id
      items:
        - type: select
          text: "Display off"
          select: display_off_timer_select

        - type: menu
          text: "Modbus"
          items:
            - type: label
              text: "Applied on reboot"

            - type: number
              text: "Address"
              number: modbus_address
              format: "%.0f"

            - type: select
              text: "Baud rate"
              select: modbus_baud_rate

            - type: select
              text: "Parity"
              select: modbus_parity

            - type: select
              text: "Stop bits"
              select: modbus_stop_bits

        - type: menu
          text: "Temp sensors"
          items:
            - type: label
              text: "Forget all?"

            - type: command
              text: "Confirm"
              id: forget_temps_yes
              on_value:
                - lambda: 'id(forget_temps_yes)->set_text("Confirm - OK");'
                - script.execute:
                    id: forget_temperatures
                    slot: -1

        - type: menu
          text: "Factory reset"
          items:
            - type: label
              text: "Factory reset?"

            - type: command
              text: "Confirm"
              id: factory_reset_yes
              on_value:
                - lambda: 'id(factory_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - lambda: |-
                    // Rules and uploaded files live on the partition, not in preferences, and
                    // the partition is wiped on the way back up: formatting it here would take
                    // the filesystem from under the file API mid-request. After the preferences
                    // erase, which takes the whole NVS partition and the record with it.
                    global_preferences->reset();
                    if (!id(user_storage)->request_format()) {
                      ESP_LOGE("factory_reset", "Wiping the user partition failed");
                    }
                    App.safe_reboot();

        - type: command
          text: "Reboot device"
          on_value:
            - lambda: 'App.safe_reboot();'

esphome:
  on_boot:
    # After the board has filled `relays` / `inputs` (800): the Nth submenu belongs to the Nth
    # entity. A row is opened with CENTER, stepped with LEFT / RIGHT and closed with CENTER or
    # BACK; the choice is applied when it closes.
    - priority: 700
      then:
        - lambda: |-
            using namespace display_menu_base;
            using Field = entity_config::SwitchSettingsJson::Field;
            auto add_row = [](MenuItemMenu *menu, const char *text, std::function<size_t()> count,
                              std::function<std::string(int)> label, std::function<int()> index,
                              std::function<void(size_t)> set) {
              auto *pending = new int(-1);  // the choice being edited; -1 outside editing
              auto *row = new MenuItemCustom();
              row->set_text(std::string(text));
              row->set_value_lambda([=](const MenuItem *) { return label(*pending >= 0 ? *pending : index()); });
              row->add_on_enter_callback([=]() { *pending = index(); });
              row->add_on_next_callback([=]() { *pending = (*pending + 1) % static_cast<int>(count()); });
              row->add_on_prev_callback([=]() {
                const int n = count();
                *pending = *pending < 0 ? n - 1 : (*pending + n - 1) % n;
              });
              row->add_on_leave_callback([=]() {
                if (*pending >= 0 && *pending != index())
                  set(*pending);
                *pending = -1;
              });
              menu->add_item(row);
            };
            auto submenu = [](MenuItemMenu *parent, size_t i) -> MenuItemMenu * {
              if (i >= parent->items_size() || parent->get_item(i)->get_type() != MENU_ITEM_MENU)
                return nullptr;
              return static_cast<MenuItemMenu *>(parent->get_item(i));
            };

            auto *sws = id(switch_settings);
            for (size_t i = 0; i < id(relays).size(); i++) {
              auto *sw = id(relays)[i];
              auto *menu = submenu(id(relays_menu), i);
              if (menu == nullptr)
                break;
              auto field_row = [&](const char *text, Field field) {
                add_row(menu, text, [sws, field]() { return sws->option_count(field); },
                        [sws, sw, field](int index) { return sws->option_label(sw, field, index); },
                        [sws, sw, field]() { return sws->option_index(sw, field); },
                        [sws, sw, field](size_t index) { sws->set_option(sw, field, index); });
              };
              field_row("Inverted", Field::INVERTED);
              field_row("Start mode", Field::RESTORE_MODE);
              field_row("Bind to", Field::BINDING_INPUT);
              field_row("Binding", Field::BINDING_MODE);
            }

            auto *bss = id(binary_sensor_settings);
            for (size_t i = 0; i < id(inputs).size(); i++) {
              auto *input = id(inputs)[i];
              auto *menu = submenu(id(inputs_menu), i);
              if (menu == nullptr)
                break;
              add_row(menu, "Inverted", []() { return 2; },
                      [](int index) { return index == 1 ? "Yes" : "No"; },
                      [bss, input]() { return bss->is_inverted(input) ? 1 : 0; },
                      [bss, input](size_t index) { bss->set_inverted(input, index == 1); });
            }

    # After dallas_scan (600) has created the sensors.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto *scan = id(temps);
            for (size_t slot = 0; slot < scan->used_slots(); slot++) {
              const std::string name = scan->slot_name(slot);
              auto format = [name](float value) {
                return std::isnan(value) ? name + ": --" : str_sprintf("%s: %.1f°C", name.c_str(), value);
              };

              // The row shows the reading and opens the slot: reading, address, and
              // forget where it changes anything. A freed slot between sensors keeps
              // its row and only says that it is free.
              auto *menu = new MenuItemMenu();
              menu->set_text(format(scan->temperature(slot)));  // a listed sensor may have a state already
              auto *sensor = scan->sensor(slot);
              if (sensor == nullptr) {
                auto *note = new MenuItem(MENU_ITEM_LABEL);
                note->set_text("Free slot");
                menu->add_item(note);
                id(temperatures_menu)->add_item(menu);
                continue;
              }
              auto *reading = new MenuItem(MENU_ITEM_LABEL);
              reading->set_text(format(sensor->state));
              sensor->add_on_state_callback([menu, reading, format](float value) {
                menu->set_text(format(value));
                reading->set_text(format(value));
              });
              menu->add_item(reading);
              if (const uint64_t rom = scan->address(slot); rom != 0) {
                auto *address = new MenuItem(MENU_ITEM_LABEL);
                address->set_text(str_sprintf("0x%016" PRIx64, rom));
                menu->add_item(address);
              }
              if (!scan->pinned(slot)) {
                auto *question = new MenuItem(MENU_ITEM_LABEL);
                question->set_text("Forget slot?");
                menu->add_item(question);
                auto *confirm = new MenuItemCommand();
                confirm->set_text("Confirm");
                confirm->add_on_value_callback([confirm, slot]() {
                  confirm->set_text("Confirm - OK");
                  id(forget_temperatures)->execute(slot);
                });
                menu->add_item(confirm);
              }
              id(temperatures_menu)->add_item(menu);
            }
