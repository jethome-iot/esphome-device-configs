external_components:
  - source: ${components}
    components: [display_menu_base, graphical_display_menu]

graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  # The highlight spans the row, and RIGHT no longer opens a submenu: it is the
  # value key, ENTER is the one that descends.
  fill_row: true
  right_for_menu_enter: false
  on_redraw:
    then:
      - component.update: display1
  items:
    # A Relay N / Input N submenu per entry of the relays / inputs vectors is added at
    # boot (esphome: on_boot below); both are empty until then.
    - type: menu
      text: "Relays"
      id: relays_menu

    - type: menu
      text: "Inputs"
      id: inputs_menu

    # A Temp N submenu per slot up to the last bound one is added at boot (esphome:
    # on_boot below); a freed slot's submenu only says Free slot.
    - type: menu
      text: "Temperatures"
      id: temperatures_menu
      items:
        - type: label
          text: !lambda |-
            auto *s = id(pcb_temp);
            if (std::isnan(s->state))
              return str_sprintf("%s: --", s->get_name().c_str());
            return str_sprintf("%s: %.1f°C", s->get_name().c_str(), s->state);

    # A submenu per loaded thermostat is added at boot (esphome: on_boot below).
    - type: menu
      text: "Thermostats"
      id: thermostats_menu

    # A row per loaded rule is added at boot (esphome: on_boot below).
    - type: menu
      text: "Automations"
      id: automations_menu

    - type: menu
      text: "Info"
      id: info_submenu
      items:

    - type: menu
      text: "Settings"
      id: menu_settings_id
      # Weights, not the package order, group these by what a row does: unweighted
      # everyday settings, 10 commissioning, 20 erases data, 30+ the whole device.
      items:
        - type: select
          text: "Display off"
          select: display_off_timer_select

        - type: menu
          text: "Modbus"
          weight: 10
          items:
            - type: number
              text: "Address"
              number: modbus_address
              format: "%.0f"

            - type: select
              text: "Baud rate"
              select: modbus_baud_rate

            - type: select
              text: "Parity"
              select: modbus_parity

            - type: select
              text: "Stop bits"
              select: modbus_stop_bits

        - type: menu
          text: "Temp sensors"
          weight: 20
          items:
            - type: label
              text: "Forget all?"

            - type: command
              text: "Confirm"
              id: forget_temps_yes
              on_value:
                - lambda: 'id(forget_temps_yes)->set_text("Confirm - OK");'
                - script.execute:
                    id: forget_temperatures
                    slot: -1

        - type: menu
          text: "Factory reset"
          weight: 40
          items:
            - type: label
              text: "Factory reset?"

            - type: command
              text: "Confirm"
              id: factory_reset_yes
              on_value:
                - lambda: 'id(factory_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - script.execute: run_factory_reset

        - type: command
          text: "Reboot device"
          weight: 30
          on_value:
            - lambda: 'App.safe_reboot();'

esphome:
  on_boot:
    # After the board has filled `relays` / `inputs` (800). A settings row is opened with
    # CENTER, stepped with LEFT / RIGHT and closed with CENTER or BACK; the choice is applied
    # when it closes.
    - priority: 700
      then:
        - lambda: |-
            using namespace display_menu_base;
            using Field = entity_config::SwitchSettingsJson::Field;
            auto add_row = [](MenuItemMenu *menu, const char *text, std::function<size_t()> count,
                              std::function<std::string(int)> label, std::function<int()> index,
                              std::function<void(size_t)> set) {
              auto *pending = new int(-1);  // the choice being edited; -1 outside editing
              auto *row = new MenuItemCustom();
              row->set_text(std::string(text));
              row->set_value_lambda([=](const MenuItem *) { return label(*pending >= 0 ? *pending : index()); });
              row->add_on_enter_callback([=]() { *pending = index(); });
              row->add_on_next_callback([=]() { *pending = (*pending + 1) % static_cast<int>(count()); });
              row->add_on_prev_callback([=]() {
                const int n = count();
                *pending = *pending < 0 ? n - 1 : (*pending + n - 1) % n;
              });
              row->add_on_leave_callback([=]() {
                if (*pending >= 0 && *pending != index())
                  set(*pending);
                *pending = -1;
              });
              menu->add_item(row);
            };
            // Each submenu is built next to its entity, so nothing binds its rows by position.
            auto *sws = id(switch_settings);
            for (auto *sw : id(relays)) {
              auto *menu = new MenuItemMenu();
              menu->set_text([sw](const MenuItem *) {
                return sw->get_name().str() + (sw->state ? " (On)" : " (Off)");
              });
              auto *state_row = new MenuItemSwitch();
              state_row->set_text(std::string("State"));
              state_row->set_switch_variable(sw);
              state_row->set_on_text("On");
              state_row->set_off_text("Off");
              state_row->set_immediate_edit(true);
              menu->add_item(state_row);

              auto field_row = [&](const char *text, Field field) {
                add_row(menu, text, [sws, field]() { return sws->option_count(field); },
                        [sws, sw, field](int index) { return sws->option_label(sw, field, index); },
                        [sws, sw, field]() { return sws->option_index(sw, field); },
                        [sws, sw, field](size_t index) { sws->set_option(sw, field, index); });
              };
              field_row("Inverted", Field::INVERTED);
              field_row("Start mode", Field::RESTORE_MODE);
              field_row("Bind to", Field::BINDING_INPUT);
              field_row("Binding", Field::BINDING_MODE);
              id(relays_menu)->add_item(menu);
            }

            auto *bss = id(binary_sensor_settings);
            for (auto *input : id(inputs)) {
              auto *menu = new MenuItemMenu();
              menu->set_text([input](const MenuItem *) {
                return input->get_name().str() + (input->state ? " (On)" : " (Off)");
              });
              auto *state_row = new MenuItem(MENU_ITEM_LABEL);
              state_row->set_text([input](const MenuItem *) {
                return std::string(input->state ? "State (On)" : "State (Off)");
              });
              menu->add_item(state_row);

              add_row(menu, "Inverted", []() { return 2; },
                      [](int index) { return index == 1 ? "Yes" : "No"; },
                      [bss, input]() { return bss->is_inverted(input) ? 1 : 0; },
                      [bss, input](size_t index) { bss->set_inverted(input, index == 1); });
              id(inputs_menu)->add_item(menu);
            }

    # After dallas_scan (600) has created the sensors.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto *scan = id(temps);
            for (size_t slot = 0; slot < scan->used_slots(); slot++) {
              const std::string name = scan->slot_name(slot);
              auto format = [name](float value) {
                return std::isnan(value) ? name + ": --" : str_sprintf("%s: %.1f°C", name.c_str(), value);
              };

              // The row shows the reading and opens the slot: reading, address, and
              // forget where it changes anything. A freed slot between sensors keeps
              // its row and only says that it is free.
              auto *menu = new MenuItemMenu();
              menu->set_text(format(scan->temperature(slot)));  // a listed sensor may have a state already
              auto *sensor = scan->sensor(slot);
              if (sensor == nullptr) {
                auto *note = new MenuItem(MENU_ITEM_LABEL);
                note->set_text("Free slot");
                menu->add_item(note);
                id(temperatures_menu)->add_item(menu);
                continue;
              }
              auto *reading = new MenuItem(MENU_ITEM_LABEL);
              reading->set_text(format(sensor->state));
              sensor->add_on_state_callback([menu, reading, format](float value) {
                menu->set_text(format(value));
                reading->set_text(format(value));
              });
              menu->add_item(reading);
              if (const uint64_t rom = scan->address(slot); rom != 0) {
                auto *address = new MenuItem(MENU_ITEM_LABEL);
                address->set_text(str_sprintf("0x%016" PRIx64, rom));
                menu->add_item(address);
              }
              if (!scan->pinned(slot)) {
                auto *question = new MenuItem(MENU_ITEM_LABEL);
                question->set_text("Forget slot?");
                menu->add_item(question);
                auto *confirm = new MenuItemCommand();
                confirm->set_text("Confirm");
                confirm->add_on_value_callback([confirm, slot]() {
                  confirm->set_text("Confirm - OK");
                  id(forget_temperatures)->execute(slot);
                });
                menu->add_item(confirm);
              }
              id(temperatures_menu)->add_item(menu);
            }

    # After the engine has loaded the rules (setup priority DATA - 1). The list is the one
    # boot found: a rule added over HTTP afterwards shows after a reboot.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto *engine = id(automations_engine);
            // A row holds the rule's id, not a pointer: add and remove move the configs.
            auto state_of = [engine](uint32_t rule_id) {
              for (const auto &config : engine->configs().get_all_configs()) {
                if (config.id == rule_id)
                  return config.enabled ? 1 : 0;
              }
              return -1;  // removed since boot
            };
            // The value is appended to the row text and the row is clipped at the panel
            // edge, so a long name would push On / Off off the screen.
            auto fit = [](const std::string &text, size_t chars) {
              size_t i = 0;
              while (i < text.size() && chars-- > 0) {
                for (i++; i < text.size() && (static_cast<unsigned char>(text[i]) & 0xC0) == 0x80; i++) {
                }
              }
              return text.substr(0, i);
            };
            // A cut name is no longer known to be unique — two rules may start alike — so a row
            // that had to cut one carries the rule's id, the one the editor and the log use.
            auto label = [&fit](const automations::AutomationConfig &config) {
              const std::string cut = fit(config.name, 12);
              if (cut.size() == config.name.size())
                return cut;
              const std::string tag = " #" + std::to_string(config.id);
              return fit(config.name, 12 - tag.size()) + tag;
            };
            for (const auto &config : engine->configs().get_all_configs()) {
              const uint32_t rule_id = config.id;
              auto *pending = new int(-1);  // the choice being edited; -1 outside editing
              auto *row = new MenuItemCustom();
              row->set_text(label(config));
              row->set_value_lambda([=](const MenuItem *) {
                const int state = *pending >= 0 ? *pending : state_of(rule_id);
                return std::string(state < 0 ? "--" : state > 0 ? "On" : "Off");
              });
              row->add_on_enter_callback([=]() { *pending = state_of(rule_id); });
              auto flip = [=]() {
                if (*pending >= 0)
                  *pending = 1 - *pending;
              };
              row->add_on_next_callback(flip);
              row->add_on_prev_callback(flip);
              row->add_on_leave_callback([=]() {
                const int current = state_of(rule_id);
                bool persisted = false;
                // Only on a change to a rule still there: the engine rewrites the rule's file on
                // every call. A rule naming an entity that is gone is never written, so put the
                // live state back rather than leave the row promising what a reboot would undo.
                if (*pending >= 0 && current >= 0 && *pending != current &&
                    engine->set_enable_automation(rule_id, *pending > 0, &persisted) && !persisted)
                  engine->set_enable_automation(rule_id, *pending == 0);
                *pending = -1;
              });
              id(automations_menu)->add_item(row);
            }
            if (id(automations_menu)->items_size() == 0) {
              // An empty submenu cannot be entered, so the row would do nothing at all.
              auto *note = new MenuItem(MENU_ITEM_LABEL);
              note->set_text("No automations");
              id(automations_menu)->add_item(note);
            }

    # After climate_hub (setup priority DATA - 0.5) has loaded the thermostats. The list is the
    # one boot found: a thermostat added over HTTP afterwards shows after a reboot.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            static constexpr size_t ROW = 18;  // f7x14_mod2 glyphs across the panel
            auto *hub = id(climates);
            // Rows hold the thermostat's id, not a pointer: the store moves its documents. One
            // deleted since boot is not found, and its rows say --.
            auto reading = [hub](const std::string &thermostat_id) {
              const auto *config = hub->store().get(thermostat_id);
              const float value = config != nullptr ? hub->sensor_reading(config->sensor_id) : NAN;
              return std::isnan(value) ? std::string("--") : str_sprintf("%.1f°C", value);
            };
            auto glyphs = [](const std::string &text) -> size_t {
              return std::count_if(text.begin(), text.end(),
                                   [](char c) { return (static_cast<unsigned char>(c) & 0xC0) != 0x80; });
            };
            for (const auto &doc : hub->store().all()) {
              const std::string thermostat_id = doc->id;
              const std::string boot_name = doc->name;
              auto *menu = new MenuItemMenu();
              // Names are ASCII; the name gives way so the reading stays on the panel.
              menu->set_text([=](const MenuItem *) {
                const auto *config = hub->store().get(thermostat_id);
                const std::string value = reading(thermostat_id);
                const std::string &name = config != nullptr ? config->name : boot_name;
                std::string cut = name.substr(0, ROW - 2 - glyphs(value));
                while (!cut.empty() && cut.back() == ' ')
                  cut.pop_back();  // a cut between words would leave "Floor heating : --"
                return cut + ": " + value;
              });

              // The list row cuts the name to make room for the reading, so "Floor heating 1" and
              // "Floor heating 2" look alike there; this says which one is open.
              auto *title = new MenuItem(MENU_ITEM_LABEL);
              title->set_text([=](const MenuItem *) {
                const auto *config = hub->store().get(thermostat_id);
                return (config != nullptr ? config->name : boot_name).substr(0, ROW);
              });
              menu->add_item(title);

              auto *current = new MenuItem(MENU_ITEM_LABEL);
              current->set_text([=](const MenuItem *) { return "Current: " + reading(thermostat_id); });
              menu->add_item(current);

              // The dashboard's badge, with a fault in place of the action it holds open.
              auto state_of = [=]() -> const char * {
                using climate_hub::HubAction;
                using climate_hub::HubFault;
                const auto *config = hub->store().get(thermostat_id);
                if (config == nullptr)
                  return "--";
                if (!config->enabled)
                  return "Disabled";
                const auto *runtime = hub->runtime(thermostat_id);
                if (runtime == nullptr)
                  return "Waiting";
                switch (runtime->fault()) {
                  case HubFault::SENSOR_MISSING:
                    return "No sensor";
                  case HubFault::SENSOR_STALE:
                    return "No reading";
                  case HubFault::RELAY_MISSING:
                    return "No relay";
                  case HubFault::OVERTEMP:
                    return "Overheat";
                  case HubFault::NONE:
                    break;
                }
                switch (runtime->action()) {
                  case HubAction::HEATING:
                    return "Heating";
                  case HubAction::COOLING:
                    return "Cooling";
                  case HubAction::IDLE:
                    return "Idle";
                  case HubAction::OFF:
                    break;
                }
                return "Off";
              };
              auto *state = new MenuItem(MENU_ITEM_LABEL);
              state->set_text([=](const MenuItem *) { return std::string("State: ") + state_of(); });
              menu->add_item(state);

              // Counted in steps from the target the row opened on, so the steps add no float
              // error, and written only when they moved it: an untouched row never puts that
              // target back over one Home Assistant or the dashboard set meanwhile.
              auto *opened = new float(NAN);  // NaN outside editing
              auto *steps = new int(0);
              auto stepped = [=]() -> float {
                const auto *config = hub->store().get(thermostat_id);
                if (config == nullptr)
                  return NAN;
                if (std::isnan(*opened))
                  return config->setpoint;
                const auto &visual = config->visual;
                return std::clamp(*opened + *steps * visual.step, visual.min_temperature, visual.max_temperature);
              };
              auto *target = new MenuItemCustom();
              target->set_text(std::string("Target"));
              target->set_value_lambda([=](const MenuItem *) {
                const float value = stepped();
                return std::isnan(value) ? std::string("--") : str_sprintf("%.1f°C", value);
              });
              target->add_on_enter_callback([=]() {
                const auto *config = hub->store().get(thermostat_id);
                *opened = config != nullptr ? config->setpoint : NAN;
                *steps = 0;
              });
              // The margin keeps a float a hair inside a limit from taking a press that shows nothing.
              target->add_on_next_callback([=]() {
                const auto *config = hub->store().get(thermostat_id);
                if (config != nullptr && !std::isnan(*opened) &&
                    stepped() < config->visual.max_temperature - config->visual.step / 1000)
                  (*steps)++;
              });
              target->add_on_prev_callback([=]() {
                const auto *config = hub->store().get(thermostat_id);
                if (config != nullptr && !std::isnan(*opened) &&
                    stepped() > config->visual.min_temperature + config->visual.step / 1000)
                  (*steps)--;
              });
              target->add_on_leave_callback([=]() {
                const float value = stepped();
                if (*steps != 0 && !std::isnan(value) && value != *opened) {
                  const auto result = hub->set_setpoint(thermostat_id, value);
                  if (!result.ok)
                    ESP_LOGW("menu", "Thermostat '%s' target: %s", thermostat_id.c_str(), result.error.c_str());
                }
                *opened = NAN;
                *steps = 0;
              });
              menu->add_item(target);

              auto enabled_of = [=]() {
                const auto *config = hub->store().get(thermostat_id);
                return config == nullptr ? -1 : config->enabled ? 1 : 0;
              };
              auto *was = new int(-1);      // the flag the row opened on; -1 outside editing
              auto *pending = new int(-1);  // the choice being edited
              auto *enabled = new MenuItemCustom();
              enabled->set_text(std::string("Enabled"));
              enabled->set_value_lambda([=](const MenuItem *) {
                const int live = enabled_of();
                const int state = live < 0 ? -1 : *pending >= 0 ? *pending : live;
                return std::string(state < 0 ? "--" : state > 0 ? "On" : "Off");
              });
              enabled->add_on_enter_callback([=]() { *was = *pending = enabled_of(); });
              auto flip = [=]() {
                if (*pending >= 0)
                  *pending = 1 - *pending;
              };
              enabled->add_on_next_callback(flip);
              enabled->add_on_prev_callback(flip);
              // Never a take-over: the panel does not stop another thermostat to free a relay. A
              // refused On leaves the row at Off, and the log says why.
              enabled->add_on_leave_callback([=]() {
                if (*pending >= 0 && *pending != *was && enabled_of() >= 0) {
                  const auto result = hub->set_enabled(thermostat_id, *pending > 0);
                  if (!result.ok) {
                    ESP_LOGW("menu", "Thermostat '%s' not %s: %s", thermostat_id.c_str(),
                             *pending > 0 ? "enabled" : "disabled", result.error.c_str());
                  } else if (!result.persisted) {
                    ESP_LOGW("menu", "Thermostat '%s' changed but not saved; a reboot undoes it",
                             thermostat_id.c_str());
                  }
                }
                *was = *pending = -1;
              });
              menu->add_item(enabled);
              id(thermostats_menu)->add_item(menu);
            }
            if (id(thermostats_menu)->items_size() == 0) {
              // An empty submenu cannot be entered, so the row would do nothing at all.
              auto *note = new MenuItem(MENU_ITEM_LABEL);
              note->set_text("No thermostats");
              id(thermostats_menu)->add_item(note);
            }
