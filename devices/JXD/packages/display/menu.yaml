                  text: !lambda |-
                    uint64_t a = id(dallas_slots)[6];
                    return a ? str_sprintf("0x%016" PRIx64, a) : std::string("empty");

                - type: label
                  text: "Forget slot?"

                - type: command
                  text: "Confirm"
                  id: forget_temp7_yes
                  on_value:
