graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  on_redraw:
    then:
      - component.update: display1
  items:
    - type: menu
      text: "Relays"
      items:
        - type: switch
          text: "Relay 1"
          switch: relay_1
          immediate_edit: true

        - type: switch
          text: "Relay 2"
          switch: relay_2
          immediate_edit: true

        - type: switch
          text: "Relay 3"
          switch: relay_3
          immediate_edit: true

        - type: switch
          text: "Relay 4"
          switch: relay_4
          immediate_edit: true

        - type: switch
          text: "Relay 5"
          switch: relay_5
          immediate_edit: true

        - type: switch
          text: "Relay 6"
          switch: relay_6
          immediate_edit: true

    - type: menu
      text: "Inputs"
      items:
        - type: label
          text: !lambda |-
            return id(input_1).state ? "Input 1: ON" : "Input 1: OFF";

        - type: label
          text: !lambda |-
            return id(input_2).state ? "Input 2: ON" : "Input 2: OFF";

        - type: label
          text: !lambda |-
            return id(input_3).state ? "Input 3: ON" : "Input 3: OFF";

        - type: label
          text: !lambda |-
            return id(input_4).state ? "Input 4: ON" : "Input 4: OFF";

        - type: label
          text: !lambda |-
            return id(input_5).state ? "Input 5: ON" : "Input 5: OFF";

        - type: label
          text: !lambda |-
            return id(input_6).state ? "Input 6: ON" : "Input 6: OFF";

    # A Temp N submenu per bound slot is added at boot (esphome: on_boot below).
    - type: menu
      text: "Temperatures"
      id: temperatures_menu
      items:
        - type: label
          text: !lambda |-
            auto *s = id(pcb_temp);
            if (std::isnan(s->state))
              return str_sprintf("%s: --", s->get_name().c_str());
            return str_sprintf("%s: %.1f°C", s->get_name().c_str(), s->state);

    - type: menu
      text: "Info"
      id: info_submenu
      items:

    - type: menu
      text: "Settings"
      id: menu_settings_id
      items:
        - type: select
          text: "Display off"
          select: display_off_timer_select

        - type: menu
          text: "Modbus"
          items:
            - type: label
              text: "Applied on reboot"

            - type: number
              text: "Address"
              number: modbus_address
              format: "%.0f"

            - type: select
              text: "Baud rate"
              select: modbus_baud_rate

            - type: select
              text: "Parity"
              select: modbus_parity

            - type: select
              text: "Stop bits"
              select: modbus_stop_bits

        - type: menu
          text: "Temp sensors"
          items:
            - type: label
              text: "Forget all?"

            - type: command
              text: "Confirm"
              id: forget_temps_yes
              on_value:
                - lambda: 'id(forget_temps_yes)->set_text("Confirm - OK");'
                - script.execute:
                    id: forget_temperatures
                    slot: -1

        - type: menu
          text: "Factory reset"
          items:
            - type: label
              text: "Factory reset?"

            - type: command
              text: "Confirm"
              id: factory_reset_yes
              on_value:
                - lambda: 'id(factory_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - lambda: |-
                    global_preferences->reset();
                    App.safe_reboot();

        - type: command
          text: "Reboot device"
          on_value:
            - lambda: 'App.safe_reboot();'

esphome:
  on_boot:
    # After dallas_scan (600) has created the sensors.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto *scan = id(temps);
            for (size_t slot = 0; slot < scan->max_sensors(); slot++) {
              auto *sensor = scan->sensor(slot);
              if (sensor == nullptr)
                continue;
              const std::string name = sensor->get_name().c_str();
              auto format = [name](float value) {
                return std::isnan(value) ? name + ": --" : str_sprintf("%s: %.1f°C", name.c_str(), value);
              };

              // The row shows the reading and opens the slot: reading, address, and
              // forget where it changes anything.
              auto *menu = new MenuItemMenu();
              auto *reading = new MenuItem(MENU_ITEM_LABEL);
              menu->set_text(format(NAN));
              reading->set_text(format(NAN));
              sensor->add_on_state_callback([menu, reading, format](float value) {
                menu->set_text(format(value));
                reading->set_text(format(value));
              });
              menu->add_item(reading);
              if (const uint64_t rom = scan->address(slot); rom != 0) {
                auto *address = new MenuItem(MENU_ITEM_LABEL);
                address->set_text(str_sprintf("0x%016" PRIx64, rom));
                menu->add_item(address);
              }
              if (!scan->pinned(slot)) {
                auto *question = new MenuItem(MENU_ITEM_LABEL);
                question->set_text("Forget slot?");
                menu->add_item(question);
                auto *confirm = new MenuItemCommand();
                confirm->set_text("Confirm");
                confirm->add_on_value_callback([confirm, slot]() {
                  confirm->set_text("Confirm - OK");
                  id(forget_temperatures)->execute(slot);
                });
                menu->add_item(confirm);
              }
              id(temperatures_menu)->add_item(menu);
            }
