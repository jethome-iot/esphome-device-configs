                    - script.execute:
                        id: forget_temperatures
                        slot: 6

            - type: menu
              text: "Temp8"
              items:
                - type: label
                  text: !lambda |-
                    uint64_t a = id(dallas_slots)[7];
                    return a ? str_sprintf("0x%016" PRIx64, a) : std::string("empty");

                - type: label
                  text: "Forget slot?"

                - type: command
                  text: "Confirm"
                  id: forget_temp8_yes
                  on_value:
                    - lambda: 'id(forget_temp8_yes)->set_text("Confirm - OK");'
