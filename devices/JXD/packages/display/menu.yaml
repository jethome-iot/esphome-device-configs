external_components:
  - source: ${components}
    components: [display_menu_base, graphical_display_menu]

graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  # The highlight spans the row, and RIGHT no longer opens a submenu: it is the
  # value key, ENTER is the one that descends.
  fill_row: true
  right_for_menu_enter: false
  on_redraw:
    then:
      - component.update: display1
  items:
    # A Relay N / Input N submenu per entry of the relays / inputs vectors is added at
    # boot (esphome: on_boot below); both are empty until then.
    - type: menu
      text: "Relays"
      id: relays_menu

    - type: menu
      text: "Inputs"
      id: inputs_menu

    # A Temp N submenu per slot up to the last bound one is added at boot (esphome:
    # on_boot below); a freed slot's submenu only says Free slot.
    - type: menu
      text: "Temperatures"
      id: temperatures_menu
      items:
        - type: label
          text: !lambda |-
            auto *s = id(pcb_temp);
            if (std::isnan(s->state))
              return str_sprintf("%s: --", s->get_name().c_str());
            return str_sprintf("%s: %.1f°C", s->get_name().c_str(), s->state);

    # A row per loaded rule is added at boot (esphome: on_boot below).
    - type: menu
      text: "Automations"
      id: automations_menu

    - type: menu
      text: "Info"
      id: info_submenu
      items:

    - type: menu
      text: "Settings"
      id: menu_settings_id
      # Weights, not the package order, group these by what a row does: unweighted
      # everyday settings, 10 commissioning, 20 erases data, 30+ the whole device.
      items:
        - type: select
          text: "Display off"
          select: display_off_timer_select

        - type: menu
          text: "Modbus"
          weight: 10
          items:
            - type: label
              text: "Applied on reboot"

            - type: number
              text: "Address"
              number: modbus_address
              format: "%.0f"

            - type: select
              text: "Baud rate"
              select: modbus_baud_rate

            - type: select
              text: "Parity"
              select: modbus_parity

            - type: select
              text: "Stop bits"
              select: modbus_stop_bits

        - type: menu
          text: "Temp sensors"
          weight: 20
          items:
            - type: label
              text: "Forget all?"

            - type: command
              text: "Confirm"
              id: forget_temps_yes
              on_value:
                - lambda: 'id(forget_temps_yes)->set_text("Confirm - OK");'
                - script.execute:
                    id: forget_temperatures
                    slot: -1

        - type: menu
          text: "Factory reset"
          weight: 40
          items:
            - type: label
              text: "Factory reset?"

            - type: command
              text: "Confirm"
              id: factory_reset_yes
              on_value:
                - lambda: 'id(factory_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - lambda: |-
                    // The partition is wiped at the next boot; the record has to outlive
                    // the preferences erase, which takes all of NVS.
                    global_preferences->reset();
                    if (!id(user_storage)->request_format()) {
                      ESP_LOGE("factory_reset", "Wiping the user partition failed");
                    }
                    App.safe_reboot();

        - type: command
          text: "Reboot device"
          weight: 30
          on_value:
            - lambda: 'App.safe_reboot();'

esphome:
  on_boot:
    # After the board has filled `relays` / `inputs` (800). A settings row is opened with
    # CENTER, stepped with LEFT / RIGHT and closed with CENTER or BACK; the choice is applied
    # when it closes.
    - priority: 700
      then:
        - lambda: |-
            using namespace display_menu_base;
            using Field = entity_config::SwitchSettingsJson::Field;
            auto add_row = [](MenuItemMenu *menu, const char *text, std::function<size_t()> count,
                              std::function<std::string(int)> label, std::function<int()> index,
                              std::function<void(size_t)> set) {
              auto *pending = new int(-1);  // the choice being edited; -1 outside editing
              auto *row = new MenuItemCustom();
              row->set_text(std::string(text));
              row->set_value_lambda([=](const MenuItem *) { return label(*pending >= 0 ? *pending : index()); });
              row->add_on_enter_callback([=]() { *pending = index(); });
              row->add_on_next_callback([=]() { *pending = (*pending + 1) % static_cast<int>(count()); });
              row->add_on_prev_callback([=]() {
                const int n = count();
                *pending = *pending < 0 ? n - 1 : (*pending + n - 1) % n;
              });
              row->add_on_leave_callback([=]() {
                if (*pending >= 0 && *pending != index())
                  set(*pending);
                *pending = -1;
              });
              menu->add_item(row);
            };
            // Each submenu is built next to its entity, so nothing binds its rows by position.
            auto *sws = id(switch_settings);
            for (auto *sw : id(relays)) {
              auto *menu = new MenuItemMenu();
              menu->set_text([sw](const MenuItem *) {
                return sw->get_name().str() + (sw->state ? " (On)" : " (Off)");
              });
              auto *state_row = new MenuItemSwitch();
              state_row->set_text(std::string("State"));
              state_row->set_switch_variable(sw);
              state_row->set_on_text("On");
              state_row->set_off_text("Off");
              state_row->set_immediate_edit(true);
              menu->add_item(state_row);

              auto field_row = [&](const char *text, Field field) {
                add_row(menu, text, [sws, field]() { return sws->option_count(field); },
                        [sws, sw, field](int index) { return sws->option_label(sw, field, index); },
                        [sws, sw, field]() { return sws->option_index(sw, field); },
                        [sws, sw, field](size_t index) { sws->set_option(sw, field, index); });
              };
              field_row("Inverted", Field::INVERTED);
              field_row("Start mode", Field::RESTORE_MODE);
              field_row("Bind to", Field::BINDING_INPUT);
              field_row("Binding", Field::BINDING_MODE);
              id(relays_menu)->add_item(menu);
            }

            auto *bss = id(binary_sensor_settings);
            for (auto *input : id(inputs)) {
              auto *menu = new MenuItemMenu();
              menu->set_text([input](const MenuItem *) {
                return input->get_name().str() + (input->state ? " (On)" : " (Off)");
              });
              auto *state_row = new MenuItem(MENU_ITEM_LABEL);
              state_row->set_text([input](const MenuItem *) {
                return std::string(input->state ? "State (On)" : "State (Off)");
              });
              menu->add_item(state_row);

              add_row(menu, "Inverted", []() { return 2; },
                      [](int index) { return index == 1 ? "Yes" : "No"; },
                      [bss, input]() { return bss->is_inverted(input) ? 1 : 0; },
                      [bss, input](size_t index) { bss->set_inverted(input, index == 1); });
              id(inputs_menu)->add_item(menu);
            }

    # After dallas_scan (600) has created the sensors.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto *scan = id(temps);
            for (size_t slot = 0; slot < scan->used_slots(); slot++) {
              const std::string name = scan->slot_name(slot);
              auto format = [name](float value) {
                return std::isnan(value) ? name + ": --" : str_sprintf("%s: %.1f°C", name.c_str(), value);
              };

              // The row shows the reading and opens the slot: reading, address, and
              // forget where it changes anything. A freed slot between sensors keeps
              // its row and only says that it is free.
              auto *menu = new MenuItemMenu();
              menu->set_text(format(scan->temperature(slot)));  // a listed sensor may have a state already
              auto *sensor = scan->sensor(slot);
              if (sensor == nullptr) {
                auto *note = new MenuItem(MENU_ITEM_LABEL);
                note->set_text("Free slot");
                menu->add_item(note);
                id(temperatures_menu)->add_item(menu);
                continue;
              }
              auto *reading = new MenuItem(MENU_ITEM_LABEL);
              reading->set_text(format(sensor->state));
              sensor->add_on_state_callback([menu, reading, format](float value) {
                menu->set_text(format(value));
                reading->set_text(format(value));
              });
              menu->add_item(reading);
              if (const uint64_t rom = scan->address(slot); rom != 0) {
                auto *address = new MenuItem(MENU_ITEM_LABEL);
                address->set_text(str_sprintf("0x%016" PRIx64, rom));
                menu->add_item(address);
              }
              if (!scan->pinned(slot)) {
                auto *question = new MenuItem(MENU_ITEM_LABEL);
                question->set_text("Forget slot?");
                menu->add_item(question);
                auto *confirm = new MenuItemCommand();
                confirm->set_text("Confirm");
                confirm->add_on_value_callback([confirm, slot]() {
                  confirm->set_text("Confirm - OK");
                  id(forget_temperatures)->execute(slot);
                });
                menu->add_item(confirm);
              }
              id(temperatures_menu)->add_item(menu);
            }

    # After the engine has loaded the rules (setup priority DATA - 1). The list is the one
    # boot found: a rule added over HTTP afterwards shows after a reboot.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto *engine = id(automations_engine);
            // A row holds the rule's id, not a pointer: add and remove move the configs.
            auto state_of = [engine](uint32_t rule_id) {
              for (const auto &config : engine->configs().get_all_configs()) {
                if (config.id == rule_id)
                  return config.enabled ? 1 : 0;
              }
              return -1;  // removed since boot
            };
            // A rule name is the one text on this screen the user wrote, so it is the one the
            // font may not carry; cutting keeps a long one off the value column.
            auto *menu_font = id(f7x14_mod2);
            auto fit = [menu_font](const std::string &text, size_t chars) {
              return fit_text(text, chars, [menu_font](uint32_t code_point) {
                return menu_font->find_glyph(code_point) != nullptr;
              });
            };
            // Cut or stood in for, a name may no longer read uniquely, so those rows carry
            // the rule's id — the one the editor and the log use.
            auto label = [&fit](const automations::AutomationConfig &config) {
              const std::string cut = fit(config.name, 12);
              if (cut == config.name)
                return cut;
              const std::string tag = " #" + std::to_string(config.id);
              return fit(config.name, 12 - tag.size()) + tag;
            };
            for (const auto &config : engine->configs().get_all_configs()) {
              const uint32_t rule_id = config.id;
              auto *pending = new int(-1);  // the choice being edited; -1 outside editing
              auto *row = new MenuItemCustom();
              row->set_text(label(config));
              row->set_value_lambda([=](const MenuItem *) {
                const int state = *pending >= 0 ? *pending : state_of(rule_id);
                return std::string(state < 0 ? "--" : state > 0 ? "On" : "Off");
              });
              row->add_on_enter_callback([=]() { *pending = state_of(rule_id); });
              auto flip = [=]() {
                if (*pending >= 0)
                  *pending = 1 - *pending;
              };
              row->add_on_next_callback(flip);
              row->add_on_prev_callback(flip);
              row->add_on_leave_callback([=]() {
                const int current = state_of(rule_id);
                bool persisted = false;
                // Only on a change to a rule still there: the engine rewrites the rule's file on
                // every call. A rule naming an entity that is gone is never written, so put the
                // live state back rather than leave the row promising what a reboot would undo.
                if (*pending >= 0 && current >= 0 && *pending != current &&
                    engine->set_enable_automation(rule_id, *pending > 0, &persisted) && !persisted)
                  engine->set_enable_automation(rule_id, *pending == 0);
                *pending = -1;
              });
              id(automations_menu)->add_item(row);
            }
            if (id(automations_menu)->items_size() == 0) {
              // An empty submenu cannot be entered, so the row would do nothing at all.
              auto *note = new MenuItem(MENU_ITEM_LABEL);
              note->set_text("No automations");
              id(automations_menu)->add_item(note);
            }
