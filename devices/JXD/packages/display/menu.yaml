external_components:
  - source: ${components}
    components: [display_menu_base, graphical_display_menu]

graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  # The highlight spans the row, and RIGHT no longer opens a submenu: it is the
  # value key, ENTER is the one that descends.
  fill_row: true
  right_for_menu_enter: false
  on_redraw:
    then:
      - component.update: display1
  # Weights, not the package order, place the root rows: a board's own rows (menu-*.yaml) sit
  # below 100, Info and Settings after them.
  items:
    - type: menu
      text: "Info"
      id: info_submenu
      weight: 100
      items:

    - type: menu
      text: "Settings"
      id: menu_settings_id
      weight: 110
      # Weights group these by what a row does: below 10 everyday, 10-19 commissioning, 20-29
      # erases data, 30+ the whole device. A board's rows take a band's first weight and the
      # shared ones sit 5 or more above it, so they follow a board's.
      items:
        - type: select
          text: "Display off"
          weight: 5
          select: display_off_timer_select

        - type: menu
          text: "Factory reset"
          weight: 40
          items:
            - type: label
              text: "Factory reset?"

            - type: command
              text: "Confirm"
              id: factory_reset_yes
              on_value:
                - lambda: 'id(factory_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - script.execute: run_factory_reset

        - type: command
          text: "Reboot device"
          weight: 35
          on_value:
            - lambda: 'App.safe_reboot();'
