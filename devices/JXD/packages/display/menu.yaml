                    - script.execute:
                        id: forget_temperatures
                        slot: 7

        - type: menu
          text: "Factory reset"
          items:
            - type: label
              text: "Factory reset?"

            - type: command
              text: "Confirm"
              id: factory_reset_yes
              on_value:
                - lambda: 'id(factory_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - lambda: |-
                    global_preferences->reset();
                    App.safe_reboot();

        - type: command
          text: "Reboot device"
          on_value:
            - lambda: 'App.safe_reboot();'
