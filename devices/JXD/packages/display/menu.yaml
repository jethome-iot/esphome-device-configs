              value_lambda: 'return id(switch_settings).inverted_label(id(relay_1));'
              on_next:
                - lambda: 'id(switch_settings).toggle_inverted(id(relay_1));'
              on_prev:
                - lambda: 'id(switch_settings).toggle_inverted(id(relay_1));'

            - type: custom
