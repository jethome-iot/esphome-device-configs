                    - script.execute:
                        id: forget_temperatures
                        slot: 4

            - type: menu
              text: "Temp6"
              items:
                - type: label
                  text: !lambda |-
                    uint64_t a = id(dallas_slots)[5];
                    return a ? str_sprintf("0x%016" PRIx64, a) : std::string("empty");

                - type: label
                  text: "Forget slot?"

                - type: command
                  text: "Confirm"
                  id: forget_temp6_yes
                  on_value:
