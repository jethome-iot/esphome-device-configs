graphical_display_menu:
  id: display_menu
  display: display1
  font: f7x14_mod2
  mode: joystick
  active: false
  on_redraw:
    then:
      - component.update: display1
  items:
    # A Relay N / Input N submenu per entity is added at boot (esphome: on_boot below);
    # the schema wants one item here, so the first row sums up what is on.
    - type: menu
      text: "Relays"
      id: relays_menu
      items:
        - type: label
          text: !lambda |-
            std::string on;
            for (size_t i = 0; i < id(relays).size(); i++) {
              if (id(relays)[i]->state)
                on += str_sprintf(" %u", static_cast<unsigned>(i + 1));
            }
            return on.empty() ? "All off" : "On:" + on;

    - type: menu
      text: "Inputs"
      id: inputs_menu
      items:
        - type: label
          text: !lambda |-
            std::string on;
            for (size_t i = 0; i < id(inputs).size(); i++) {
              if (id(inputs)[i]->state)
                on += str_sprintf(" %u", static_cast<unsigned>(i + 1));
            }
            return on.empty() ? "All off" : "On:" + on;

    # A Temp N submenu per slot up to the last bound one is added at boot (esphome:
    # on_boot below); a freed slot's submenu only says Free slot.
    - type: menu
      text: "Temperatures"
      id: temperatures_menu
      items:
        - type: label
          text: !lambda |-
            auto *s = id(pcb_temp);
            if (std::isnan(s->state))
              return str_sprintf("%s: --", s->get_name().c_str());
            return str_sprintf("%s: %.1f°C", s->get_name().c_str(), s->state);

    - type: menu
      text: "Info"
      id: info_submenu
      items:

    - type: menu
      text: "Settings"
      id: menu_settings_id
      items:
        - type: select
          text: "Display off"
          select: display_off_timer_select

        - type: menu
          text: "Modbus"
          items:
            - type: label
              text: "Applied on reboot"

            - type: number
              text: "Address"
              number: modbus_address
              format: "%.0f"

            - type: select
              text: "Baud rate"
              select: modbus_baud_rate

            - type: select
              text: "Parity"
              select: modbus_parity

            - type: select
              text: "Stop bits"
              select: modbus_stop_bits

        - type: menu
          text: "Temp sensors"
          items:
            - type: label
              text: "Forget all?"

            - type: command
              text: "Confirm"
              id: forget_temps_yes
              on_value:
                - lambda: 'id(forget_temps_yes)->set_text("Confirm - OK");'
                - script.execute:
                    id: forget_temperatures
                    slot: -1

        - type: menu
          text: "Factory reset"
          items:
            - type: label
              text: "Factory reset?"

            - type: command
              text: "Confirm"
              id: factory_reset_yes
              on_value:
                - lambda: 'id(factory_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - lambda: |-
                    global_preferences->reset();
                    App.safe_reboot();

        - type: command
          text: "Reboot device"
          on_value:
            - lambda: 'App.safe_reboot();'

esphome:
  on_boot:
    # After the board has filled `relays` / `inputs` (800). A settings row is opened with
    # CENTER, stepped with LEFT / RIGHT and closed with CENTER or BACK; every step applies
    # and is saved at once, because upstream fires the same on_leave for both ways out.
    - priority: 700
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto on_off = [](const std::string &name, bool state) {
              return str_sprintf("%s (%s)", name.c_str(), state ? "On" : "Off");
            };
            auto add_row = [](MenuItemMenu *menu, const char *text, std::function<std::string()> value,
                              std::function<void(int)> step) {
              auto *row = new MenuItemCustom();
              row->set_text(std::string(text));
              row->set_value_lambda([value](const MenuItem *) { return value(); });
              row->add_on_next_callback([step]() { step(1); });
              row->add_on_prev_callback([step]() { step(-1); });
              menu->add_item(row);
            };

            auto *sws = id(switch_settings);
            for (auto *sw : id(relays)) {
              const std::string name = sw->get_name().str();
              auto *menu = new MenuItemMenu();
              menu->set_text(on_off(name, sw->state));
              sw->add_on_state_callback([menu, name, on_off](bool state) { menu->set_text(on_off(name, state)); });

              auto *state = new MenuItemSwitch();
              state->set_text(std::string("State"));
              state->set_switch_variable(sw);
              state->set_on_text("On");  // codegen fills these from YAML; here nobody does
              state->set_off_text("Off");
              state->set_immediate_edit(true);
              menu->add_item(state);

              add_row(menu, "Inverted", [sws, sw]() { return std::string(sws->inverted_label(sw)); },
                      [sws, sw](int) { sws->toggle_inverted(sw); });
              add_row(menu, "Start mode", [sws, sw]() { return std::string(sws->restore_mode_label(sw)); },
                      [sws, sw](int step) { sws->cycle_restore_mode(sw, step); });
              add_row(menu, "Bind to", [sws, sw]() { return sws->binding_input_label(sw); },
                      [sws, sw](int step) { sws->cycle_binding_input(sw, step); });
              add_row(menu, "Binding", [sws, sw]() { return sws->binding_mode_label(sw); },
                      [sws, sw](int step) { sws->cycle_binding_mode(sw, step); });
              id(relays_menu)->add_item(menu);
            }

            auto *bss = id(binary_sensor_settings);
            for (auto *input : id(inputs)) {
              const std::string name = input->get_name().str();
              auto *menu = new MenuItemMenu();
              menu->set_text(on_off(name, input->state));
              auto *state = new MenuItem(MENU_ITEM_LABEL);
              state->set_text(on_off("State", input->state));
              input->add_on_state_callback([menu, state, name, on_off](bool value) {
                menu->set_text(on_off(name, value));
                state->set_text(on_off("State", value));
              });
              menu->add_item(state);
              add_row(menu, "Inverted", [bss, input]() { return std::string(bss->inverted_label(input)); },
                      [bss, input](int) { bss->toggle_inverted(input); });
              id(inputs_menu)->add_item(menu);
            }

    # After dallas_scan (600) has created the sensors.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            auto *scan = id(temps);
            for (size_t slot = 0; slot < scan->used_slots(); slot++) {
              const std::string name = scan->slot_name(slot);
              auto format = [name](float value) {
                return std::isnan(value) ? name + ": --" : str_sprintf("%s: %.1f°C", name.c_str(), value);
              };

              // The row shows the reading and opens the slot: reading, address, and
              // forget where it changes anything. A freed slot between sensors keeps
              // its row and only says that it is free.
              auto *menu = new MenuItemMenu();
              menu->set_text(format(scan->temperature(slot)));  // a listed sensor may have a state already
              auto *sensor = scan->sensor(slot);
              if (sensor == nullptr) {
                auto *note = new MenuItem(MENU_ITEM_LABEL);
                note->set_text("Free slot");
                menu->add_item(note);
                id(temperatures_menu)->add_item(menu);
                continue;
              }
              auto *reading = new MenuItem(MENU_ITEM_LABEL);
              reading->set_text(format(sensor->state));
              sensor->add_on_state_callback([menu, reading, format](float value) {
                menu->set_text(format(value));
                reading->set_text(format(value));
              });
              menu->add_item(reading);
              if (const uint64_t rom = scan->address(slot); rom != 0) {
                auto *address = new MenuItem(MENU_ITEM_LABEL);
                address->set_text(str_sprintf("0x%016" PRIx64, rom));
                menu->add_item(address);
              }
              if (!scan->pinned(slot)) {
                auto *question = new MenuItem(MENU_ITEM_LABEL);
                question->set_text("Forget slot?");
                menu->add_item(question);
                auto *confirm = new MenuItemCommand();
                confirm->set_text("Confirm");
                confirm->add_on_value_callback([confirm, slot]() {
                  confirm->set_text("Confirm - OK");
                  id(forget_temperatures)->execute(slot);
                });
                menu->add_item(confirm);
              }
              id(temperatures_menu)->add_item(menu);
            }
