graphical_display_menu:
  items:
    - id: !extend info_submenu
      items:
        - type: label
          text: "IP(Eth):"

        - type: label
          text: !lambda 'return " " + id(ip_eth).state;'

        - type: label
          text: "IP(WiFi):"

        - type: label
          text: !lambda |-
            if (id(captive_portal_id).is_active()) {
              char buf[esphome::network::IP_ADDRESS_BUFFER_SIZE];
              return " " + std::string(id(wifi_id).wifi_soft_ap_ip().str_to(buf));
            }
            return " " + id(ip_wifi).state;

        - type: label
          text: "MAC(Eth):"

        - type: label
          text: !lambda 'return " " + id(mac_eth).state;'

        - type: label
          text: "MAC(WiFi):"

        - type: label
          text: !lambda 'return " " + id(mac_wifi).state;'

        - type: label
          text: "AP password:"

        - type: label
          text: !lambda |-
            uint8_t mac[6];
            get_mac_address_raw(mac);
            return " " + str_snprintf("%02x%02x%02x%02x", 8, mac[2], mac[3], mac[4], mac[5]);

    - id: !extend menu_settings_id
      items:
        - type: select
          text: "Network"
          select: network_mode

        - type: menu
          text: "Reset WiFi creds"
          items:
            - type: label
              text: "Reset?"

            - type: command
              text: "Confirm"
              id: wifi_reset_yes
              on_value:
                - lambda: 'id(wifi_reset_yes)->set_text("Confirm - OK");'
                - delay: 1s
                - script.execute: reset_wifi
