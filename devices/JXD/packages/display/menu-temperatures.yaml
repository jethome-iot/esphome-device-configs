# Temperatures: PCB Temp and a submenu per slot of features/temperature.yaml; Settings → Temp
# sensors forgets them all.
graphical_display_menu:
  items:
    # A Temp N submenu per slot up to the last bound one is added at boot (esphome:
    # on_boot below); a freed slot's submenu names the slot and says Free slot.
    - type: menu
      text: "Temperatures"
      id: temperatures_menu
      weight: 30
      items:
        - type: label
          text: !lambda |-
            auto *s = id(pcb_temp);
            if (std::isnan(s->state))
              return str_sprintf("%s: --", s->get_name().c_str());
            return str_sprintf("%s: %.1f°C", s->get_name().c_str(), s->state);

    - id: !extend menu_settings_id
      items:
        # 20: erases data. The board's row, so it comes first in its band.
        - type: menu
          text: "Temp sensors"
          weight: 20
          items:
            - type: label
              text: "Forget all?"

            - type: command
              text: "Confirm"
              id: forget_temps_yes
              on_value:
                - lambda: 'id(forget_temps_yes)->set_text("Confirm - OK");'
                - script.execute:
                    id: forget_temperatures
                    slot: -1

esphome:
  on_boot:
    # After dallas_scan (600) has created the sensors. A slot shows its label, read on every
    # redraw like its reading, so a label set from the dashboard shows at once.
    - priority: 500
      then:
        - lambda: |-
            using namespace display_menu_base;
            using namespace panel_text;
            static constexpr size_t ROW = 18;  // f7x14_mod2 glyphs across the panel
            auto *scan = id(temps);
            auto *font = id(f7x14_mod2);
            const HasGlyph has = [font](uint32_t code_point) { return font->find_glyph(code_point) != nullptr; };
            auto name_of = [scan, has](size_t slot) { return panel_safe(scan->display_name(slot), 4 * ROW, has); };
            auto reading_of = [scan](size_t slot) {
              const float value = scan->temperature(slot);
              return std::isnan(value) ? std::string("--") : str_sprintf("%.1f°C", value);
            };
            for (size_t slot = 0; slot < scan->used_slots(); slot++) {
              // The row shows the reading and opens the slot: its name, its number, the reading,
              // the address, and offset and forget where they change anything. A freed slot
              // between sensors keeps its row and only says that it is free.
              auto *menu = new MenuItemMenu();
              menu->set_text([=](const MenuItem *) { return panel_pair(name_of(slot), reading_of(slot), ROW); });
              // A first row naming the slot, as a relay's submenu has; the submenu opens on the row
              // below it. on_enter also fires on BACK from a child menu, so this one must get none.
              auto *title = new MenuItem(MENU_ITEM_LABEL);
              title->set_text([=](const MenuItem *) { return panel_fit(name_of(slot), ROW); });
              menu->add_item(title);
              menu->add_on_enter_callback([]() { id(display_menu).down(); });
              // The number Home Assistant, Modbus and the thermostats know the slot by, which a
              // label hides everywhere else on the panel.
              auto *number = new MenuItem(MENU_ITEM_LABEL);
              number->set_text(str_sprintf("Slot %u", (unsigned) slot + 1));
              menu->add_item(number);
              if (scan->sensor(slot) == nullptr) {
                auto *note = new MenuItem(MENU_ITEM_LABEL);
                note->set_text("Free slot");
                menu->add_item(note);
                id(temperatures_menu)->add_item(menu);
                continue;
              }
              auto *current = new MenuItem(MENU_ITEM_LABEL);
              current->set_text([=](const MenuItem *) { return "Current: " + reading_of(slot); });
              menu->add_item(current);
              if (const uint64_t rom = scan->address(slot); rom != 0) {
                auto *address = new MenuItem(MENU_ITEM_LABEL);
                address->set_text(str_sprintf("0x%016" PRIx64, rom));
                menu->add_item(address);
              }
              if (!scan->pinned(slot)) {
                // Edited like the settings rows: CENTER opens it, LEFT / RIGHT step by 0.1 up to
                // ±5.0, CENTER or BACK saves it. A save that fails leaves the stored offset shown.
                const int limit = std::lround(dallas_scan::DallasScan::MAX_OFFSET * 10);
                auto stored = [scan, slot]() { return static_cast<int>(std::lround(scan->offset(slot) * 10)); };
                auto *pending = new optional<int>();  // tenths of a degree, while editing
                auto *offset = new MenuItemCustom();
                offset->set_text(std::string("Offset"));
                offset->set_value_lambda([=](const MenuItem *) {
                  const int tenths = pending->value_or(stored());
                  return tenths == 0 ? std::string("0.0°C") : str_sprintf("%+.1f°C", tenths / 10.0f);
                });
                offset->add_on_enter_callback([=]() { *pending = stored(); });
                offset->add_on_next_callback([=]() { *pending = std::min(pending->value_or(stored()) + 1, limit); });
                offset->add_on_prev_callback([=]() { *pending = std::max(pending->value_or(stored()) - 1, -limit); });
                offset->add_on_leave_callback([=]() {
                  if (pending->has_value() && pending->value() != stored())
                    scan->set_offset_and_save(slot, pending->value() / 10.0f);
                  pending->reset();
                });
                menu->add_item(offset);

                auto *question = new MenuItem(MENU_ITEM_LABEL);
                question->set_text("Forget slot?");
                menu->add_item(question);
                auto *confirm = new MenuItemCommand();
                confirm->set_text("Confirm");
                confirm->add_on_value_callback([confirm, slot]() {
                  confirm->set_text("Confirm - OK");
                  id(forget_temperatures)->execute(slot);
                });
                menu->add_item(confirm);
              }
              id(temperatures_menu)->add_item(menu);
            }
