# The board page is the board package's: board_page_show opens it and board_page_key gets the
# presses nothing here takes (doc/ARCHITECTURE.md, the board page).
pca9554:
  - id: jxd_display_exp
    pin_count: 16
    address: 0x24

binary_sensor:
  - platform: gpio
    name: "UP"
    id: up_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 8
      mode:
        input: true
    on_press:
      - lambda: |-
          if (id(display_menu).is_active()) {
            id(display_menu).up();
          } else {
            id(board_page_key)->execute("up");
          }
      - script.execute: check_blank_page

  - platform: gpio
    name: "DOWN"
    id: down_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 9
      mode:
        input: true
    on_press:
      - lambda: |-
          if (id(display_menu).is_active()) {
            id(display_menu).down();
          } else {
            id(board_page_key)->execute("down");
          }
      - script.execute: check_blank_page

  - platform: gpio
    name: "LEFT"
    id: left_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 10
      mode:
        input: true
    on_press:
      - lambda: |-
          auto *page = id(display1).get_active_page();
          if (id(display_menu).is_active()) {
            id(display_menu).left();
          } else if (page == id(main_page) || page == id(blank_page)) {
            id(board_page_show)->execute();
          } else {
            id(board_page_key)->execute("left");
          }
      - script.execute: check_blank_page

  - platform: gpio
    name: "RIGHT"
    id: right_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 11
      mode:
        input: true
    on_press:
      - lambda: |-
          auto *page = id(display1).get_active_page();
          if (id(display_menu).is_active()) {
            id(display_menu).right();
          } else if (page == id(main_page) || page == id(blank_page)) {
            id(display1).show_page(id(time_page));
          } else {
            id(board_page_key)->execute("right");
          }
      - script.execute: check_blank_page

  - platform: gpio
    name: "CENTER"
    id: center_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 12
      mode:
        input: true
    on_press:
      - lambda: |-
          auto *page = id(display1).get_active_page();
          if (id(display_menu).is_active()) {
            id(display_menu).enter();
          } else if (page == id(main_page)) {
            id(display_menu).show_main();
          } else {
            id(board_page_key)->execute("center");
          }
      - script.execute: check_blank_page

  - platform: gpio
    name: "HOME"
    id: home_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 13
      mode:
        input: true
    on_press:
      - lambda: |-
          if (id(display1).get_active_page() != id(main_page)) {
            id(display_menu).hide();
            id(display1).show_page(id(main_page));
          }
      - script.execute: check_blank_page

  - platform: gpio
    name: "BACK"
    id: back_button_id
    internal: true
    pin:
      pca9554: jxd_display_exp
      number: 14
      mode:
        input: true
    on_press:
      - lambda: |-
          // back() is false only at the root with nothing being edited: close the menu then.
          auto *page = id(display1).get_active_page();
          if (id(display_menu).is_active()) {
            if (!id(display_menu).back()) {
              id(display_menu).hide();
              id(display1).show_page(id(main_page));
            }
          } else if (page == id(blank_page)) {
            id(display_off_s) = 0;
            id(display1).show_page(id(main_page));
          } else if (page == id(main_page)) {
            id(display1).show_page(id(blank_page));
          } else {
            id(display1).show_page(id(main_page));
          }
