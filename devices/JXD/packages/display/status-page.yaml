globals:
  # Relay highlighted on the status page; LEFT/RIGHT move it, CENTER toggles the relay.
  - id: status_relay_sel
    type: int
    initial_value: '0'

  # First temperature row shown; UP/DOWN move it.
  - id: status_temp_scroll
    type: int
    initial_value: '0'

# The board page of display/buttons.yaml: LEFT and RIGHT move the relay selection, CENTER
# toggles that relay, UP and DOWN scroll the temperatures.
script:
  - id: board_page_show
    then:
      - lambda: |-
          id(status_relay_sel) = 0;
          id(status_temp_scroll) = 0;
          id(display1).show_page(id(status_page));

  - id: board_page_key
    parameters:
      button: string
    then:
      - lambda: |-
          if (id(display1).get_active_page() != id(status_page))
            return;
          const int n = id(relays).size();
          if (button == "up" || button == "down") {
            id(status_temp_scroll) += button == "up" ? -1 : 1;
            id(display1).update();
          } else if ((button == "left" || button == "right") && n > 0) {
            id(status_relay_sel) = (id(status_relay_sel) + (button == "left" ? n - 1 : 1)) % n;
            id(display1).update();
          } else if (button == "center") {
            const int sel = id(status_relay_sel);
            if (sel >= 0 && sel < n) {
              // A relay a thermostat drives is the thermostat's: the press only logs whose it is.
              auto *relay = id(relays)[sel];
              const std::string holder = switch_hold::holder(relay);
              if (holder.empty()) {
                relay->toggle();
              } else {
                ESP_LOGI("status_page", "'%s' left alone: thermostat '%s' drives it", relay->get_name().c_str(),
                         holder.c_str());
              }
              id(display1).update();
            }
          }

display:
  - platform: ssd1306_i2c
    id: !extend display1
    pages:
      - id: status_page
        lambda: |-
          const auto black = Color(0, 0, 0);
          const int radius = 4;
          const int x_spacing = 15;
          const int x_start = 5;

          it.print(0, 0, id(f5x7), "Relays");
          int x = x_start;
          for (size_t i = 0; i < id(relays).size(); i++) {
            if (id(relays)[i]->state) {
              it.filled_circle(x, 15, radius);
            } else {
              it.circle(x, 15, radius);
            }
            if ((int) i == id(status_relay_sel)) {
              it.filled_rectangle(x - 3, 21, 7, 9);
              it.printf(x - 2, 22, id(f5x7), black, "%d", (int) i + 1);
            } else {
              it.printf(x - 2, 22, id(f5x7), "%d", (int) i + 1);
            }
            x += x_spacing;
          }

          it.print(0, 32, id(f5x7), "Inputs");
          x = x_start;
          int num = 1;
          for (auto *input : id(inputs)) {
            if (input->state) {
              it.filled_circle(x, 47, radius);
            } else {
              it.circle(x, 47, radius);
            }
            it.printf(x - 2, 54, id(f5x7), "%d", num++);
            x += x_spacing;
          }

          // Slots up to the last bound one, three rows, a freed slot reads --.-; UP/DOWN scroll.
          // A slot shows its label, cut to the column's seven glyphs.
          const int rows = 3;
          const size_t columns = 7;
          auto *scan = id(temps);
          auto *small = id(f5x7);
          const panel_text::HasGlyph has = [small](uint32_t code_point) { return small->find_glyph(code_point) != nullptr; };
          const int used = scan->used_slots();
          int &scroll = id(status_temp_scroll);
          scroll = std::clamp(scroll, 0, std::max(used - rows, 0));

          it.print(92, 0, id(f5x7), "Temp");
          if (scroll > 0)
            it.filled_triangle(117, 6, 121, 6, 119, 2);
          if (scroll + rows < used)
            it.filled_triangle(123, 2, 127, 2, 125, 6);

          int y = 11;
          for (int slot = scroll; slot < std::min(scroll + rows, used); slot++) {
            const std::string name = panel_text::panel_safe(scan->display_name(slot), 4 * columns, has);
            it.print(92, y, small, panel_text::panel_fit(name, columns).c_str());
            y += 8;
            const float value = scan->temperature(slot);
            if (std::isnan(value)) {
              it.print(92, y, id(f5x7), "--.-");
            } else {
              it.printf(92, y, id(f5x7), "%.1f", value);
            }
            y += 11;
          }
