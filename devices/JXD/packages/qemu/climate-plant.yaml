# QEMU overlay: a room for the thermostats to control. The emulator has no 1-Wire,
# so no Temp N sensor exists; this one warms while relay_1 is on and cools towards
# 15 °C otherwise.
sensor:
  - platform: template
    id: qemu_room_temperature
    name: "QEMU Room Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    lambda: |-
      static float room = 18.0f;
      room += (id(relay_1).state ? 0.35f : 0.0f) - (room - 15.0f) * 0.02f;
      return room;
    web_server:
      sorting_group_id: group_temperature
      sorting_weight: 0
